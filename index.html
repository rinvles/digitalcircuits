</script>
<script>
/* ---- Kanonik formlar: Σm / ΠM, tümleyen, De Morgan, sayma ----
   Pure generators and checkers first (exported for node); UI below runs only inside the page. */
(function(){
'use strict';

/* ================= pure part ================= */
const rnd=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const VN=['A','B','C','D'];
const allIdx=n=>Array.from({length:1<<n},(_,i)=>i);
const comp=(L,n)=>allIdx(n).filter(i=>!L.includes(i));
const sortU=a=>[...new Set(a)].sort((x,y)=>x-y);
const lst=L=>L.join(', ');
const vars=n=>VN.slice(0,n).join(',');
const bitOf=(i,j,n)=>(i>>(n-1-j))&1;
const minTerm=(i,n)=>VN.slice(0,n).map((v,j)=>bitOf(i,j,n)?v:v+"'").join(' ');
const maxTerm=(i,n)=>'('+VN.slice(0,n).map((v,j)=>bitOf(i,j,n)?v+"'":v).join(' + ')+')';
const binom=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r);};

const TYPE_NAME={s2p:'Σm → ΠM',p2s:'ΠM → Σm',compS:'Tümleyen (Σm)',compP:'Tümleyen (ΠM)',e2s:'İfade → Σm',e2p:'İfade → ΠM',
  i2min:'Mintermi yaz',i2max:'Maxtermi yaz',t2min:'Terimden minterm no',t2max:'Terimden maxterm no',dm:'De Morgan bağlantısı',dc:'Don\'t care\'li fonksiyon',count:'Sayma'};
const TYPES=Object.keys(TYPE_NAME);
const WEIGHTS={s2p:1,p2s:1,compS:.8,compP:.8,e2s:1.2,e2p:1.2,i2min:.8,i2max:.8,t2min:.7,t2max:.7,dm:1,dc:1,count:1.2};
function pickType(last){
  const ts=TYPES.filter(t=>t!==last);let tot=0;ts.forEach(t=>tot+=WEIGHTS[t]);
  let r=Math.random()*tot;for(const t of ts){r-=WEIGHTS[t];if(r<=0)return t;}return ts[0];
}
/* random index list with 2..N-2 entries */
function randList(n){
  const N=1<<n,k=rnd(2,Math.min(N-2,n===3?5:9));
  return sortU(shuf(allIdx(n)).slice(0,k));
}

/* ---- random expression that is neither Σm nor ΠM already ---- */
function lit(v,neg){return neg?v+"'":v;}
function randProd(n,k){
  const vs=shuf(VN.slice(0,n)).slice(0,k).sort();
  return vs.map(v=>lit(v,Math.random()<.4)).join('');
}
function randSum(n,k){
  const vs=shuf(VN.slice(0,n)).slice(0,k).sort();
  return '('+vs.map(v=>lit(v,Math.random()<.4)).join('+')+')';
}
function randExpr(n){
  const E=require_expr();
  for(let t=0;t<200;t++){
    const form=pick(['sop','sop','pos','mix','mix2']);
    let s;
    if(form==='sop'){const m=rnd(2,3),ps=[];for(let i=0;i<m;i++)ps.push(randProd(n,rnd(1,Math.min(3,n))));s=ps.join(' + ');}
    else if(form==='pos'){const m=rnd(2,3),ps=[];for(let i=0;i<m;i++)ps.push(randSum(n,rnd(2,Math.min(3,n))));s=ps.join('');}
    else if(form==='mix'){const v=pick(VN.slice(0,n));s=lit(v,Math.random()<.4)+randSum(n,2)+' + '+randProd(n,2);}
    else{s=randSum(n,2)+'('+randProd(n,2)+' + '+lit(pick(VN.slice(0,n)),Math.random()<.5)+')';}
    let ast;try{ast=E.parseExpr(s);}catch(e){continue;}
    const vs=VN.slice(0,n);
    if(E.exprVars(ast).length<n)continue;
    const tv=E.truthVec(ast,vs),ones=tv.reduce((a,b)=>a+b,0);
    if(ones<2||ones>(1<<n)-2)continue;
    return{s,ones:tv.map((v,i)=>v?i:-1).filter(i=>i>=0)};
  }
  return{s:"AB + C'",ones:null};
}
function require_expr(){
  if(typeof module!=='undefined'&&typeof require==='function')return require('../expr.js');
  return{parseExpr,evalNode,exprVars,truthVec,literalCount,sameFunction,parseIntList};
}

/* ---- question generators ---- */
function genQuestion(n,last){
  const type=pickType(last);
  const N=1<<n,q={type,n,N};
  const fname=n===3?'f(A,B,C)':'f(A,B,C,D)';
  switch(type){
    case's2p':{const L=randList(n);q.stmt=fname+' = Σm('+lst(L)+')';q.task='f\'yi ΠM (maxterm çarpımı) olarak yaz. Maxterm numaralarını gir.';q.ans={kind:'list',v:comp(L,n)};q.ctx=L;break;}
    case'p2s':{const L=randList(n);q.stmt=fname+' = ΠM('+lst(L)+')';q.task='f\'yi Σm (minterm toplamı) olarak yaz. Minterm numaralarını gir.';q.ans={kind:'list',v:comp(L,n)};q.ctx=L;break;}
    case'compS':{const L=randList(n);q.stmt=fname+' = Σm('+lst(L)+')';q.task='f\' (f\'nin tümleyeni) için Σm listesini yaz.';q.ans={kind:'list',v:comp(L,n)};q.ctx=L;break;}
    case'compP':{const L=randList(n);q.stmt=fname+' = ΠM('+lst(L)+')';q.task='f\' (f\'nin tümleyeni) için ΠM listesini yaz.';q.ans={kind:'list',v:comp(L,n)};q.ctx=L;break;}
    case'e2s':case'e2p':{
      const e=randExpr(n);q.stmt=fname+' = '+e.s;
      q.task=type==='e2s'?'İfadeyi kanonik Σm biçimine çevir. Minterm numaralarını gir.':'İfadeyi kanonik ΠM biçimine çevir. Maxterm numaralarını gir.';
      q.expr=e.s;const ones=e.ones||[];q.ans={kind:'list',v:type==='e2s'?ones:comp(ones,n)};q.ctx=ones;break;}
    case'i2min':{const i=rnd(0,N-1);q.idx=i;q.stmt='m'+i+'  ('+vars(n)+')';q.task=n+' değişkenli (A en anlamlı bit) fonksiyonda m'+i+' mintermini çarpım terimi olarak yaz.';q.ans={kind:'term',form:'min',i};break;}
    case'i2max':{const i=rnd(0,N-1);q.idx=i;q.stmt='M'+i+'  ('+vars(n)+')';q.task=n+' değişkenli (A en anlamlı bit) fonksiyonda M'+i+' maxtermini toplam terimi olarak yaz.';q.ans={kind:'term',form:'max',i};break;}
    case't2min':{const i=rnd(0,N-1);q.idx=i;q.stmt=minTerm(i,n);q.task='Bu çarpım terimi ('+vars(n)+', A en anlamlı bit) kaçıncı mintermdir? Numarayı gir.';q.ans={kind:'num',v:i};break;}
    case't2max':{const i=rnd(0,N-1);q.idx=i;q.stmt=maxTerm(i,n);q.task='Bu toplam terimi ('+vars(n)+', A en anlamlı bit) kaçıncı maxtermdir? Numarayı gir.';q.ans={kind:'num',v:i};break;}
    case'dm':{
      const L=randList(n);
      if(Math.random()<.5){q.stmt='f\' = Σm('+lst(L)+')   ('+fname+')';q.task='f\'yi ΠM olarak yaz. De Morgan: f\' = Σm(L) ise f = ΠM(?).';q.ans={kind:'list',v:L};q.ctx=L;q.v=1;}
      else{q.stmt=fname+' = Σm('+lst(L)+')';q.task='f\' fonksiyonunu ΠM biçiminde yaz (f\' = ΠM(?)).';q.ans={kind:'list',v:L};q.ctx=L;q.v=2;}
      break;}
    case'dc':{
      const L=randList(n);const rest=comp(L,n);if(rest.length<3){return genQuestion(n,type);}
      const D=sortU(shuf(rest).slice(0,rnd(1,Math.min(3,rest.length-1))));
      q.ctx=L;q.dc=D;q.stmt=fname+' = Σm('+lst(L)+') + Σφ('+lst(D)+')';
      q.task='Aynı fonksiyonu ΠM biçiminde yaz: ΠM(…) · Πφ('+lst(D)+'). Sadece ΠM listesini (don\'t care olmayan sıfırlar) gir.';
      q.ans={kind:'list',v:comp(sortU(L.concat(D)),n)};break;}
    case'count':{
      const v=pick(['funcs','kmin','dcfill','dual']);q.v=v;
      if(v==='funcs'){q.stmt=n+' değişkenli Boole fonksiyonları';q.task='Kaç farklı '+n+' değişkenli Boole fonksiyonu vardır? Sayıyı ya da 2^k biçimini yaz.';q.ans={kind:'num',v:Math.pow(2,N)};}
      else if(v==='kmin'){const k=rnd(1,n===3?3:4);q.k=k;q.stmt=n+' değişken, tam '+k+' minterm';q.task=n+' değişkenli kaç farklı fonksiyonun Σm gösteriminde tam '+k+' minterm vardır?';q.ans={kind:'num',v:binom(N,k)};}
      else if(v==='dcfill'){const d=rnd(2,n===3?4:5);q.d=d;q.stmt='Σm (sabit) + '+d+' adet don\'t care';q.task='Bir fonksiyonun mintermleri belli, '+d+' girişi don\'t care. Don\'t care\'leri 0 ya da 1 seçerek kaç farklı tam tanımlı fonksiyon elde edilir?';q.ans={kind:'num',v:Math.pow(2,d)};}
      else{const k=rnd(2,N-2);q.k=k;q.stmt=n+' değişken, Σm içinde '+k+' terim';q.task='Bir fonksiyonun Σm gösteriminde '+k+' minterm var ('+n+' değişken). Aynı fonksiyonun ΠM gösteriminde kaç maxterm vardır?';q.ans={kind:'num',v:N-k};}
      break;}
  }
  return q;
}

/* ---- parsing user answers ---- */
function parseNum(s){
  s=String(s).trim().replace(/\s+/g,'');
  let m=s.match(/^(\d+)\^(\d+)$/);if(m)return Math.pow(+m[1],+m[2]);
  m=s.match(/^(\d+)$/);if(m)return +m[1];
  m=s.match(/^(\d{1,3}([.,]\d{3})+)$/);if(m)return +s.replace(/[.,]/g,'');
  return null;
}
function termCheck(q,str){
  const E=require_expr();let ast;
  try{ast=E.parseExpr(str);}catch(e){return{ok:false,msg:'İfade okunamadı: '+e.message};}
  const n=q.n,vs=VN.slice(0,n);
  const used=E.exprVars(ast);
  if(used.length!==n||E.literalCount(ast)!==n)return{ok:false,msg:'Kanonik terimde her değişken tam bir kez geçer ('+n+' literal).'};
  const tv=E.truthVec(ast,vs),i=q.ans.i;
  if(q.ans.form==='min'){
    if(tv.filter(v=>v).length!==1)return{ok:false,msg:'Bir minterm tek bir satırda 1 olur. Yazdığın terim çarpım biçiminde değil.'};
    return tv[i]===1?{ok:true}:{ok:false,msg:'Terim geçerli bir minterm ama bu numaraya ait değil.'};
  }
  if(tv.filter(v=>!v).length!==1)return{ok:false,msg:'Bir maxterm tek bir satırda 0 olur. Yazdığın terim toplam biçiminde değil.'};
  return tv[i]===0?{ok:true}:{ok:false,msg:'Terim geçerli bir maxterm ama bu numaraya ait değil.'};
}
function check(q,input){
  const a=q.ans,s=String(input||'').trim();
  if(!s)return{ok:false,empty:true,msg:'Önce bir cevap gir.'};
  if(a.kind==='list'){
    const got=sortU(require_expr().parseIntList(s)),want=a.v;
    const bad=got.filter(x=>x<0||x>=q.N);
    if(bad.length)return{ok:false,msg:'Listede aralık dışı numara var (0 ile '+(q.N-1)+' arası olmalı).'};
    const miss=want.filter(x=>!got.includes(x)),extra=got.filter(x=>!want.includes(x));
    if(!miss.length&&!extra.length)return{ok:true,msg:'Liste tam ve doğru ('+want.length+' terim).'};
    const p=[];
    if(miss.length)p.push(miss.length+' numara eksik');
    if(extra.length)p.push(extra.length+' numara fazla');
    return{ok:false,msg:p.join(', ')+'. Listede '+got.length+' numara var, doğrusunda '+want.length+' olmalı.'};
  }
  if(a.kind==='num'){
    const v=parseNum(s);
    if(v===null)return{ok:false,msg:'Sayı olarak okunamadı. Örn. 70 ya da 2^16.'};
    if(v===a.v)return{ok:true,msg:'Doğru: '+a.v+'.'};
    return{ok:false,msg:v>a.v?'Sonuç bundan küçük.':'Sonuç bundan büyük.'};
  }
  const r=termCheck(q,s);
  return r.ok?{ok:true,msg:'Doğru terim.'}:{ok:false,msg:r.msg};
}

/* ---- hints & solutions ---- */
function hints(q){
  const n=q.n,N=q.N;
  switch(q.type){
    case's2p':return['Σm ve ΠM aynı fonksiyonu anlatır: bir satır ya mintermdir (f=1) ya maxterm (f=0).','Toplam '+N+' satır var (0 ile '+(N-1)+'). Σm listesinde olmayan her numara ΠM listesindedir.'];
    case'p2s':return['ΠM listesi f=0 olan satırlardır. Geri kalanlar f=1\'dir.','0 ile '+(N-1)+' arasındaki numaralardan ΠM\'de olmayanları yaz.'];
    case'compS':return['f\' hangi satırlarda 1\'dir? f\'nin 0 olduğu satırlarda.','Listede olmayan numaralar.'];
    case'compP':return['f\' hangi satırlarda 0\'dır? f\'nin 1 olduğu satırlarda.','ΠM(L) ise f, L dışındaki satırlarda 1\'dir. f\' bu satırlarda 0 olur.'];
    case'e2s':case'e2p':return['İfadeyi '+N+' satır için sırayla değerlendir (A en anlamlı bit: 000, 001, …).','Çarpım terimi, içindeki tüm literaller 1 ise 1 verir. Toplam terimi, tüm literaller 0 ise 0 verir.',(q.type==='e2s'?'Σm: ifadenin 1 olduğu satır numaraları.':'ΠM: ifadenin 0 olduğu satır numaraları.')];
    case'i2min':return['Numarayı '+n+' bitlik ikilik yaz (A en soldaki bit).','Minterm\'de bit 1 ise değişken olduğu gibi, bit 0 ise tümleyeniyle yazılır.'];
    case'i2max':return['Numarayı '+n+' bitlik ikilik yaz (A en soldaki bit).','Maxterm\'de bit 0 ise değişken olduğu gibi, bit 1 ise tümleyeniyle yazılır (minterm\'in tersi).'];
    case't2min':return['Her literal için asıl değişken ise 1, tümleyeniyle ise 0 yaz.','Elde ettiğin '+n+' bitlik ikilik sayıyı ondalığa çevir.'];
    case't2max':return['Maxterm\'de asıl değişken ise 0, tümleyeniyle ise 1 yaz.','Elde ettiğin '+n+' bitlik ikilik sayıyı ondalığa çevir.'];
    case'dm':return['M_i = (m_i)\'. Yani f\'nin mintermleri f\'nin ΠM\'sinde değil, f\'nin kendi ΠM\'sinde maxterm numarası olur.','Σm(L) ile ifade edilen fonksiyonun tümleyeni ΠM(L) olur; f\' = Σm(L) ise f = ΠM(L).'];
    case'dc':return['ΠM listesine yalnızca f=0 olan satırlar girer.','Don\'t care satırları ne mintermdir ne maxterm. Bu yüzden iki listede de bulunmazlar.','Numaralar: tüm satırlar eksi Σm eksi Σφ.'];
    case'count':
      if(q.v==='funcs')return['Doğruluk tablosunda '+N+' satır var ve her satır 0 ya da 1 olabilir.','Sonuç 2^'+N+'.'];
      if(q.v==='kmin')return[N+' satırdan hangi k tanesinin 1 olacağını seçiyorsun.','C('+N+', '+q.k+') kombinasyonu.'];
      if(q.v==='dcfill')return['Her don\'t care bağımsız olarak 0 ya da 1 olabilir.','Her biri 2 seçenek: 2^d.'];
      return['Her satır minterm ya da maxterm olur, ikisi birden olmaz.','Maxterm sayısı = toplam satır − minterm sayısı.'];
  }
  return[];
}
function solution(q){
  const n=q.n,N=q.N,a=q.ans;
  const L=x=>'`'+lst(x)+'`';
  switch(q.type){
    case's2p':return['Tüm numaralar: 0 ile '+(N-1)+'.','Σm listesinde olmayanlar f=0 satırlarıdır: '+L(a.v)+'.','f = ΠM('+lst(a.v)+')'];
    case'p2s':return['Tüm numaralar: 0 ile '+(N-1)+'.','ΠM listesinde olmayanlar f=1 satırlarıdır: '+L(a.v)+'.','f = Σm('+lst(a.v)+')'];
    case'compS':return['f\' tam olarak f\'nin 0 olduğu satırlarda 1\'dir.','f\' = Σm('+lst(a.v)+')'];
    case'compP':return['f\' tam olarak f\'nin 1 olduğu satırlarda 0\'dır; ΠM(L) ise bunlar L dışındaki satırlardır.','f\' = ΠM('+lst(a.v)+')'];
    case'e2s':case'e2p':{
      const ones=q.ctx,zeros=comp(ones,n);
      return['İfadeyi '+N+' satır için değerlendir.','f=1 olan satırlar: '+L(ones)+'. f=0 olan satırlar: '+L(zeros)+'.',q.type==='e2s'?'Σm('+lst(ones)+')':'ΠM('+lst(zeros)+')'];}
    case'i2min':{const b=q.idx.toString(2).padStart(n,'0');return[q.idx+' = '+b+' (ikilik).','Bit 1 → değişken, bit 0 → tümleyen.','m'+q.idx+' = `'+minTerm(q.idx,n)+'`'];}
    case'i2max':{const b=q.idx.toString(2).padStart(n,'0');return[q.idx+' = '+b+' (ikilik).','Bit 0 → değişken, bit 1 → tümleyen.','M'+q.idx+' = `'+maxTerm(q.idx,n)+'`'];}
    case't2min':{const b=q.idx.toString(2).padStart(n,'0');return['Asıl değişken → 1, tümleyen → 0: '+b+'.','İkilik '+b+' = '+q.idx+'.','Bu terim m'+q.idx+'.'];}
    case't2max':{const b=q.idx.toString(2).padStart(n,'0');return['Asıl değişken → 0, tümleyen → 1: '+b+'.','İkilik '+b+' = '+q.idx+'.','Bu terim M'+q.idx+'.'];}
    case'dm':return['M_i = (m_i)\' olduğundan Σm(L) fonksiyonunun tümleyeni ΠM(L) olur.',q.v===1?'f\' = Σm('+lst(a.v)+') ise f = ΠM('+lst(a.v)+').':'f = Σm('+lst(a.v)+') ise f\' = ΠM('+lst(a.v)+').'];
    case'dc':return['ΠM listesi: yalnızca f=0 olan satırlar.','Σm ve Σφ dışında kalanlar: '+L(a.v)+'.','f = ΠM('+lst(a.v)+') · Πφ('+lst(q.dc)+')'];
    case'count':
      if(q.v==='funcs')return[N+' satır, her biri 0 ya da 1.','2^'+N+' = '+a.v];
      if(q.v==='kmin')return[N+' satırdan '+q.k+' tanesini 1 seç.','C('+N+', '+q.k+') = '+a.v];
      if(q.v==='dcfill')return['Her don\'t care için 2 seçenek.','2^'+q.d+' = '+a.v];
      return['Her satır minterm ya da maxterm: toplam '+N+'.',N+' − '+q.k+' = '+a.v];
  }
  return[];
}
function answerText(q){
  const a=q.ans;
  if(a.kind==='list')return lst(a.v);
  if(a.kind==='num')return String(a.v);
  return a.form==='min'?minTerm(a.i,q.n):maxTerm(a.i,q.n);
}

if(typeof module!=='undefined'){module.exports={genQuestion,check,hints,solution,answerText,parseNum,minTerm,maxTerm,comp,TYPES,TYPE_NAME,pickType,binom};return;}

/* ================= UI part ================= */
const {esc,fb,fbHTML,render}=Core;
const T=Core.timer();
let root=null;
const S={n:3,q:null,qno:0,last:null,input:'',fb:null,phase:'ask',hint:0,hintShown:[],attempts:0};

function newQuestion(){
  S.q=genQuestion(S.n,S.last);S.last=S.q.type;S.qno++;S.input='';S.fb=null;S.phase='ask';S.hint=0;S.hintShown=[];S.attempts=0;

}
const REF=`<details class="cn-ref"><summary>Hatırlatma</summary><div class="cn-refbody">
<p><b>Minterm m<sub>i</sub></b>: i\'nin ikilik karşılığında bit 1 ise değişken, bit 0 ise tümleyen yazılır; terimler çarpılır. Yalnızca o satırda 1 olur. A en anlamlı bit.</p>
<p><b>Maxterm M<sub>i</sub></b>: bit 0 ise değişken, bit 1 ise tümleyen yazılır; terimler toplanır. Yalnızca o satırda 0 olur. M<sub>i</sub> = (m<sub>i</sub>)\'.</p>
<p><b>Σm(L)</b> f=1 olan satırları, <b>ΠM(K)</b> f=0 olan satırları listeler. Aynı fonksiyon için K, L\'nin tümleyenidir (0 ile 2<sup>n</sup>−1 arası).</p>
<p><b>Tümleyen</b>: f\' için 1 ve 0 satırları yer değiştirir. Σm(L) fonksiyonunun f\'si Σm(L\'nin tümleyeni) = ΠM(L).</p>
<p><b>Don\'t care Σφ</b>: ne minterm ne maxterm sayılır, iki listede de yer almaz.</p>
<p><b>Sayma</b>: n değişkenli fonksiyon sayısı 2<sup>2<sup>n</sup></sup>. Tam k minterm içeren: C(2<sup>n</sup>, k). d don\'t care: 2<sup>d</sup> tamamlama.</p>
</div></details>`;

function placeholder(q){
  const a=q.ans;
  if(a.kind==='list')return'örn. 0, 3, 5, 6';
  if(a.kind==='num')return q.type==='count'?'örn. 70 ya da 2^16':'örn. 5';
  return a.form==='min'?"örn. A B' C":"örn. (A + B' + C)";
}
function draw(){
  const q=S.q,done=S.phase!=='ask',hs=hints(q);
  const ctl=`<div class="controls"><div class="ctl"><span class="lab">Değişken sayısı</span><div class="seg" role="group" aria-label="Değişken sayısı">${[3,4].map(w=>`<button type="button" data-act="n" data-v="${w}" data-fk="n-${w}" aria-pressed="${S.n===w}">${w} değişken</button>`).join('')}</div></div></div>`;
  const hintBox=S.hintShown.length?`<div class="fb info"><strong>İpucu</strong>${S.hintShown.map((t,i)=>`<p>${i+1}. ${esc(t)}</p>`).join('')}</div>`:'';
  const sol=S.phase==='rev'?`<div class="cn-sol"><strong>Çözüm</strong><ol>${solution(q).map(l=>`<li>${esc(l).replace(/`([^`]+)`/g,'<code>$1</code>')}</li>`).join('')}</ol></div>`:'';
  const ph=placeholder(q);
  render(root,ctl+`<div class="card cn-card">
    <div class="qhead"><span class="qno">Soru ${S.qno} · ${esc(TYPE_NAME[q.type])}</span>${T.html()}</div>
    <p class="task">${esc(q.task)}</p>
    <div class="fn cn-fn">${esc(q.stmt)}</div>
    <div class="cn-ans"><label for="cn-in">Cevap</label><input id="cn-in" class="cn-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(ph)}" value="${esc(S.input)}" data-fk="cn-in"${done?' disabled':''}></div>
    ${hintBox}<div aria-live="polite">${fbHTML(S.fb)}</div>${sol}
    <div class="row">
      <button type="button" class="btn primary" data-act="check"${done?' disabled':''}>Kontrol et</button>
      <button type="button" class="btn" data-act="hint"${done||S.hint>=hs.length?' disabled':''}>İpucu${hs.length&&!done?` (${S.hint}/${hs.length})`:''}</button>
      <button type="button" class="btn ghost" data-act="reveal"${done?' disabled':''}>Çözümü göster</button>
      <button type="button" class="btn${done?' primary':' ghost'}" data-act="next" data-fk="next">${done?'Sonraki soru':'Yeni soru (atla)'}</button>
    </div>
  </div>`+REF);
}
function doCheck(){
  if(S.phase!=='ask')return;
  const r=check(S.q,S.input);
  if(r.empty){S.fb=fb('warn','Eksik cevap',esc(r.msg));draw();return;}
  if(r.ok){S.phase='done';T.stop();Core.credit(T.elapsed());S.fb=fb('ok','Doğru',esc(r.msg)+'<br>Süre '+Core.fmtTime(T.elapsed())+'.');}
  else{S.attempts++;S.fb=fb('bad','Henüz değil',esc(r.msg));}
  draw();
}
function doHint(){
  if(S.phase!=='ask')return;
  const hs=hints(S.q);if(S.hint>=hs.length)return;
  S.hintShown.push(hs[S.hint]);S.hint++;draw();
}
function doReveal(){
  if(S.phase!=='ask')return;
  S.phase='rev';S.input=answerText(S.q);T.stop();Core.breakStreak();
  S.fb=fb('info','Çözüm gösterildi','Bu soru için puan yok. Cevap: '+esc(answerText(S.q))+'.');draw();
}
Pages.canon={
  mount(el){
    root=el;
    root.addEventListener('click',e=>{
      const t=e.target.closest('[data-act]');if(!t||!root.contains(t))return;
      const act=t.dataset.act;
      if(act==='check')doCheck();else if(act==='hint')doHint();else if(act==='reveal')doReveal();
      else if(act==='next'){newQuestion();draw();}
      else if(act==='n'){const w=+t.dataset.v;if(w!==S.n){S.n=w;S.last=null;newQuestion();}draw();}
    });
    root.addEventListener('input',e=>{if(e.target.id==='cn-in')S.input=e.target.value;});
    root.addEventListener('keydown',e=>{if(e.target.id==='cn-in'&&e.key==='Enter'){e.preventDefault();S.input=e.target.value;doCheck();}});
    newQuestion();draw();
  }
};
})();

<script>
/* ---- "simp": step-by-step Boolean simplification with named theorems ----
   Part 1: the pure engine (no DOM, no Core). Exported for node (tools/gen_simp.js, tools/test_simp.js).
   Part 2: the page, only created when Core exists.
   Clause model: {lits:[sorted literal codes], grp:null|[2v,2v+1], k:''|'id'|'ann'|'neu', key}
     literal code = 2*varIndex + (1 if complemented)
     plain  : an ordinary term (SOP) or sum (POS), the same literal-set rules apply to both forms
     grp    : factored clause X(Y+Y') (SOP) or X+YY' (POS), made by Distributive
     k='id' : X.1 (SOP) / X+0 (POS), made by Inverse, removed by Identity
     k='ann': X.0 (SOP) / X+1 (POS), made by Inverse on a clause that holds x and x'
     k='neu': standalone neutral constant, 0 in SOP / 1 in POS (Identity removes it)
   A plain clause with no literals is the dominating constant, 1 in SOP / 0 in POS (Annihilator). */
(function(){
'use strict';
const L=(typeof analyze!=='undefined')?{analyze:analyze,cubeKey:cubeKey}:require('../logic.js');

/* ================= engine ================= */
const DEFNAMES=['A','B','C','D'];
const TH=[
  {id:'comm',name:'Commutative'},{id:'dist',name:'Distributive'},{id:'iden',name:'Identity'},{id:'inv',name:'Inverse'},
  {id:'idem',name:'Idempotency'},{id:'ann',name:'Annihilator'},{id:'invol',name:'Involution'},{id:'abs',name:'Absorption'},
  {id:'dm',name:'De Morgan'},{id:'cons',name:'Consensus'}
];
const THNAME={};TH.forEach(t=>{THNAME[t.id]=t.name;});

function mk(lits,grp,k){
  const ls=[...new Set(lits)].sort((a,b)=>a-b);
  const c={lits:ls,grp:grp?grp.slice():null,k:k||''};
  c.key=ls.join('.')+'|'+(c.grp?c.grp.join('.'):'')+'|'+c.k;
  return c;
}
const isPlain=c=>c.k===''&&!c.grp;
const isContra=c=>c.lits.some(l=>c.lits.includes(l^1));
const okPlain=c=>isPlain(c)&&!isContra(c);
const litStr=(l,nm)=>nm[l>>1]+((l&1)?"'":'');

function fmtClause(c,form,nm){
  nm=nm||DEFNAMES;
  const ls=c.lits.map(l=>litStr(l,nm));
  if(form==='sop'){
    if(c.k==='neu')return'0';
    if(c.grp)return ls.join('')+'('+litStr(c.grp[0],nm)+'+'+litStr(c.grp[1],nm)+')';
    if(c.k==='id')return(ls.join('')||'1')+'·1';
    if(c.k==='ann')return(ls.join('')||'1')+'·0';
    return ls.join('')||'1';
  }
  if(c.k==='neu')return'1';
  if(c.grp)return'('+ls.concat([litStr(c.grp[0],nm)+litStr(c.grp[1],nm)]).join('+')+')';
  if(c.k==='id')return'('+(ls.length?ls.join('+')+'+0':'0+0')+')';
  if(c.k==='ann')return'('+(ls.length?ls.join('+')+'+1':'0+1')+')';
  if(!ls.length)return'0';
  return ls.length===1?ls[0]:'('+ls.join('+')+')';
}
function fmtState(st,form,nm){
  if(!st.length)return form==='sop'?'0':'1';
  const p=st.map(c=>fmtClause(c,form,nm));
  return form==='sop'?p.join(' + '):p.join('');
}

/* cube of the cells a clause "covers": SOP = cells where the term is 1, POS = cells where the sum is 0 */
function cubeOf(c,form,n){
  if(c.k==='ann'||c.k==='neu'||isContra(c))return null;
  let mask=0,val=0;
  for(const l of c.lits){
    const b=1<<(n-1-(l>>1));mask|=b;
    const neg=l&1;
    if(form==='sop'?!neg:neg)val|=b;
  }
  return{mask,val};
}
function coverBits(st,form,n){
  let bits=0;
  for(const c of st){
    const cu=cubeOf(c,form,n);if(!cu)continue;
    for(let m=0;m<(1<<n);m++)if((m&cu.mask)===cu.val)bits|=(1<<m);
  }
  return bits;
}
function sortState(st){return st.slice().sort((a,b)=>a.key<b.key?-1:a.key>b.key?1:0);}
function stateKey(st){return st.map(c=>c.key).join(';');}
function problemState(P){return P.clauses.map(ls=>mk(ls));}
function problemCtx(P){return{form:P.form,names:P.names||DEFNAMES.slice(0,P.vars),n:P.vars};}

function makeGoal(P){
  const n=P.vars,form=P.form;
  const bits=coverBits(problemState(P),form,n);
  const target=[];
  for(let m=0;m<(1<<n);m++)if((bits>>m)&1)target.push(m);
  const g={n,form,bits,target,constant:!target.length,sols:null};
  if(target.length){
    const an=L.analyze(target,target,n,form==='pos'?'pos':'sop','terms');
    g.sols=new Set(an.sols.map(s=>s.map(i=>L.cubeKey(an.prims[i])).sort().join(';')));
  }
  return g;
}
function isGoal(st,g){
  if(g.constant)return st.length===1&&st[0].k==='neu';
  if(!st.length||!st.every(isPlain))return false;
  const ks=[];
  for(const c of st){const cu=cubeOf(c,g.form,g.n);if(!cu)return false;ks.push(L.cubeKey(cu));}
  return g.sols.has(ks.sort().join(';'));
}

/* consensus of two plain clauses: exactly one biform variable */
function consOf(a,b){
  const conf=[];
  for(const l of a.lits)if(b.lits.includes(l^1))conf.push(l>>1);
  const vs=[...new Set(conf)];
  if(vs.length!==1)return{err:vs.length?'many':'none',vs};
  const v=vs[0];
  const lits=a.lits.filter(l=>(l>>1)!==v).concat(b.lits.filter(l=>(l>>1)!==v));
  return{v,clause:mk(lits)};
}
function redundantBy(st,i){
  const c=st[i];
  if(!okPlain(c))return null;
  for(let j=0;j<st.length;j++){
    if(j===i||!okPlain(st[j]))continue;
    for(let k=j+1;k<st.length;k++){
      if(k===i||!okPlain(st[k]))continue;
      const r=consOf(st[j],st[k]);
      if(r.clause&&r.clause.key===c.key)return[j,k];
    }
  }
  return null;
}
const properSub=(t,s)=>t.lits.length>0&&t.lits.length<s.lits.length&&t.lits.every(l=>s.lits.includes(l));

/* The one authority on what a step may do. Returns {ok:true,state,note} or {ok:false,msg}.
   ctx={form,names,quiet}. Does not mutate `state`. */
function applyOp(state,th,selIn,ctx){
  const sel=[...new Set(selIn)].sort((a,b)=>a-b);
  const form=ctx.form,nm=ctx.names||DEFNAMES,q=!!ctx.quiet;
  const F=c=>fmtClause(c,form,nm);
  const bad=m=>({ok:false,msg:q?'':m()});
  const good=(st,note)=>({ok:true,state:st,note:q?'':(note?note():'')});
  const SUM=form==='sop'?'Y + Y\'':'YY\'';
  if(th==='comm')return bad(()=>'Commutative yalnızca sırayı değiştirir (XY = YX, X + Y = Y + X). Terim sayısını azaltmaz, bu ifadede gerekmiyor.');
  if(th==='invol')return bad(()=>'Involution çift tümleyeni siler: (X\')\' = X. İfadede çift tümleyen yok.');
  if(th==='dm')return bad(()=>'De Morgan için tümleyeni bir grubun dışında olan bir ifade gerekir, örneğin (X + Y)\'. İfadede böyle bir grup yok.');
  if(!sel.length)return bad(()=>'Önce uygulayacağın terimleri seç.');
  if(sel.some(i=>!(i>=0&&i<state.length)))return bad(()=>'Geçersiz seçim.');
  const C=sel.map(i=>state[i]);
  const without=idx=>state.filter((_,i)=>!idx.includes(i));

  if(th==='cons'){
    if(C.some(c=>!isPlain(c)))return bad(()=>'Consensus yalnızca sade terimlere uygulanır. İçinde parantezli çarpan ya da ·1 / +0 olan terimi önce Identity ile temizle.');
    if(C.some(isContra))return bad(()=>'Bir terimde hem x hem x\' var. Consensus için önce Inverse uygula.');
    if(sel.length===2){
      const r=consOf(C[0],C[1]);
      if(r.err==='none')return bad(()=>'Bu iki terimde biform değişken yok, consensus olmaz. Birinde x, ötekinde x\' olmalı.');
      if(r.err==='many')return bad(()=>'Bu iki terimde birden fazla değişken ters ('+r.vs.map(v=>nm[v]).join(', ')+'). Consensus için tam olarak bir biform değişken olmalı.');
      if(state.some(c=>c.key===r.clause.key))return bad(()=>'Consensus terimi '+F(r.clause)+' ifadede zaten var.');
      return good(state.concat([r.clause]),()=>'Eklenen consensus terimi: '+F(r.clause)+' ('+nm[r.v]+' değişkeni elendi).');
    }
    if(sel.length===1){
      const p=redundantBy(state,sel[0]);
      if(!p)return bad(()=>F(C[0])+' terimi, kalan terimlerden herhangi ikisinin consensus terimine eşit değil, çıkarılamaz.');
      return good(without([sel[0]]),()=>F(C[0])+', '+F(state[p[0]])+' ile '+F(state[p[1]])+' teriminin consensus\'u olduğu için çıkarıldı.');
    }
    if(sel.length===3){
      for(let t=0;t<3;t++){
        const a=C[(t+1)%3],b=C[(t+2)%3],r=consOf(a,b);
        if(r.clause&&r.clause.key===C[t].key)return good(without([sel[t]]),()=>F(C[t])+', '+F(a)+' ile '+F(b)+' teriminin consensus\'u olduğu için çıkarıldı.');
      }
      return bad(()=>'Seçilen üç terimde biri, öteki ikisinin consensus terimine eşit değil.');
    }
    return bad(()=>'Consensus için ya 2 terim (consensus terimi eklenir) ya da çıkarılacak 1 terim seç.');
  }

  if(th==='abs'){
    if(C.some(c=>!okPlain(c)))return bad(()=>'Absorption yalnızca sade terimlere uygulanır.');
    const S=new Set(sel);
    let fail=null;
    for(let t=0;t<C.length&&!fail;t++){
      const s=C[t];
      if(!state.some((u,j)=>!S.has(j)&&okPlain(u)&&properSub(u,s)))fail=s;
    }
    if(!fail)return good(without(sel),()=>C.map(F).join(', ')+' yutuldu.');
    if(sel.length===2){
      for(const [xi,yi] of [[0,1],[1,0]]){
        const x=C[xi],y=C[yi];
        if(x.lits.length===1&&y.lits.length>=2&&y.lits.includes(x.lits[0]^1)){
          const ny=mk(y.lits.filter(l=>l!==(x.lits[0]^1)));
          const out=state.slice();out[sel[yi]]=ny;
          return good(out,()=>F(y)+' teriminden '+litStr(x.lits[0]^1,nm)+' atıldı: '+F(x)+' ile birlikte X + X\'Y = X + Y.');
        }
      }
    }
    return bad(()=>F(fail)+' terimini yutacak bir terim yok. Yutan terimin harfleri, yutulanın harflerinin bir alt kümesi olmalı (X + XY = X). Ya da X ve X\'Y içeren iki terim seç (X + X\'Y = X + Y).');
  }

  if(th==='idem'){
    if(sel.length!==2)return bad(()=>'Idempotency için birbirinin aynısı olan iki terim seç.');
    if(C[0].key!==C[1].key||!isPlain(C[0]))return bad(()=>F(C[0])+' ile '+F(C[1])+' aynı terim değil.');
    return good(without([sel[1]]),()=>F(C[0])+' terimlerinden biri silindi.');
  }

  if(th==='dist'){
    if(sel.length!==2)return bad(()=>'Distributive ile birleştirmek için XY ve XY\' gibi iki terim seç.');
    if(C.some(c=>!okPlain(c)))return bad(()=>'Distributive burada yalnızca iki sade terime uygulanır.');
    const [a,b]=C;
    const va=a.lits.map(l=>l>>1),vb=b.lits.map(l=>l>>1);
    if(va.length!==vb.length||va.some((v,i)=>v!==vb[i]))return bad(()=>'Bu iki terimin değişkenleri aynı değil. Biri hariç harfleri ve işaretleri aynı olmalı (XY ve XY\').');
    const d=[];a.lits.forEach((l,i)=>{if(l!==b.lits[i])d.push(i);});
    if(d.length===0)return bad(()=>'Bu iki terim birbirinin aynısı, tümleyen çifti yok.');
    if(d.length>1)return bad(()=>'Bu iki terimde '+d.length+' değişken farklı. Tam olarak bir değişken x ve x\' olarak ayrılmalı.');
    const v=va[d[0]];
    const X=a.lits.filter((_,i)=>i!==d[0]);
    const f=mk(X,[2*v,2*v+1],'');
    const out=state.slice();out[sel[0]]=f;out.splice(sel[1],1);
    return good(out,()=>F(a)+' ile '+F(b)+' birleştirildi: '+F(f)+'.');
  }

  if(th==='inv'){
    if(sel.length!==1)return bad(()=>'Inverse tek bir terime uygulanır. '+SUM+' içeren bir terim seç.');
    const c=C[0];
    if(c.grp){const r=mk(c.lits,null,'id');return good(state.map((u,i)=>i===sel[0]?r:u),()=>SUM+(form==='sop'?' = 1':' = 0')+' uygulandı: '+F(r)+'.');}
    if(isPlain(c)&&isContra(c)){
      const l=c.lits.find(x=>c.lits.includes(x^1));
      const r=mk(c.lits.filter(x=>x!==l&&x!==(l^1)),null,'ann');
      return good(state.map((u,i)=>i===sel[0]?r:u),()=>(form==='sop'?'XX\' = 0':'X + X\' = 1')+' uygulandı: '+F(r)+'.');
    }
    return bad(()=>F(c)+' içinde '+SUM+' biçiminde bir tümleyen çifti yok. Önce Distributive ile çifti oluştur.');
  }

  if(th==='iden'){
    if(sel.length!==1)return bad(()=>'Identity tek bir terime uygulanır.');
    const c=C[0];
    if(c.k==='id')return good(state.map((u,i)=>i===sel[0]?mk(c.lits):u),()=>(form==='sop'?'X·1 = X':'X + 0 = X')+' uygulandı.');
    if(c.k==='neu'){
      if(state.length<2)return bad(()=>'Başka terim kalmadı, bu sabit ifadenin kendisi.');
      return good(without([sel[0]]),()=>(form==='sop'?'X + 0 = X':'X · 1 = X')+' uygulandı: '+F(c)+' silindi.');
    }
    return bad(()=>F(c)+' içinde silinecek bir '+(form==='sop'?'·1':'+0')+' yok. Identity '+(form==='sop'?'X·1':'X + 0')+' biçimini temizler.');
  }

  if(th==='ann'){
    if(sel.length!==1)return bad(()=>'Annihilator tek bir terime uygulanır.');
    const c=C[0];
    if(c.k==='ann')return good(state.map((u,i)=>i===sel[0]?mk([],null,'neu'):u),()=>(form==='sop'?'X·0 = 0':'X + 1 = 1')+' uygulandı.');
    if(isPlain(c)&&!c.lits.length){
      if(state.length<2)return bad(()=>'İfade zaten tek sabit.');
      return good([c],()=>(form==='sop'?'X + 1 = 1':'X · 0 = 0')+' uygulandı: ifade tek sabite indi.');
    }
    return bad(()=>F(c)+' bir sabit değil. Annihilator '+(form==='sop'?'X + 1 = 1 ve X·0 = 0':'X · 0 = 0 ve X + 1 = 1')+' için kullanılır.');
  }
  return bad(()=>'Bilinmeyen teorem.');
}

/* ---- solver: BFS over states, every operation costs 1 ---- */
function resolveKeys(st,keys){
  const used=new Set(),out=[];
  for(const k of keys){
    let f=-1;
    for(let i=0;i<st.length;i++)if(!used.has(i)&&st[i].key===k){f=i;break;}
    if(f<0)return null;
    used.add(f);out.push(f);
  }
  return out;
}
function subsetsOf(arr,maxSize){
  const out=[];
  const rec=(i,cur)=>{
    if(cur.length)out.push(cur.slice());
    if(cur.length>=maxSize)return;
    for(let j=i;j<arr.length;j++){cur.push(arr[j]);rec(j+1,cur);cur.pop();}
  };
  rec(0,[]);
  return out;
}
/* every valid operation from state S (any order). Returns [{th,sel,state}] */
function enumerate(S,ctx0){
  const ctx={form:ctx0.form,names:ctx0.names,quiet:true};
  const out=[],n=S.length;
  const tryOp=(th,sel)=>{const r=applyOp(S,th,sel,ctx);if(r.ok)out.push({th,sel,state:r.state});};
  const pl=S.map(okPlain);
  for(let i=0;i<n;i++){
    if(pl[i]){
      if(redundantBy(S,i))tryOp('cons',[i]);
    }
    const c=S[i];
    if(c.grp)tryOp('inv',[i]);
    else if(isPlain(c)&&isContra(c))tryOp('inv',[i]);
    if(c.k==='id'||c.k==='neu')tryOp('iden',[i]);
    if(c.k==='ann'||(isPlain(c)&&!c.lits.length))tryOp('ann',[i]);
  }
  for(let i=0;i<n;i++){
    if(!pl[i])continue;
    for(let j=i+1;j<n;j++){
      if(!pl[j])continue;
      const a=S[i],b=S[j];
      if(a.key===b.key){tryOp('idem',[i,j]);continue;}
      const r=consOf(a,b);
      if(r.clause)tryOp('cons',[i,j]);
      if(a.lits.length===b.lits.length){
        let d=0,same=true;
        for(let t=0;t<a.lits.length;t++){if(a.lits[t]!==b.lits[t]){if((a.lits[t]^1)===b.lits[t])d++;else{same=false;break;}}}
        if(same&&d===1)tryOp('dist',[i,j]);
      }
      if(a.lits.length===1&&b.lits.length>=2&&b.lits.includes(a.lits[0]^1))tryOp('abs',[i,j]);
      else if(b.lits.length===1&&a.lits.length>=2&&a.lits.includes(b.lits[0]^1))tryOp('abs',[i,j]);
    }
  }
  const D=[];
  for(let i=0;i<n;i++)if(pl[i]&&S.some((u,j)=>j!==i&&pl[j]&&properSub(u,S[i])))D.push(i);
  if(D.length)for(const sub of subsetsOf(D,6))tryOp('abs',sub);
  return out;
}
/* shortest sequence from `state` to any goal state. Returns {steps,path:[{th,keys}],visited} or {fail:'cap'|'none'|'depth',visited} */
function solve(state,ctx,goal,opts){
  opts=opts||{};
  const cap=opts.cap||50000,maxD=opts.maxDepth||14;
  const S0=sortState(state);
  if(isGoal(S0,goal))return{steps:0,path:[],visited:1};
  const seen=new Set([stateKey(S0)]);
  let level=[{S:S0,par:null,op:null}];
  for(let d=0;d<maxD;d++){
    const next=[];
    for(const node of level){
      const ops=enumerate(node.S,ctx);
      for(const o of ops){
        const S2=sortState(o.state);
        const k=stateKey(S2);
        if(seen.has(k))continue;
        seen.add(k);
        const nn={S:S2,par:node,op:{th:o.th,keys:o.sel.map(i=>node.S[i].key)}};
        if(isGoal(S2,goal)){
          const path=[];
          for(let x=nn;x.par;x=x.par)path.push(x.op);
          path.reverse();
          return{steps:path.length,path,visited:seen.size};
        }
        next.push(nn);
        if(seen.size>cap)return{fail:'cap',visited:seen.size};
      }
    }
    if(!next.length)return{fail:'none',visited:seen.size};
    level=next;
  }
  return{fail:'depth',visited:seen.size};
}

/* ---- theorem name parsing (Zor mode) ---- */
function normName(s){
  s=String(s).replace(/İ/g,'i').replace(/I/g,'i').toLowerCase();
  const m={'ı':'i','ş':'s','ç':'c','ğ':'g','ö':'o','ü':'u','â':'a','î':'i','û':'u'};
  return s.replace(/[ışçğöüâîû]/g,ch=>m[ch]).replace(/[^a-z]/g,'');
}
const ALIASES={
  comm:['commutative','commutativity','commutive','comutative','commutativ','commutation','degisme','degismeli','yerdegistirme','yerdegistirmeli'],
  dist:['distributive','distribution','distributivity','distrubutive','distributiv','dagilma','dagilim','dagilmali'],
  iden:['identity','identitiy','identiy','ozdeslik','etkisiz','etkisizeleman','birimeleman','birim'],
  inv:['inverse','complement','complementation','complementary','tumleyen','tumleme','ters','tersi'],
  idem:['idempotency','idempotent','idempotence','idempotancy','idempotency','tekguc','tekguclu','tekgucluluk'],
  ann:['annihilator','annihilation','anihilator','annihilater','anhilator','null','nullelement','domination','yutaneleman','yutan'],
  invol:['involution','involusion','involotion','cifttumleyen','doublenegation','doublecomplement','tumleyenintumleyeni'],
  abs:['absorption','absorbtion','absorbsion','absorbation','absorb','absorbing','yutma','yutulma','sogurma','yutmakurali'],
  dm:['demorgan','demorgans','demorganlaw','morgan'],
  cons:['consensus','concensus','consensous','consencus','consensusu','uzlasma','uzlasi']
};
const CANON={comm:'commutative',dist:'distributive',iden:'identity',inv:'inverse',idem:'idempotency',ann:'annihilator',invol:'involution',abs:'absorption',dm:'demorgan',cons:'consensus'};
function lev(a,b){
  const m=a.length,n=b.length;let prev=[];for(let j=0;j<=n;j++)prev.push(j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)cur.push(Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)));
    prev=cur;
  }
  return prev[n];
}
function parseTheorem(src){
  let s=normName(src);
  if(!s)return null;
  const exact=t=>{for(const id in ALIASES)if(ALIASES[id].includes(t)||CANON[id]===t)return id;return null;};
  let r=exact(s);if(r)return r;
  for(const suf of['laws','law','theorem','teoremi','teorem','rules','rule','kurali','kural','yasasi','kanunu','ozelligi']){
    if(s.length>suf.length&&s.endsWith(suf)){r=exact(s.slice(0,-suf.length));if(r)return r;}
  }
  if(s.length>=4){
    const hits=new Set();
    for(const id in ALIASES)for(const a of ALIASES[id].concat([CANON[id]]))if(a.startsWith(s))hits.add(id);
    if(hits.size===1)return[...hits][0];
  }
  if(s.length>=5){
    const lim=s.length>=8?2:1;
    let best=99,bid=null,tie=false;
    for(const id in ALIASES)for(const a of ALIASES[id].concat([CANON[id]])){
      if(a.length<5)continue;
      const d=lev(s,a);
      if(d<best){best=d;bid=id;tie=false;}
      else if(d===best&&id!==bid)tie=true;
    }
    if(best<=lim&&!tie)return bid;
  }
  return null;
}

  T.start();
}
function nextQuestion(){
  let i;
  do{i=rnd(0,BANK.length-1);}while(BANK.length>1&&(i===S.idx||i<3&&Math.random()<.5&&S.qno>0));
  load(i);
}
function resetStepState(){S.sel=new Set();S.hintLvl=0;S.hintIdx=[];}

function getSol(){
  const st=cur(),key=Eng.stateKey(Eng.sortState(st));
  if(S.solCache&&S.solCache.key===key)return S.solCache.res;
  const res=Eng.solve(st,S.ctx,S.goal,{cap:50000,maxDepth:16});
  S.solCache={key,res};
  return res;
}
function selText(st,idxs){return idxs.map(i=>F(st[i])).join(', ');}

function finish(){
  S.done=true;T.stop();
}
function applyStep(thId){
  if(S.done)return;
  const st=cur(),sel=[...S.sel].sort((a,b)=>a-b);
  const r=Eng.applyOp(st,thId,sel,Object.assign({},S.ctx,{quiet:false}));
  if(!r.ok){
    S.mistakes++;
    S.fb=Core.fb('bad','Bu adımda uygulanamaz',esc(r.msg));
    draw();return;
  }
  S.lines.push({state:r.state,th:nameOf(thId),sel:selText(st,sel),step:S.lines.length});
  resetStepState();
  if(Eng.isGoal(r.state,S.goal)){
    finish();
    const taken=S.lines.length-1,best=S.P.steps;
    let credit='';
    if(!S.revealed&&!S.credited){S.credited=true;Core.credit(T.elapsed());}
    credit=taken===best?`${taken} adımda bitirdin, en kısa çözüm kadar.`:`${taken} adımda bitirdin, en kısa çözüm ${best} adım.`;
    S.fb=Core.fb('ok','Sadeleşti',`${esc(lab())} = <code>${esc(exprOf(r.state))}</code><br>${credit}${S.mistakes?` Hata sayısı: ${S.mistakes}.`:' Hiç hata yapmadın.'}`);
  }else{
    S.fb=Core.fb('info',esc(nameOf(thId))+' uygulandı',esc(r.note||''));
  }
  draw();
}
function undo(){
  if(S.done||S.lines.length<2)return;
  S.lines.pop();resetStepState();
  S.fb=Core.fb('info','Son adım geri alındı','');
  draw();
}
function hint(){
  if(S.done)return;
  const res=getSol();
  if(res.fail||!res.path.length){
    S.fb=Core.fb('warn','İpucu yok','Bu durumdan ipucu veremiyorum, Geri al\'ı dene.');
    draw();return;
  }
  const op=res.path[0],st=cur();
  S.hintLvl=Math.min(2,S.hintLvl+1);
  if(S.hintLvl===1){
    S.hintIdx=[];
    S.fb=Core.fb('info','İpucu 1',`En kısa çözüm bir sonraki adımda <b>${esc(nameOf(op.th))}</b> kullanıyor. Hangi terimlere uygulanacağını bir sonraki ipucu gösterir.`);
  }else{
    S.hintIdx=Eng.resolveKeys(st,op.keys)||[];
    S.fb=Core.fb('info','İpucu 2',`<b>${esc(nameOf(op.th))}</b> için vurgulanan terimleri seç (${S.hintIdx.length} terim).`);
  }
  draw();
}
function reveal(){
  if(S.done)return;
  const res=getSol();
  if(res.fail){
    S.fb=Core.fb('warn','Çözüm hesaplanamadı','Bu durumdan çözümü bulamadım, Geri al\'ı dene.');
    draw();return;
  }
  let st=cur();
  for(const op of res.path){
    const idx=Eng.resolveKeys(st,op.keys);
    const r=Eng.applyOp(st,op.th,idx,Object.assign({},S.ctx,{quiet:false}));
    S.lines.push({state:r.state,th:nameOf(op.th),sel:selText(st,idx),step:S.lines.length,sol:true});
    st=r.state;
  }
  S.revealed=true;resetStepState();finish();Core.breakStreak();
  S.fb=Core.fb('info','Çözüm eklendi',`En kısa yol bu durumdan ${res.steps} adım. Bu soru için puan yazılmadı.`);
  draw();
}
function toggle(i){
  if(S.done)return;
  if(S.sel.has(i))S.sel.delete(i);else S.sel.add(i);
  draw();
}
function zorApply(){
  const id=Eng.parseTheorem(S.typed);
  if(!id){
    S.fb=Core.fb('warn','Teorem adını tanıyamadım','Adı İngilizce yaz, örneğin Consensus ya da Absorption.');
    draw();return;
  }
  S.typed='';
  applyStep(id);
}

/* ---------- rendering ---------- */
/* a term that was not in the given expression: added by a step or changed by one */
function isAdded(c){
  const first=S.lines[0]&&S.lines[0].state;
  return !!first&&!first.some(x=>x.key===c.key);
}
function stateSpans(st){
  if(!st.length)return esc(exprOf(st));
  const sep=S.P.form==='sop'?' + ':'';
  return st.map(c=>{const t=esc(F(c));return isAdded(c)?`<span class="simp-add">${t}</span>`:t;}).join(sep);
}
function chipsRow(st){
  const sop=S.P.form==='sop';
  let h='';
  st.forEach((c,i)=>{
    if(i&&sop)h+='<span class="simp-plus" aria-hidden="true">+</span>';
    const on=S.sel.has(i),hi=S.hintIdx.includes(i);
    h+=`<button type="button" class="simp-chip${hi?' hint':''}${isAdded(c)?' added':''}" data-chip="${i}" data-fk="c${i}" aria-pressed="${on}">${esc(F(c))}</button>`;
  });
  return h||'<span class="simp-plus">(boş)</span>';
}
function logHTML(){
  const n=S.lines.length;
  return`<ol class="simp-log" aria-label="Çözüm adımları">${S.lines.map((ln,i)=>{
    const last=i===n-1,live=last&&!S.done;
    const no=`<span class="simp-no">${i===0?'':i+'.'}</span>`;
    const th=i===0?'<span class="simp-th given">verilen</span>':`<span class="simp-th${ln.sol?' sol':''}">${esc(ln.th)}</span>`;
    const selN=i&&ln.sel?`<span class="simp-seln">seçim: ${esc(ln.sel)}</span>`:'';
    if(live)return`<li class="simp-row cur" aria-current="step">${no}<div class="simp-ex"><span class="simp-eq">${esc(lab())} =</span><span class="simp-chips">${chipsRow(ln.state)}</span></div>${th}</li>`;
    return`<li class="simp-row${last&&S.done?' fin':''}">${no}<div class="simp-ex"><span class="simp-eq">${esc(lab())} =</span> <span class="simp-txt">${stateSpans(ln.state)}</span>${selN}</div>${th}</li>`;
  }).join('')}</ol>`;
}
function selbarHTML(){
  if(S.done)return'';
  const idx=[...S.sel].sort((a,b)=>a-b),st=cur();
  if(!idx.length)return`<p class="simp-selbar muted">Son satırdaki terimlere tıklayarak seç, sonra bir teorem uygula. Yeşil terimler sonradan eklenen ya da değişen terimlerdir.</p>`;
  return`<div class="simp-selbar"><span>Seçili <b>${idx.length}</b> terim: <code>${esc(selText(st,idx))}</code></span><button type="button" class="btn small ghost" data-act="clear">Seçimi temizle</button></div>`;
}
function panelHTML(){
  const dis=S.done?' disabled':'';
  const pos=S.P.form==='pos';
  let body='';
  if(S.mode==='zor'){
    body=`<p class="note">Teorem adını yaz ve Enter'a bas. Adı İngilizce yazman yeterli, büyük küçük harf önemli değil.</p>
    <div class="qm-in simp-in"><input type="text" id="simp-name" data-fk="thm" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="örn. Consensus" aria-label="Teorem adı" value="${esc(S.typed)}"${dis}><button type="button" class="btn primary" data-act="typed"${dis}>Uygula</button></div>`;
  }else if(S.mode==='orta'){
    body=`<div class="simp-ths">${Eng.TH.map(t=>`<button type="button" class="btn simp-th-btn" data-th="${t.id}" data-fk="th-${t.id}"${dis}>${t.name}</button>`).join('')}</div>`;
  }else{
    body=`<div class="simp-ths kolay">${Eng.TH.map(t=>{
      const inf=INFO[t.id],fs=pos?inf.pos:inf.sop;
      return`<button type="button" class="btn simp-th-btn kolay" data-th="${t.id}" data-fk="th-${t.id}"${dis}><b>${t.name}</b><span class="simp-fm">${fs.map(esc).join('<br>')}</span><span class="simp-why">${esc(inf.why)}</span></button>`;
    }).join('')}</div>${pos?'<p class="note">Formüller çarpım-toplam (POS) sırasıyla yazıldı. Kurallar aynı, işlemler yer değiştirir.</p>':''}`;
  }
  return`<aside class="simp-panel" aria-label="Teoremler"><div class="simp-ptitle">Teorem</div>${body}</aside>`;
}
function draw(){
  if(!S.P)return;
  const P=S.P;
  const step=S.lines.length;
  const stat=S.done?'<span class="simp-pill ok">Bitti</span>':`<span class="simp-pill">Adım <b>${step}</b></span>`;
  const html=`
  <div class="controls"><div class="ctl"><span class="lab">Zorluk</span><div class="seg" role="group" aria-label="Zorluk">${MODES.map(m=>`<button type="button" data-act="mode" data-v="${m[0]}" aria-pressed="${S.mode===m[0]}">${m[1]}</button>`).join('')}</div></div></div>
  <article class="card simp-card">
    <div class="qhead"><span class="qno">Soru ${S.qno} · ${P.form==='sop'?'Çarpımların toplamı':'Toplamların çarpımı'}</span><div class="simp-pills"><span class="simp-pill">En kısa çözüm <b>${P.steps}</b> adım</span>${stat}<span class="simp-pill${S.mistakes?' bad':''}">Hata: <b>${S.mistakes}</b></span></div>${T.html()}</div>
    <p class="task">Teoremleri tek tek uygulayarak ifadeyi sadeleştir. Terimleri seç, sonra teoremin adını ver.</p>
    <div class="simp-work">
      <div class="simp-main">
        ${logHTML()}
        ${selbarHTML()}
        <div aria-live="polite" id="simp-fb">${Core.fbHTML(S.fb)}</div>
        <div class="row">
          <button type="button" class="btn" data-act="hint"${S.done?' disabled':''}>İpucu</button>
          <button type="button" class="btn" data-act="undo"${S.done||S.lines.length<2?' disabled':''}>Geri al</button>
          <button type="button" class="btn ghost" data-act="reveal"${S.done?' disabled':''}>Çözümü göster</button>
        </div>
        <div class="row"><button type="button" class="btn${S.done?' primary':' ghost'}" data-act="next">${S.done?'Sonraki soru':'Yeni soru (atla)'}</button></div>
      </div>
      ${panelHTML()}
    </div>
  </article>`;
  Core.render(root,html);
}

Pages.simp={
  mount(el){
    root=el;
    root.addEventListener('click',e=>{
      const chip=e.target.closest('[data-chip]');
      if(chip){toggle(+chip.dataset.chip);return;}
      const th=e.target.closest('[data-th]');
      if(th){applyStep(th.dataset.th);return;}
      const a=e.target.closest('[data-act]');
      if(!a)return;
      switch(a.dataset.act){
        case'mode':S.mode=a.dataset.v;S.fb=null;draw();break;
        case'clear':S.sel=new Set();draw();break;
        case'undo':undo();break;
        case'hint':hint();break;
        case'reveal':reveal();break;
        case'next':nextQuestion();draw();break;
        case'typed':zorApply();break;
      }
    });
    root.addEventListener('input',e=>{if(e.target.id==='simp-name')S.typed=e.target.value;});
    root.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&e.target.id==='simp-name'){e.preventDefault();S.typed=e.target.value;zorApply();}
    });
    load(0);draw();
  },
  enter(){},
  load(i){load(i);draw();},
  _S:S,_Eng:Eng
};
}
})();

</script>
<script>
/* ---- Logic Gates: "Devre kurma" (gates) and "NAND / NOR" (nandnor). One shared circuit board component. ----
   Part 1: GatesLib, pure functions (netlists, simulation, reference builders, question generators).
   Part 2: the page (SVG board, pointer interaction, truth-table panel, question flow).
   Netlist: {inputs:['A','B'], gates:[{id:'g1',type:'NAND',inputs:[ref,ref]}], out:ref}; ref = input name or gate id (null = floating). */
window.GatesLib=(function(){
'use strict';
const rnd=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const LET='ABCD';
const vr=n=>({t:'var',n}),nt=a=>({t:'not',a}),an=(...a)=>({t:'and',a}),orr=(...a)=>({t:'or',a}),xr=(...a)=>({t:'xor',a});

/* ---------- gates and simulation ---------- */
function gateFn(type,ins){
  switch(type){
    case'AND':return ins.every(x=>x)?1:0;
    case'OR':return ins.some(x=>x)?1:0;
    case'NOT':return ins[0]?0:1;
    case'NAND':return ins.every(x=>x)?0:1;
    case'NOR':return ins.some(x=>x)?0:1;
    case'XOR':return ins.reduce((a,x)=>a^(x?1:0),0);
    case'XNOR':return ins.reduce((a,x)=>a^(x?1:0),0)?0:1;
  }
  return 0;
}
/* env: {A:0,B:1}. Floating inputs count as 0, loops are cut (cyc=true). */
function evalNet(net,env){
  const by={};net.gates.forEach(g=>{by[g.id]=g;});
  const val={},stack=new Set();let cyc=false;
  function ev(ref){
    if(ref==null)return 0;
    if(by[ref]===undefined)return env[ref]?1:0;
    if(Object.prototype.hasOwnProperty.call(val,ref))return val[ref];
    if(stack.has(ref)){cyc=true;return 0;}
    stack.add(ref);
    const ins=by[ref].inputs.map(ev);
    stack.delete(ref);
    return(val[ref]=gateFn(by[ref].type,ins));
  }
  net.gates.forEach(g=>ev(g.id));
  return{val,out:ev(net.out),cyc};
}
function analyzeNet(net){
  const by={};net.gates.forEach(g=>{by[g.id]=g;});
  const cone=new Set(),floating=[],color={};let cyc=false;
  (function dfs(ref){
    if(ref==null||!by[ref])return;
    if(color[ref]===1){cyc=true;return;}
    if(color[ref]===2)return;
    color[ref]=1;cone.add(ref);
    by[ref].inputs.forEach((r,i)=>{if(r==null)floating.push({gid:ref,i});else dfs(r);});
    color[ref]=2;
  })(net.out);
  return{cone,floating,cyc,outMissing:net.out==null};
}
function envOf(vars,m){const k=vars.length,e={};vars.forEach((v,i)=>{e[v]=(m>>(k-1-i))&1;});return e;}
function netTruth(net){
  const out=[];
  for(let m=0;m<(1<<net.inputs.length);m++)out.push(evalNet(net,envOf(net.inputs,m)).out);
  return out;
}
function sameVec(a,b){return a.length===b.length&&a.every((x,i)=>x===b[i]);}
function dependsAll(vec,n){
  for(let i=0;i<n;i++){const b=1<<i;let d=false;for(let m=0;m<vec.length;m++)if(vec[m]!==vec[m^b]){d=true;break;}if(!d)return false;}
  return true;
}
function prune(net){
  const by={};net.gates.forEach(g=>{by[g.id]=g;});
  const keep=new Set();
  (function w(r){if(r==null||!by[r]||keep.has(r))return;keep.add(r);by[r].inputs.forEach(w);})(net.out);
  return{inputs:net.inputs,gates:net.gates.filter(g=>keep.has(g.id)),out:net.out};
}
function countTypes(net){
  const c={};net.gates.forEach(g=>{c[g.type]=(c[g.type]||0)+1;});
  return Object.keys(c).map(k=>c[k]+' '+k).join(', ');
}

/* ---------- netlist builder (shares identical gates) ---------- */
function NB(inputs){
  const gates=[],by=new Map();let n=0;
  function mk(type,ins){
    const key=type+'|'+ins.slice().sort().join(',');
    if(by.has(key))return by.get(key);
    const id='g'+(++n);gates.push({id,type,inputs:ins.slice()});by.set(key,id);return id;
  }
  return{inputs:inputs.slice(),gates,mk};
}
function binAst(n){
  if(n.t==='var'||n.t==='c')return n;
  if(n.t==='not')return{t:'not',a:binAst(n.a)};
  const k=n.a.map(binAst);let acc=k[0];
  for(let i=1;i<k.length;i++)acc={t:n.t,a:[acc,k[i]]};
  return acc;
}

/* Standard build: AND / OR / NOT / XOR gates, maxIn = 2 or 3 inputs for AND/OR. */
function compileStd(ast,vars,maxIn){
  const nb=NB(vars);
  const red=(type,kids)=>{
    if(kids.length===1)return kids[0];
    if(type==='XOR'){let acc=kids[0];for(let i=1;i<kids.length;i++)acc=nb.mk('XOR',[acc,kids[i]]);return acc;}
    let acc=nb.mk(type,kids.slice(0,maxIn)),i=maxIn;
    while(i<kids.length){acc=nb.mk(type,[acc].concat(kids.slice(i,i+maxIn-1)));i+=maxIn-1;}
    return acc;
  };
  const s=node=>{
    switch(node.t){
      case'var':return node.n;
      case'not':{
        const a=node.a;
        if(a.t==='var')return nb.mk('NOT',[a.n]);
        if(a.t==='xor'&&a.a.length===2)return nb.mk('XNOR',a.a.map(s));
        if((a.t==='and'||a.t==='or')&&a.a.length<=maxIn)return nb.mk(a.t==='and'?'NAND':'NOR',a.a.map(s));
        return nb.mk('NOT',[s(a)]);
      }
      case'and':return red('AND',node.a.map(s));
      case'or':return red('OR',node.a.map(s));
      case'xor':return red('XOR',node.a.map(s));
    }
    return null;
  };
  return prune({inputs:vars.slice(),gates:nb.gates,out:s(ast)});
}

/* Universal build: only 2-input G gates (G = 'NAND' or 'NOR'). Tracks polarity: sig(node,true) = node, sig(node,false) = node'. */
function compileUni(ast0,G,vars){
  const ast=binAst(ast0),nb=NB(vars),K=G==='NAND'?'and':'or';
  const cm=new Map();
  const comp=s=>{
    if(cm.has(s))return cm.get(s);
    const g=nb.gates.find(x=>x.id===s);
    const r=(g&&g.inputs[0]===g.inputs[1])?g.inputs[0]:nb.mk(G,[s,s]);
    cm.set(s,r);if(!cm.has(r))cm.set(r,s);
    return r;
  };
  const memo=new Map();
  const sig=(node,pol)=>{
    if(node.t==='var')return pol?node.n:comp(node.n);
    if(node.t==='not')return sig(node.a,!pol);
    const key=JSON.stringify(node)+(pol?'+':'-');
    if(memo.has(key))return memo.get(key);
    let r;
    if(node.t==='xor'){
      const pa=sig(node.a[0],true),pb=sig(node.a[1],true);
      const t=nb.mk(G,[pa,pb]);
      const x=nb.mk(G,[nb.mk(G,[pa,t]),nb.mk(G,[pb,t])]);   // NAND version gives XOR, NOR version gives XNOR
      r=(pol===(G==='NAND'))?x:comp(x);
    }else if(node.t===K){
      const neg=nb.mk(G,[sig(node.a[0],true),sig(node.a[1],true)]);
      r=pol?comp(neg):neg;
    }else{
      const pos=nb.mk(G,[sig(node.a[0],false),sig(node.a[1],false)]);
      r=pol?pos:comp(pos);
    }
    memo.set(key,r);return r;
  };
  return prune({inputs:vars.slice(),gates:nb.gates,out:sig(ast,true)});
}

/* ---------- printing ---------- */
function show(n,parent){
  switch(n.t){
    case'var':return n.n;
    case'c':return String(n.v);
    case'not':return n.a.t==='var'?n.a.n+"'":'('+show(n.a,'top')+")'";
    case'and':{const s=n.a.map(x=>show(x,'and')).join('·');return parent==='xor'?'('+s+')':s;}
    case'or':{const s=n.a.map(x=>show(x,'or')).join(' + ');return(parent==='and'||parent==='xor')?'('+s+')':s;}
    case'xor':{const s=n.a.map(x=>show(x,'xor')).join(' ⊕ ');return parent?'('+s+')':s;}
  }
  return '';
}
function netExpr(net,top){
  const by={};net.gates.forEach(g=>{by[g.id]=g;});
  const ex=ref=>{
    const g=by[ref];if(!g)return String(ref);
    const a=g.inputs.map(ex);
    switch(g.type){
      case'NOT':return a[0]+"'";
      case'AND':return'('+a.join('·')+')';
      case'OR':return'('+a.join(' + ')+')';
      case'NAND':return'('+a.join('·')+")'";
      case'NOR':return'('+a.join(' + ')+")'";
      case'XOR':return'('+a.join(' ⊕ ')+')';
      case'XNOR':return'('+a.join(' ⊕ ')+")'";
    }
    return'?';
  };
  const s=ex(net.out);
  const g=by[net.out];
  if(top&&g&&(g.type==='AND'||g.type==='OR'||g.type==='XOR'))return s.slice(1,-1);
  return s;
}

/* ---------- gate geometry (shared with the board renderer) ---------- */
function gdim(type,n){return type==='NOT'?{w:48,h:36}:{w:72,h:24*n};}
function pinsOf(type,n){const a=[];if(type==='NOT')return[18];for(let i=0;i<n;i++)a.push(12+24*i);return a;}

/* ---------- layered layout: inputs left, gate levels, output right ---------- */
const CW=740;
const IN_PORT_X=66,OUT_PORT_X=CW-62;
function inputY(i,k,H){return Math.round(H*(i+1)/(k+1));}
function depthOf(net){
  const by={};net.gates.forEach(g=>{by[g.id]=g;});const memo={};
  const d=ref=>{if(by[ref]===undefined)return 0;if(memo[ref]!==undefined)return memo[ref];memo[ref]=0;return(memo[ref]=1+Math.max(0,...by[ref].inputs.map(r=>r==null?0:d(r))));};
  return Math.max(0,d(net.out));
}

  const level=ref=>{
    if(by[ref]===undefined)return 0;
    if(lv[ref]!==undefined)return lv[ref];
    lv[ref]=-1;   // loop guard
    const l=1+Math.max(0,...by[ref].inputs.map(r=>r==null?0:Math.max(0,level(r))));

  const pos={},cy={};
  const iy=name=>inputY(net.inputs.indexOf(name),k,H);
  for(let l=1;l<=L;l++){
    const col=net.gates.filter(g=>lv[g.id]===l);
    const x=Math.round(L===1?(x0+x1)/2:x0+(l-1)*(x1-x0)/(L-1));
    const items=col.map(g=>{
      const ys=g.inputs.filter(r=>r!=null).map(r=>by[r]?cy[r]:iy(r)).filter(v=>v!==undefined);
      const pref=ys.length?ys.reduce((a,b)=>a+b,0)/ys.length:H/2;
      return{g,pref,h:gdim(g.type,g.inputs.length).h};

    const over=prev-gap-(H-6);

}

/* random circuit for the "read the circuit" questions */
function randNet(vars,types,nG,three){
  for(let att=0;att<600;att++){
    const sigs=vars.slice(),unused=new Set(vars),gates=[];let ok=true;
    for(let i=0;i<nG&&ok;i++){
      const type=pick(types);
      const ar=type==='NOT'?1:(three&&['AND','OR','NAND','NOR'].includes(type)&&Math.random()<0.3?3:2);
      const ch=[],pool=shuffle([...unused]);
      while(ch.length<ar&&pool.length&&(i<nG-1?Math.random()<0.85:true))ch.push(pool.shift());
      let guard=0;
      while(ch.length<ar&&guard++<30){const c=pick(sigs);if(!ch.includes(c))ch.push(c);}
      if(ch.length<ar){ok=false;break;}
      ch.forEach(c=>unused.delete(c));
      const id='g'+(gates.length+1);
      gates.push({id,type,inputs:shuffle(ch)});sigs.push(id);unused.add(id);
    }
    if(!ok||unused.size!==1)continue;
    const net={inputs:vars.slice(),gates,out:gates[gates.length-1].id};
    const vec=netTruth(net);
    if(vec.every(x=>x===vec[0])||!dependsAll(vec,vars.length))continue;
    return net;
  }
  return null;
}

    const rr=Math.min(r,l1/2,l2/2);
    if(rr<1||!l1||!l2){d+=` L${p1.x},${p1.y}`;continue;}
    d+=` L${p1.x+(p0.x-p1.x)/l1*rr},${p1.y+(p0.y-p1.y)/l1*rr} Q${p1.x},${p1.y} ${p1.x+(p2.x-p1.x)/l2*rr},${p1.y+(p2.y-p1.y)/l2*rr}`;
  }
  const l=pts[pts.length-1];
  return d+` L${l.x},${l.y}`;
}
function segHits(obs,x1,y1,x2,y2){
  const ax=Math.min(x1,x2),bx=Math.max(x1,x2),ay=Math.min(y1,y2),by=Math.max(y1,y2);
  let c=0;
  for(const o of obs)if(ax<o.x+o.w+4&&bx>o.x-4&&ay<o.y+o.h+4&&by>o.y-4)c++;
  return c;
}
function route(s,d,obs,vsegs,srcRef){
  const x0=s.x,y0=s.y,x1=d.x,y1=d.y;
  if(x1-x0<34){
    const k=Math.max(40,Math.abs(x1-x0)/2+26);
    return`M${x0},${y0} C${x0+k},${y0} ${x1-k},${y1} ${x1},${y1}`;
  }
  if(Math.abs(y0-y1)<1&&!segHits(obs,x0+2,y0,x1-2,y1))return`M${x0},${y0} H${x1}`;
  let best=(x0+x1)/2,bc=1e9;
  for(let xm=x0+14;xm<=x1-14;xm+=6){
    let c=100*(segHits(obs,x0+2,y0,xm,y0)+segHits(obs,xm,y0,xm,y1)+segHits(obs,xm,y1,x1-2,y1));
    c+=Math.abs(xm-(x0+x1)/2)*0.15;
    for(const v of vsegs)if(v.src!==srcRef&&Math.abs(v.x-xm)<6&&Math.min(y0,y1)<v.y2&&Math.max(y0,y1)>v.y1)c+=45;
    if(c<bc){bc=c;best=xm;}
  }
  vsegs.push({x:best,y1:Math.min(y0,y1),y2:Math.max(y0,y1),src:srcRef});
  return rpath([{x:x0,y:y0},{x:best,y:y0},{x:best,y:y1},{x:x1,y:y1}],9);
}

function boardFromNet(net,pos){
  const B={gates:[],wires:{},next:1},idm={};
  net.gates.forEach(g=>{idm[g.id]='g'+(B.next++);});
  net.gates.forEach(g=>{
    const nid=idm[g.id];
    B.gates.push({id:nid,type:g.type,n:g.inputs.length,x:pos[g.id].x,y:pos[g.id].y});
    g.inputs.forEach((r,i)=>{if(r!=null)B.wires[nid+'.'+i]=idm[r]||r;});
  });
  if(net.out!=null)B.wires.OUT=idm[net.out]||net.out;
  return B;
}

function makePage(PID){
  const NN=PID==='nandnor';
  const T=Core.timer();
  let root=null;
  const S={qno:0,q:null,B:null,H:420,sel:null,tool:null,pending:null,mouse:{x:0,y:0},hoverPin:null,vals:{},undo:[],fb:null,done:false,revealed:false,
    hint:0,text:'',choice:null,flag:new Set(),nIn:2,qf:'mix',fam:'mix',nv:'mix',drag:null,pdrag:null,ghost:null,wrong:false};

  /* ---------- model helpers ---------- */
  function toNet(){
    const B=S.B;
    return{inputs:S.q.vars,gates:B.gates.map(g=>({id:g.id,type:g.type,inputs:Array.from({length:g.n},(_,i)=>B.wires[g.id+'.'+i]||null)})),out:B.wires.OUT||null};
  }
  function editable(){return S.q&&S.q.kind==='board'&&!S.done;}
  function snap(){return JSON.stringify({g:S.B.gates,w:S.B.wires,n:S.B.next});}
  function pushUndo(s){S.undo.push(s||snap());if(S.undo.length>60)S.undo.shift();}
  function restore(s){const o=JSON.parse(s);S.B={gates:o.g,wires:o.w,next:o.n};}
  function gmap(){const m={};S.B.gates.forEach(g=>{m[g.id]=g;});return m;}
  function outPt(g){const d=GL.gdim(g.type,g.n);return{x:g.x+d.w,y:g.y+d.h/2};}
  function pinPt(g,i){return{x:g.x,y:g.y+GL.pinsOf(g.type,g.n)[i]};}
  function inIdx(name){return S.q.vars.indexOf(name);}
  function inPt(name){return{x:IN_X,y:GL.inputY(inIdx(name),S.q.vars.length,S.H)};}
  function curRow(){const n=S.q.vars.length;let m=0;S.q.vars.forEach((v,i)=>{m|=(S.vals[v]?1:0)<<(n-1-i);});return m;}
  function rowText(m){return S.q.vars.map((v,i)=>v+'='+((m>>(S.q.vars.length-1-i))&1)).join(' ');}
  function refFor(){return NN?S.q.refs[2]:(S.nIn===3?S.q.refs[3]:S.q.refs[2]);}
  function clearFb(){if(S.fb){S.fb=null;setFbDom();}}
  function setFb(f){S.fb=f;setFbDom();}
  function setFbDom(){const el=root&&root.querySelector('.gt-fb');if(el)el.innerHTML=fbHTML(S.fb);}

  /* ---------- actions on the board ---------- */
  function placeGate(type,cx,cy){
    if(!editable()||!S.q.allowed.includes(type))return;
    if(S.B.gates.length>=20){setFb(fbMk('warn','Çok fazla kapı','Tahtada en fazla 20 kapı olabilir. Önce gereksiz olanları sil.'));return;}
    const n=type==='NOT'?1:(NN?2:(MULTI.includes(type)?S.nIn:2));
    const d=GL.gdim(type,n);
    const x=Math.min(Math.max(Math.round((cx-d.w/2)/5)*5,86),OUT_X-d.w-26);
    const y=Math.min(Math.max(Math.round((cy-d.h/2)/5)*5,4),S.H-d.h-4);
    pushUndo();
    const g={id:'g'+(S.B.next++),type,n,x,y};
    S.B.gates.push(g);S.sel={kind:'gate',id:g.id};clearFb();
  }
  function connect(src,dst){
    if(!editable())return;
    if(S.B.wires[dst]===src)return;
    pushUndo();S.B.wires[dst]=src;S.flag=new Set();S.sel=null;clearFb();
  }
  function removeSel(){
    if(!editable()||!S.sel)return;
    pushUndo();
    if(S.sel.kind==='wire')delete S.B.wires[S.sel.dst];
    else{
      const id=S.sel.id;
      S.B.gates=S.B.gates.filter(g=>g.id!==id);
      Object.keys(S.B.wires).forEach(k=>{if(S.B.wires[k]===id||k.startsWith(id+'.'))delete S.B.wires[k];});
    }
    S.sel=null;S.flag=new Set();clearFb();
  }
  function undo(){
    if(!editable()||!S.undo.length)return;
    restore(S.undo.pop());S.sel=null;S.pending=null;S.flag=new Set();clearFb();
  }
  function clearAll(){
    if(!editable()||(!S.B.gates.length&&!Object.keys(S.B.wires).length))return;
    pushUndo();S.B={gates:[],wires:{},next:S.B.next};S.sel=null;S.pending=null;S.flag=new Set();clearFb();
  }

  /* ---------- drawing ---------- */
  function svgInner(){
    const B=S.B,q=S.q,net=toNet(),ev=GL.evalNet(net,S.vals),an=GL.analyzeNet(net);
    const gm=gmap(),edit=editable();
    const srcPt=ref=>gm[ref]?outPt(gm[ref]):(inIdx(ref)>=0?inPt(ref):null);
    const dstPt=dst=>{
      if(dst==='OUT')return{x:OUT_X,y:Math.round(S.H/2)};
      const [id,i]=dst.split('.');const g=gm[id];return g?pinPt(g,+i):null;
    };
    const lvl=ref=>gm[ref]?(ev.val[ref]?1:0):(S.vals[ref]?1:0);
    let wires='',lit='';
    const vsegs=[];
    const keys=Object.keys(B.wires).sort((a,b)=>(a==='OUT')-(b==='OUT'));
    for(const dst of keys){
      const src=B.wires[dst],s=srcPt(src),d=dstPt(dst);
      if(!s||!d)continue;
      const obs=B.gates.filter(g=>g.id!==src&&g.id!==dst.split('.')[0]).map(g=>({x:g.x,y:g.y,...GL.gdim(g.type,g.n)}));
      const p=route(s,d,obs,vsegs,src);
      const on=lvl(src),isSel=S.sel&&S.sel.kind==='wire'&&S.sel.dst===dst;
      const h=(isSel?`<path class="gt-halo" d="${p}"/>`:'')+`<path class="gt-wire ${on?'gt-w1':'gt-w0'}${isSel?' gt-sel':''}" d="${p}"/>`+(edit?`<path class="gt-whit" data-dst="${dst}" d="${p}"/>`:'');
      if(on)lit+=h;else wires+=h;
    }
    /* temporary wire while connecting */
    let temp='';
    if(S.pending){
      const s=srcPt(S.pending.src);
      if(s){
        let e=S.mouse;
        if(S.hoverPin){const dp=dstPt(S.hoverPin);if(dp)e=dp;}
        const dx=Math.max(30,Math.abs(e.x-s.x)/2);
        temp=`<path class="gt-temp" d="M${s.x},${s.y} C${s.x+dx},${s.y} ${e.x-dx},${e.y} ${e.x},${e.y}"/>`;
      }
    }
    const tg=S.pending&&edit;
    /* gates */
    let gates='';
    for(const g of B.gates){
      const sel=S.sel&&S.sel.kind==='gate'&&S.sel.id===g.id;
      const sh=SH(g.type,g.n),o=outPt(g);
      let pins='';
      sh.pins.forEach((py,i)=>{
        const key=g.id+'.'+i,has=!!B.wires[key],fl=S.flag.has(key);
        pins+=`<g class="gt-pin${has?' on':''}${tg?' tg':''}${fl?' fl':''}" data-dst="${key}"><circle class="gt-hit" cx="0" cy="${py}" r="10"/><circle class="gt-dot" cx="0" cy="${py}" r="4.5"/></g>`;
      });
      const v=ev.val[g.id]?1:0;
      gates+=`<g class="gt-gate${sel?' sel':''}" data-gid="${g.id}" transform="translate(${g.x},${g.y})"><title>${g.type}</title>${shapeParts(g.type,g.n)}${pins}`
        +`<g class="gt-pout${v?' v1':''}" data-src="${g.id}"><circle class="gt-hit" cx="${sh.w}" cy="${sh.h/2}" r="10"/><circle class="gt-dot" cx="${sh.w}" cy="${sh.h/2}" r="4.5"/></g></g>`;
    }
    /* input nodes */
    let nodes='';
    q.vars.forEach(v=>{
      const p=inPt(v),on=S.vals[v]?1:0,pend=S.pending&&S.pending.src===v;
      nodes+=`<g class="gt-innode"><rect class="gt-inpill${on?' v1':''}" data-name="${v}" x="8" y="${p.y-15}" width="50" height="30" rx="9"/>`
        +`<text class="gt-nm" x="22" y="${p.y+5}" pointer-events="none">${v}</text><text class="gt-nv${on?' v1':''}" x="45" y="${p.y+5}" pointer-events="none">${on}</text>`
        +`<line class="gt-lead" x1="58" y1="${p.y}" x2="${IN_X}" y2="${p.y}"/>`
        +`<g class="gt-pout${on?' v1':''}${pend?' pend':''}" data-src="${v}"><circle class="gt-hit" cx="${IN_X}" cy="${p.y}" r="10"/><circle class="gt-dot" cx="${IN_X}" cy="${p.y}" r="4.5"/></g></g>`;
    });
    /* output node */
    const oy=Math.round(S.H/2),ov=ev.out?1:0,hasOut=!!B.wires.OUT;
    nodes+=`<g class="gt-outnode"><rect class="gt-outpill${hasOut&&ov?' v1':''}" x="${OUT_X+8}" y="${oy-15}" width="46" height="30" rx="9"/>`
      +`<text class="gt-nm" x="${OUT_X+20}" y="${oy+5}">F</text><text class="gt-nv${hasOut&&ov?' v1':''}" x="${OUT_X+42}" y="${oy+5}">${hasOut?ov:'–'}</text>`
      +`<line class="gt-lead" x1="${OUT_X}" y1="${oy}" x2="${OUT_X+8}" y2="${oy}"/>`
      +(edit?`<g class="gt-pin${hasOut?' on':''}${tg?' tg':''}${S.flag.has('OUT')?' fl':''}" data-dst="OUT"><circle class="gt-hit" cx="${OUT_X}" cy="${oy}" r="12"/><circle class="gt-dot" cx="${OUT_X}" cy="${oy}" r="4.5"/></g>`
        :`<circle class="gt-dot" cx="${OUT_X}" cy="${oy}" r="4.5"/>`)+`</g>`;
    return wires+lit+temp+gates+nodes;
  }
  function ttInner(){
    const q=S.q,n=q.vars.length,N=1<<n,net=toNet(),an=GL.analyzeNet(net);
    const ok=!an.outMissing&&!an.cyc,cv=ok?GL.netTruth(net):null,cur=curRow();
    let h='<thead><tr>'+q.vars.map(v=>`<th>${v}</th>`).join('')+'<th title="Hedef çıkış">F</th><th title="Devrenin çıkışı">Devre</th></tr></thead><tbody>';
    for(let m=0;m<N;m++){
      const cls=(ok?(cv[m]===q.target[m]?'gt-ok':'gt-bad'):'')+(m===cur?' gt-cur':'');
      h+=`<tr class="${cls}" data-row="${m}">`+q.vars.map((v,i)=>`<td>${(m>>(n-1-i))&1}</td>`).join('')+`<td class="gt-t">${q.target[m]}</td><td class="gt-c">${ok?cv[m]:'–'}</td></tr>`;
    }
    return h+'</tbody>';
  }
  function countHTML(){
    const net=toNet(),an=GL.analyzeNet(net),t=S.B.gates.length;

  }
  function refresh(){

    const dis=(sel,v)=>{const e=root.querySelector(sel);if(e)e.disabled=!!v;};
    dis('[data-act=del]',!S.sel||!editable());
    dis('[data-act=undo]',!S.undo.length||!editable());
    dis('[data-act=clear]',!editable()||(!S.B.gates.length&&!Object.keys(S.B.wires).length));
  }

  /* ---------- page html ---------- */
  function seg(act,opts,cur){

  function controlsHTML(){

      h+=`<div class="ctl"><span class="lab">Kapı</span>${seg('fam',[['mix','Karışık'],['NAND','NAND'],['NOR','NOR']],S.fam)}</div>`;
    }else{
      h+=`<div class="ctl"><span class="lab">Soru türü</span>${seg('qf',[['mix','Karışık'],['expr','İfadeden devre'],['table','Tablodan devre'],['reverse','Devreden ifade']],S.qf)}</div>`;
      h+=`<div class="ctl"><span class="lab">Değişken</span>${seg('nv',[['mix','Karışık'],[2,'2'],[3,'3'],[4,'4']],S.nv)}</div>`;

  function boardHTML(){

    const nin=NN?'':`<span class="gt-sep"></span><div class="gt-nin"><span class="lab">Giriş sayısı</span>${seg('nin',[[2,'2'],[3,'3']],S.nIn)}</div>`;

      <div class="gt-bar" role="toolbar" aria-label="Kapılar ve araçlar">${pal}${nin}<span class="gt-grow"></span>

        <button type="button" class="btn small" data-act="undo" disabled>Geri al</button>
        <button type="button" class="btn small" data-act="clear" disabled>Temizle</button>

      <div class="gt-stage">
        <div class="gt-scroll" data-keepscroll="gtc"><svg class="gt-svg" width="${CW}" height="${S.H}" viewBox="0 0 ${CW} ${S.H}" role="img" aria-label="Devre tahtası">${svgInner()}</svg></div>
        <div class="gt-side"><div class="gt-ttl">Doğruluk tablosu</div><table class="pic gt-tt">${ttInner()}</table></div>
      </div>
      <p class="note gt-help">Kapı seç, sonra tahtaya tıkla (ya da sürükle). Bir çıkış noktasına tıkla, sonra bir giriş noktasına tıkla: tel çizilir. Girişlere (A, B) tıklayınca değeri değişir ve teller yanar. Seçili kapıyı ya da teli Delete ile sil.</p>
    </div>`;
  }
  function viewHTML(){
    const q=S.q;
    let ans='';
    if(q.ask==='mc'){
      ans=`<div class="gt-opts" role="group" aria-label="Seçenekler">${q.options.map(o=>`<button type="button" class="gt-opt" data-act="choice" data-c="${o}" aria-pressed="${S.choice===o}"${S.done?' disabled':''}>${o}</button>`).join('')}</div>`;
    }else{
      ans=`<div class="qm-in"><input type="text" data-fk="ans" id="gt-ans-${PID}" aria-label="Çıkış ifadesi" placeholder="F = ..." autocomplete="off" spellcheck="false" value="${esc(S.text)}"${S.done?' disabled':''}></div>
        <div class="gt-sym" aria-label="Sembol ekle">${["'",'+','·','⊕','(',')'].map(c=>`<button type="button" class="chip gt-symb" data-act="sym" data-c="${esc(c)}"${S.done?' disabled':''}>${esc(c)}</button>`).join('')}</div>
        <p class="note">Yazım: tümleyen için <code>'</code>, VEYA için <code>+</code>, VE için <code>·</code> ya da bitişik yazım, XOR için <code>⊕</code> ya da <code>^</code>. Eşdeğer her ifade kabul edilir.</p>`;
    }
    return`<div class="gt-board gt-view"><div class="gt-scroll" data-keepscroll="gtc"><svg class="gt-svg gt-ro" width="${CW}" height="${S.H}" viewBox="0 0 ${CW} ${S.H}" role="img" aria-label="Çizilmiş devre">${svgInner()}</svg></div>
      <p class="note gt-help">Giriş düğmelerine (A, B, ...) tıklayarak devreyi deneyebilirsin: tel ve kapı çıkışları yanar.</p>${ans}</div>`;
  }
  function html(){
    const q=S.q;
    const fnBox=q.stmt?`<div class="fn">${esc(q.stmt)}</div>`:'';
    const finished=S.done;
    return`<div class="card gt-card">
      <div class="qhead"><span class="qno">Soru ${S.qno}<span class="gt-qt">${esc(q.label)}</span></span>${T.html()}</div>

      <p class="task">${esc(q.task)}</p>${fnBox}

      </div>

    </div>`;
