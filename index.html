<title>Digital Antrenman</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: graph-paper desk, one working card; map on the left, groups and feedback on the right (stacked on phones). */
:root{
  --bg:#F1F5FC; --surface:#FFFFFF; --surface2:#E7EEFB; --ink:#0E1A38; --muted:#56637F; --line:#D2DBEE; --grid:#E1E8F6;
  --accent:#1B55E6; --accent-ink:#FFFFFF; --accent-soft:#DAE5FF;
  --ok:#11773F; --ok-soft:#DCF3E6; --bad:#BF352D; --bad-soft:#FBE2E0; --warn:#8A5A00; --warn-soft:#FFEFC7;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Inter','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1124; --surface:#131C38; --surface2:#1B2646; --ink:#E7EDFF; --muted:#9AA8CC; --line:#293660; --grid:#121B36;
    --accent:#7DA2FF; --accent-ink:#0A1124; --accent-soft:#1D2D5C;
    --ok:#52D18C; --ok-soft:#12372A; --bad:#FF7F77; --bad-soft:#401C1D; --warn:#F2C45E; --warn-soft:#3A2E10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1124; --surface:#131C38; --surface2:#1B2646; --ink:#E7EDFF; --muted:#9AA8CC; --line:#293660; --grid:#121B36;
  --accent:#7DA2FF; --accent-ink:#0A1124; --accent-soft:#1D2D5C;
  --ok:#52D18C; --ok-soft:#12372A; --bad:#FF7F77; --bad-soft:#401C1D; --warn:#F2C45E; --warn-soft:#3A2E10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,4.5vw,2.3rem);letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.stats span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-weight:600}


/* main navigation: one pill per topic, tinted by that topic's own accent */
.mainnav{display:flex;flex-wrap:wrap;gap:8px}
.mn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-family:var(--f-display);font-weight:700;font-size:1rem;cursor:pointer;color:var(--muted)}
.mn:hover{border-color:var(--accent);color:var(--ink)}
.mn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.page[hidden]{display:none}
.page{display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line)}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:8px 8px 0 0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctl>label,.ctl>.lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 0 var(--line)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qno{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;background:var(--surface2);border-radius:8px;padding:3px 10px;font-size:.9rem}
.task{margin:0;font-weight:600}
.fn{font-family:var(--f-mono);font-size:clamp(.95rem,2.6vw,1.2rem);background:var(--surface2);border-radius:10px;padding:12px 14px;overflow-x:auto;white-space:nowrap}
.note{margin:0;color:var(--muted);font-size:.85rem}

.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.steps li{font-size:.8rem;font-weight:600;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps li[data-s="now"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.steps li[data-s="done"]{background:var(--ok-soft);border-color:transparent;color:var(--ok)}

.work{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.work{grid-template-columns:minmax(0,1fr)}}
.mapcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}

.km{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:6px;max-width:460px;width:100%}
.km-corner{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-weight:600;padding-right:4px;white-space:nowrap}
.km-h{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-weight:600;padding:0 6px}
.km-ch{padding:0 0 2px}
.cell{position:relative;aspect-ratio:1/.92;min-height:54px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:1.5rem;font-weight:600;padding:0;transition:transform .08s ease,border-color .12s ease}
.cell:hover{border-color:var(--accent)}
.cell:active{transform:scale(.96)}
.cell .ci{position:absolute;top:3px;left:6px;font-size:.62rem;font-weight:500;color:var(--muted)}
.cell.v0{color:var(--muted);font-weight:400}
.cell.v1{color:var(--accent)}
.cell.vX{color:var(--warn)}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft) inset,0 0 0 2px var(--accent)}
.cell.wrong{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.cell.hint{border-style:dashed;border-color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.cell.locked{cursor:pointer}
.legend{margin:0;font-size:.8rem;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--accent)}

.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
.btn.small{padding:5px 10px;font-size:.82rem}

.groups{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.g{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 10px;background:var(--surface)}
.g[data-warn="1"]{border-color:var(--warn);background:var(--warn-soft)}
.g i{width:14px;height:14px;border-radius:4px;flex:none}
.g code{font-family:var(--f-mono);font-size:1rem;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.g small{color:var(--muted);white-space:nowrap}
.empty{color:var(--muted);font-size:.88rem;margin:0;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.live{font-family:var(--f-mono);font-size:.95rem;background:var(--surface2);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
.live span{color:var(--muted)}

.fb{border-radius:12px;padding:12px 14px;font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.fb strong{font-family:var(--f-display);font-size:1.05rem}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.warn{background:var(--warn-soft);color:var(--warn)}
.fb.info{background:var(--accent-soft);color:var(--ink)}
.fb p{margin:0}
.fb code{font-family:var(--f-mono);font-weight:600}

.qm-in{display:flex;gap:8px;flex-wrap:wrap}
.qm-in input{flex:1;min-width:200px;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);font-size:1rem}
.qm-in input:focus{border-color:var(--accent);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:.9rem;padding:3px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.pic{border-collapse:collapse;width:100%;font-size:.9rem}
.pic th,.pic td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.pic thead th{background:var(--surface2);font-family:var(--f-mono);font-weight:600}
.pic thead th.miss{background:var(--bad-soft);color:var(--bad)}
.pic td.l,.pic th.l{text-align:left}
.pic tbody tr{cursor:pointer}
.pic tbody tr:hover{background:var(--surface2)}
.pic tbody tr[aria-selected="true"]{background:var(--accent-soft)}
.pic td.x{font-family:var(--f-mono);font-weight:700;color:var(--accent)}
.pic input{width:18px;height:18px;accent-color:var(--accent)}
.pic code{font-family:var(--f-mono)}
.hidden-step{display:none}
@media (prefers-reduced-motion: reduce){.cell{transition:none}}
</style>
<style>
.qm-cols{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.qcol{flex:0 0 218px;background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.qct{font-family:var(--f-display);font-weight:700;font-size:.95rem;padding:0 2px 4px}
.qgh{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:6px 2px 2px}
.qe{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;cursor:pointer;min-height:36px}
.qe:disabled{cursor:default}
.qe:not(:disabled):not(.zero):hover{border-color:var(--accent)}
.qe .m{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);min-width:2.2em;overflow-wrap:anywhere}
.qe code{font-family:var(--f-mono);font-size:1.02rem;font-weight:600;letter-spacing:.06em}
.qe .fv{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:600}
.qe .tk{margin-left:auto;font-weight:700;color:var(--ok);font-size:.82rem}
.qe.used{background:var(--ok-soft);border-color:transparent}
.qe.used code{color:var(--muted)}
.qe.pick{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qe.hint{border-style:dashed;border-color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.qe.zero{opacity:.45;cursor:default;background:transparent;border-style:dashed}
.qe.pi{background:var(--accent-soft);border-color:var(--accent)}
.qe.pi .tk{color:var(--accent)}
.qe.new{animation:qin .4s ease-out}
@keyframes qin{from{transform:translateX(-22px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.qe.new{animation:none}}
</style>

<style>
body[data-g="alg"]{--bg:#F4F1FC;--grid:#E7E1F6;--surface2:#ECE6FA;--line:#D6CDEE;--accent:#6A3FD6;--accent-ink:#FFFFFF;--accent-soft:#E5DCFB;}
body[data-g="gates"]{--bg:#EDF4F3;--grid:#DCEAE8;--surface2:#E0EEEC;--line:#C5DAD6;--accent:#0A7A69;--accent-ink:#FFFFFF;--accent-soft:#CDEBE4;}
body[data-g="num"]{--bg:#F5F5F8;--grid:#E7E7EE;--surface2:#EDEDF3;--line:#D9D9E4;--accent:#D1440E;--accent-ink:#FFFFFF;--accent-soft:#FCE0D4;}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]) body[data-g="alg"]{--bg:#130E25;--grid:#190F30;--surface:#1B1434;--surface2:#251B46;--line:#352A5E;--accent:#AA8CFF;--accent-ink:#130E25;--accent-soft:#2C2052;}
:root:not([data-theme="light"]) body[data-g="gates"]{--bg:#08171A;--grid:#0C1F22;--surface:#102429;--surface2:#17323A;--line:#244650;--accent:#4DD6BE;--accent-ink:#08171A;--accent-soft:#123B3B;}
:root:not([data-theme="light"]) body[data-g="num"]{--bg:#121215;--grid:#1A1A1F;--surface:#1B1B21;--surface2:#25252D;--line:#34343F;--accent:#FF8D5E;--accent-ink:#121215;--accent-soft:#43241A;}
}
:root[data-theme="dark"] body[data-g="alg"]{--bg:#130E25;--grid:#190F30;--surface:#1B1434;--surface2:#251B46;--line:#352A5E;--accent:#AA8CFF;--accent-ink:#130E25;--accent-soft:#2C2052;}
:root[data-theme="dark"] body[data-g="gates"]{--bg:#08171A;--grid:#0C1F22;--surface:#102429;--surface2:#17323A;--line:#244650;--accent:#4DD6BE;--accent-ink:#08171A;--accent-soft:#123B3B;}
:root[data-theme="dark"] body[data-g="num"]{--bg:#121215;--grid:#1A1A1F;--surface:#1B1B21;--surface2:#25252D;--line:#34343F;--accent:#FF8D5E;--accent-ink:#121215;--accent-soft:#43241A;}
</style>
<style>
.pic .sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle}

</style>
<style>
.qe.done{background:var(--ok-soft);border-color:transparent}
.qe.done code{color:var(--muted)}
.qe.partial{background:var(--warn-soft);border-color:transparent}
.qe.partial .tk{color:var(--warn)}

</style>
<style>
.cn-fn{white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(1.05rem,3.4vw,1.4rem);font-weight:600}
.cn-ans{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.cn-ans label{font-size:.85rem;color:var(--muted);font-weight:600}
.cn-in{font:inherit;font-family:var(--f-mono);font-size:1.1rem;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:100%;max-width:520px;box-sizing:border-box}
.cn-in:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.cn-sol{margin:10px 0;padding:10px 14px;background:var(--accent-soft);border-radius:12px}
.cn-sol ol{margin:6px 0 0;padding-left:20px}
.cn-ref{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--surface)}
.cn-ref summary{cursor:pointer;font-weight:600}
.cn-refbody p{margin:8px 0;line-height:1.5}

</style>
<style>
/* simp: step-by-step simplification. Colors come only from theme tokens. */
.simp-card{gap:16px}
.simp-pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;flex:1}
.simp-pill{font-size:.8rem;font-weight:600;padding:3px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.simp-pill b{color:var(--ink);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.simp-pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.simp-pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.simp-pill.bad b{color:var(--bad)}
.qhead{flex-wrap:wrap}

.simp-work{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.simp-work{grid-template-columns:minmax(0,1fr)}}
.simp-main{display:flex;flex-direction:column;gap:12px;min-width:0}

/* derivation log */
.simp-log{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface2);overflow:hidden}
.simp-row{display:grid;grid-template-columns:2.1em minmax(0,1fr) 7.6em;gap:4px 10px;align-items:start;padding:10px 12px;border-bottom:1px solid var(--line);font-family:var(--f-mono)}
.simp-row:last-child{border-bottom:0}
.simp-row.cur{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.simp-row.fin{background:var(--ok-soft);box-shadow:inset 3px 0 0 var(--ok)}
.simp-no{color:var(--muted);font-size:.85rem;text-align:right;padding-top:.28em;font-variant-numeric:tabular-nums}
.simp-ex{min-width:0;font-size:clamp(.92rem,2.5vw,1.1rem);line-height:1.9;overflow-wrap:anywhere}
.simp-eq{color:var(--muted);margin-right:.5em;white-space:nowrap}
.simp-txt{font-weight:600}
.simp-seln{display:block;font-size:.72rem;line-height:1.4;color:var(--muted);font-family:var(--f-body)}
.simp-th{justify-self:end;text-align:center;font-family:var(--f-body);font-size:.74rem;font-weight:600;line-height:1;padding:6px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;min-width:7.2em;margin-top:.5em}
.simp-th.given{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.simp-th.sol{background:var(--warn-soft);color:var(--warn)}
.simp-row.fin .simp-th{background:var(--surface);color:var(--ok)}
@media (max-width:520px){
  .simp-row{grid-template-columns:1.8em minmax(0,1fr);padding:10px}
  .simp-th{grid-column:2;justify-self:start;margin-top:0}
}

/* selectable terms on the newest line */
.simp-chips{display:inline}
.simp-plus{color:var(--muted);font-weight:600;margin:0 6px 0 3px}
.simp-chip{font-family:var(--f-mono);font-size:inherit;font-weight:600;padding:3px 11px;border-radius:9px;border:2px solid var(--line);background:var(--surface2);cursor:pointer;line-height:1.5;min-height:36px;margin:2px 0;transition:transform .08s ease,border-color .12s ease}
.simp-chip:hover{border-color:var(--accent)}
.simp-chip:active{transform:scale(.96)}
.simp-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-soft)}
.simp-chip.hint{border-style:dashed;border-color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.simp-chip.hint[aria-pressed="true"]{border-style:solid}

.simp-selbar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;margin:0;font-size:.88rem;color:var(--ink);min-height:34px}
.simp-selbar.muted{color:var(--muted)}
.simp-selbar code{font-family:var(--f-mono);font-weight:600}

/* theorem panel */
.simp-panel{display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--surface2);border-radius:14px;padding:14px}
.simp-ptitle{font-family:var(--f-display);font-weight:700;font-size:1rem}

<script>
/* ---- Boolean minimization core: cubes are {mask,val}; bit (n-1-i) is variable i (A=MSB) ---- */
function popcount(x){let c=0;while(x){c+=x&1;x>>=1;}return c;}
function cubeKey(c){return c.mask+':'+c.val;}
function cubeCells(c,n){const out=[];for(let m=0;m<(1<<n);m++){if((m&c.mask)===c.val)out.push(m);}return out;}

function primeImplicants(allowed,n){
  let cur=new Map();
  const full=(1<<n)-1;
  for(const m of allowed){const c={mask:full,val:m};cur.set(cubeKey(c),c);}
  const primes=[];
  while(cur.size){
    const list=[...cur.values()];
    const used=new Set();
    const next=new Map();
    for(let i=0;i<list.length;i++){
      for(let j=i+1;j<list.length;j++){
        const a=list[i],b=list[j];
        if(a.mask!==b.mask)continue;
        const d=a.val^b.val;
        if(d&&(d&(d-1))===0){
          const c={mask:a.mask&~d,val:a.val&~d};
          next.set(cubeKey(c),c);
          used.add(cubeKey(a));used.add(cubeKey(b));
        }
      }
    }
    for(const c of list){if(!used.has(cubeKey(c)))primes.push(c);}
    cur=next;
  }
  return primes;
}

function cubeInfo(c){const lit=popcount(c.mask);const ones=popcount(c.val);return{lit,ones,zeros:lit-ones};}

/* model 'itu': 2 per literal + 1 per complemented literal. model 'terms': fewest terms, then fewest literals */
function costCube(c,mode,model){
  const {lit,ones,zeros}=cubeInfo(c);
  const comp=mode==='pos'?ones:zeros;
  return model==='itu'?2*lit+comp:100+lit;
}

function termString(c,n,mode){
  const L='ABCD';const parts=[];
  for(let i=0;i<n;i++){
    const b=1<<(n-1-i);
    if(!(c.mask&b))continue;
    const v=(c.val&b)?1:0;
    if(mode==='pos')parts.push(v?L[i]+"'":L[i]);
    else parts.push(v?L[i]:L[i]+"'");
  }
  if(mode==='pos')return parts.length?'('+parts.join(' + ')+')':'0';
  return parts.length?parts.join(''):'1';
}
function exprString(cubes,n,mode){
  if(!cubes.length)return mode==='pos'?'1':'0';
  const t=cubes.map(c=>termString(c,n,mode));
  return mode==='pos'?t.join(''):t.join(' + ');
}
function cubeString(c,n){
  let s='';
  for(let i=0;i<n;i++){const b=1<<(n-1-i);s+=(c.mask&b)?((c.val&b)?'1':'0'):'-';}
  return s;
}
function cubeFromString(s,n){
  if(!new RegExp('^[01-]{'+n+'}$').test(s))return null;
  let mask=0,val=0;
  for(let i=0;i<n;i++){const b=1<<(n-1-i);if(s[i]!=='-'){mask|=b;if(s[i]==='1')val|=b;}}
  return{mask,val};
}
function costLabel(cubes,mode,model){
  if(model==='itu'){return String(cubes.reduce((a,c)=>a+costCube(c,mode,model),0));}
  const lit=cubes.reduce((a,c)=>a+cubeInfo(c).lit,0);
  return cubes.length+' terim, '+lit+' literal';
}

/* target: cells that must be covered; allowed: target + don't cares */
function analyze(target,allowed,n,mode,model){
  const raw=primeImplicants(allowed,n);
  const prims=[],cov=[];
  for(const p of raw){
    let m=0;
    for(const t of target){if((t&p.mask)===p.val)m|=(1<<t);}
    if(m){prims.push(p);cov.push(m);}
  }
  const full=target.reduce((a,t)=>a|(1<<t),0);
  const costs=prims.map(p=>costCube(p,mode,model));
  const k=prims.length;
  const covS=new Int32Array(1<<k),costS=new Int32Array(1<<k);
  let best=Infinity,sols=[];
  for(let s=1;s<(1<<k);s++){
    const low=s&-s;const idx=31-Math.clz32(low);const prev=s&(s-1);
    covS[s]=covS[prev]|cov[idx];
    costS[s]=costS[prev]+costs[idx];
    if(covS[s]===full){
      if(costS[s]<best){best=costS[s];sols=[s];}
      else if(costS[s]===best)sols.push(s);
    }
  }
  const solLists=sols.map(s=>{const l=[];for(let i=0;i<k;i++)if(s&(1<<i))l.push(i);return l;});
  const essential=[];
  for(const t of target){
    const who=[];
    for(let i=0;i<k;i++)if(cov[i]&(1<<t))who.push(i);
    if(who.length===1&&!essential.includes(who[0]))essential.push(who[0]);
  }
  return{n,mode,model,target,allowed,prims,cov,costs,best,sols:solLists,essential,full};
}

/* selected cells -> cube, or null when the shape is not a valid K-map group */
function cubeFromCells(cells,n){
  const k=cells.length;
  if(k===0||(k&(k-1)))return null;
  const fullMask=(1<<n)-1;
  let ones=fullMask,zeros=fullMask;
  for(const m of cells){ones&=m;zeros&=(~m)&fullMask;}
  const c={mask:ones|zeros,val:ones};
  const cc=cubeCells(c,n);
  if(cc.length!==k)return null;
  const set=new Set(cells);
  for(const x of cc)if(!set.has(x))return null;
  return c;
}

/* check a user's cover against the minimum */
function evaluateCover(cubes,an){
  const allowedSet=new Set(an.allowed);
  const primeKeys=new Set(an.prims.map(cubeKey));
  const res={invalid:[],nonPrime:[],uncovered:[],cost:0,status:'',covered:new Set()};
  cubes.forEach((c,i)=>{
    const cells=cubeCells(c,an.n);
    if(cells.some(x=>!allowedSet.has(x))){res.invalid.push(i);return;}
    if(!primeKeys.has(cubeKey(c)))res.nonPrime.push(i);
    for(const x of cells)res.covered.add(x);
    res.cost+=costCube(c,an.mode,an.model);
  });
  res.uncovered=an.target.filter(t=>!res.covered.has(t));
  if(res.invalid.length)res.status='invalid';
  else if(res.uncovered.length)res.status='incomplete';
  else if(res.cost>an.best)res.status='notmin';
  else res.status='ok';
  return res;
}

function evaluatePIs(cubes,an){
  const allowedSet=new Set(an.allowed);
  const primeKeys=new Set(an.prims.map(cubeKey));
  const res={invalid:[],nonPrime:[],foundKeys:new Set(),missing:0,status:''};
  cubes.forEach((c,i)=>{
    const cells=cubeCells(c,an.n);
    if(cells.some(x=>!allowedSet.has(x))){res.invalid.push(i);return;}
    if(primeKeys.has(cubeKey(c)))res.foundKeys.add(cubeKey(c));else res.nonPrime.push(i);
  });
  res.missing=an.prims.length-res.foundKeys.size;
  if(res.invalid.length)res.status='invalid';
  else if(res.nonPrime.length)res.status='nonprime';
  else if(res.missing>0)res.status='incomplete';
  else res.status='ok';

}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rnd(lo,hi){return lo+Math.floor(Math.random()*(hi-lo+1));}

/* vals[m] is '0' | '1' | 'X' */
function genQuestion(o){
  const n=o.n,N=1<<n;let last=null;
  for(let t=0;t<800;t++){
    const tc=n===4?rnd(5,9):rnd(3,4);
    const dcn=o.dc?(n===4?rnd(1,3):rnd(1,2)):0;
    const order=shuffle([...Array(N).keys()]);
    const target=order.slice(0,tc),dcs=order.slice(tc,tc+dcn);
    const tv=o.mode==='pos'?'0':'1',ov=o.mode==='pos'?'1':'0';
    const vals=Array(N).fill(ov);
    target.forEach(m=>{vals[m]=tv;});dcs.forEach(m=>{vals[m]='X';});
    const an=analyze(target.slice().sort((a,b)=>a-b),target.concat(dcs).sort((a,b)=>a-b),n,o.mode==='pos'?'pos':'sop','itu');
    const minTerms=an.sols.length?an.sols[0].length:0;
    const lo=o.qm?4:3,hi=o.qm?9:8;
    last={n,mode:o.mode,vals,givenAs:Math.random()<0.5?'sum':'prod'};
    if(an.prims.length>=lo&&an.prims.length<=hi&&minTerms>=2)return last;
  }
  return last;
}

function qTarget(q){
  const tv=q.mode==='pos'?'0':'1';
  const target=[],allowed=[];
  q.vals.forEach((v,m)=>{if(v===tv)target.push(m);if(v===tv||v==='X')allowed.push(m);});
  return{target,allowed};
}

<script>
/* ---- Boolean expression parser and evaluator (shared by several pages) ----
   Syntax: letters = variables (case-insensitive, stored upper-case), ' postfix = NOT, ! prefix = NOT,
   + or | = OR, * or & or implicit adjacency = AND, ^ or ⊕ = XOR, parentheses, constants 0 and 1.
   Precedence: NOT > AND > XOR > OR.
   AST nodes: {t:'var',n} {t:'c',v} {t:'not',a} {t:'and',a:[..]} {t:'or',a:[..]} {t:'xor',a:[..]} */
function parseExpr(src){
  const s=String(src).toUpperCase()
    .replace(/[·∙•]/g,'*').replace(/&/g,'*').replace(/[∨|]/g,'+').replace(/[⊕]/g,'^').replace(/[’‘´`]/g,"'");
  const toks=[];
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(/\s/.test(ch))continue;
    if(/[A-Z]/.test(ch))toks.push({k:'v',v:ch});
    else if(ch==='0'||ch==='1')toks.push({k:'c',v:+ch});
    else if('+*^\'!()'.includes(ch))toks.push({k:ch});
    else throw new Error('Tanınmayan karakter: "'+ch+'"');
  }
  if(!toks.length)throw new Error('İfade boş.');
  let p=0;
  const peek=()=>toks[p];
  function flat(t,list){return list.length===1?list[0]:{t,a:list};}
  function pOr(){
    const l=[pXor()];
    while(peek()&&peek().k==='+'){p++;l.push(pXor());}
    return flat('or',l);
  }
  function pXor(){
    const l=[pAnd()];
    while(peek()&&peek().k==='^'){p++;l.push(pAnd());}
    return flat('xor',l);
  }
  function startsUnary(t){return t&&(t.k==='v'||t.k==='c'||t.k==='('||t.k==='!');}
  function pAnd(){
    const l=[pUn()];
    for(;;){
      const t=peek();
      if(t&&t.k==='*'){p++;l.push(pUn());}
      else if(startsUnary(t))l.push(pUn());
      else break;
    }
    return flat('and',l);
  }
  function pUn(){
    const t=peek();
    if(t&&t.k==='!'){p++;return{t:'not',a:pUn()};}
    return pPost();
  }
  function pPost(){
    let n=pAtom();
    while(peek()&&peek().k==="'"){p++;n={t:'not',a:n};}
    return n;
  }
  function pAtom(){
    const t=peek();
    if(!t)throw new Error('İfade yarım kaldı.');
    if(t.k==='v'){p++;return{t:'var',n:t.v};}
    if(t.k==='c'){p++;return{t:'c',v:t.v};}
    if(t.k==='('){
      p++;const n=pOr();
      if(!peek()||peek().k!==')')throw new Error('Parantez kapatılmamış.');
      p++;return n;
    }
    throw new Error('Beklenmeyen simge: "'+(t.k==='v'||t.k==='c'?t.v:t.k)+'"');
  }
  const n=pOr();
  if(p<toks.length)throw new Error('Fazla simge: "'+(toks[p].v!==undefined?toks[p].v:toks[p].k)+'"');
  return n;
}
function evalNode(n,env){
  switch(n.t){
    case'var':return env[n.n]?1:0;
    case'c':return n.v;
    case'not':return evalNode(n.a,env)?0:1;
    case'and':return n.a.every(x=>evalNode(x,env))?1:0;
    case'or':return n.a.some(x=>evalNode(x,env))?1:0;
    case'xor':return n.a.reduce((acc,x)=>acc^evalNode(x,env),0);
  }
  return 0;
}
function exprVars(n,set){
  set=set||new Set();
  if(n.t==='var')set.add(n.n);
  else if(n.a)(Array.isArray(n.a)?n.a:[n.a]).forEach(x=>exprVars(x,set));
  return [...set].sort();
}
/* vars[0] is the most significant bit, like A in ABCD */
function truthVec(n,vars){
  const k=vars.length,out=[];
  for(let m=0;m<(1<<k);m++){
    const env={};
    vars.forEach((v,i)=>{env[v]=(m>>(k-1-i))&1;});
    out.push(evalNode(n,env));
  }
  return out;
}
function literalCount(n){
  if(n.t==='var')return 1;
  if(n.t==='c')return 0;
  return (Array.isArray(n.a)?n.a:[n.a]).reduce((a,x)=>a+literalCount(x),0);
}
function sameFunction(a,b,vars){
  const x=truthVec(a,vars),y=truthVec(b,vars);
  return x.every((v,i)=>v===y[i]);
}
/* pull every integer out of text like "Σm(1, 3, 4)" or "1 3 4" */
function parseIntList(s){
  const m=String(s).match(/\d+/g);
  return m?m.map(Number):[];
}
if(typeof module!=='undefined')module.exports={parseExpr,evalNode,exprVars,truthVec,literalCount,sameFunction,parseIntList};

<script>
/* ---- Shell: routing, stats, timers, render helper. Pages register themselves in window.Pages. ----

(function(){

/* call once per correctly solved question; ms = time taken */

Core.breakStreak=function(){stats.streak=0;saveStats();renderStats();};

/* ---------- timers: T=Core.timer(); T.start(); T.stop(); T.elapsed(); put T.html() in the page ---------- */

  T.start=()=>{T.t0=Date.now();T.tEnd=0;Core.tick();};
  T.stop=()=>{if(!T.tEnd)T.tEnd=Date.now();Core.tick();};
  T.elapsed=()=>(T.tEnd||Date.now())-T.t0;
  T.html=()=>`<span class="timer" data-timer="${T.id}" aria-label="Süre">${Core.fmtTime(T.elapsed())}</span>`;
  timers.push(T);

};
Core.tick=function(){
  for(const T of timers){
    document.querySelectorAll('[data-timer="'+T.id+'"]').forEach(el=>{el.textContent=Core.fmtTime(T.elapsed());});
  }
};
setInterval(Core.tick,500);

/* ---------- render helper: replaces innerHTML but keeps keyboard focus and scroll of marked elements ----------

  if(fk){
    const e=[...c.querySelectorAll('[data-fk]')].find(x=>x.getAttribute('data-fk')===fk);
    if(e){e.focus({preventScroll:true});if(e.tagName==='INPUT'&&e.type==='text'){const l=e.value.length;try{e.setSelectionRange(l,l);}catch(x){}}}
  }
  Core.tick();
};

/* ---------- routing ---------- */
const GROUPS=[
  {id:'k',label:'Karnaugh',pages:[['kmap','Karnaugh haritası'],['qm','Quine-McCluskey']]},
  {id:'alg',label:'Minterm / Maxterm',pages:[['canon','Kanonik formlar'],['simp','Sadeleştirme']]},
  {id:'gates',label:'Logic Gates',pages:[['gates','Devre kurma'],['nandnor','NAND / NOR']]},
  {id:'num',label:'Sayılar',pages:[['num','Toplama ve çıkarma']]}
];
const lastInGroup={};
let current=null;

function groupOf(id){return GROUPS.find(g=>g.pages.some(p=>p[0]===id));}
function renderNav(){
  const g=groupOf(current);
  $('#mainnav').innerHTML=GROUPS.map(x=>`<button type="button" class="mn" data-g="${x.id}" aria-pressed="${x.id===g.id}">${x.label}</button>`).join('');
  const sub=$('#subnav');
  if(g.pages.length>1){
    sub.hidden=false;
    sub.innerHTML=g.pages.map(p=>`<button type="button" class="tab" role="tab" data-p="${p[0]}" aria-selected="${p[0]===current}">${p[1]}</button>`).join('');
  }else{sub.hidden=true;sub.innerHTML='';}
}
Core.go=function(id){
  const g=groupOf(id);if(!g)id='kmap';
  const grp=groupOf(id);
  current=id;lastInGroup[grp.id]=id;
  document.body.setAttribute('data-g',grp.id);
  document.querySelectorAll('.page').forEach(el=>{el.hidden=el.id!=='pg-'+id;});
  const el=$('#pg-'+id);
  const P=window.Pages[id];
  if(!mounted[id]){

    if(P&&P.mount)P.mount(el);
    else el.innerHTML='<div class="card"><p class="task">Bu sayfa henüz hazır değil.</p></div>';
  }

  Core.tick();
};

document.addEventListener('click',e=>{
  const mn=e.target.closest('[data-g].mn');
  if(mn){const g=GROUPS.find(x=>x.id===mn.dataset.g);Core.go(lastInGroup[g.id]||g.pages[0][0]);return;}

  if(tab)Core.go(tab.dataset.p);

window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(h&&h!==current&&groupOf(h))Core.go(h);});

  }));
  renderStats();
  const h=location.hash.replace('#','');
  Core.go(groupOf(h)?h:'kmap');
};
})();

<script>
(function(){

  const s=q.givenAs==='sum'
    ?`Σm(${ones.join(', ')})`+(dcs.length?` + Σφ(${dcs.join(', ')})`:'')
    :`ΠM(${zeros.join(', ')})`+(dcs.length?` · Πφ(${dcs.join(', ')})`:'');

}

  if(q.vals.includes('X'))p.push('φ: don\'t care.');

function taskText(){

    ?'Haritayı çiz, 1\'leri gruplayarak tüm prime implicantları bul, sonra maliyet tablosundan minimal SOP ifadesini seç.'

  let side='';
  if(K.step===1){
    side=`<p class="note">Soruyu haritaya yerleştir. Hücreye her dokunuşta 0 → 1 → X (don't care) döner.</p>
    <div class="row"><button type="button" class="btn primary" data-act="check1">Haritayı kontrol et</button><button type="button" class="btn ghost" data-act="autofill">Otomatik doldur</button></div>`;
  }else if(K.step===2){
    const ns=K.sel.size;
    side=`<p class="note">Her prime implicantı ayrı grup olarak ekle. Bir hücre birden fazla grupta olabilir. Hepsi eklenince kontrol et.</p>
    <div class="row"><button type="button" class="btn primary" data-act="group"${ns?'':' disabled'}>Seçimi grupla${ns?` (${ns})`:''}</button><button type="button" class="btn" data-act="clearsel"${ns?'':' disabled'}>Seçimi temizle</button></div>
    ${groupsListHTML()}
    <div class="row"><button type="button" class="btn primary" data-act="checkpi"${K.groups.length?'':' disabled'}>PI'ları kontrol et</button><button type="button" class="btn" data-act="hint">İpucu</button><button type="button" class="btn ghost" data-act="reveal">PI'ları göster</button></div>`;
  }else{
    side=`${groupsListHTML()}${Chart.html({an:K.an,n:K.n,mode:K.mode,model:K.model,sel:K.csel,uncovered:K.uncovered,done:K.done,swatch,showCube:false})}`;
  }
  const mapNote=K.step===1?'':(K.mode==='pos'?'Grupları 0\'lardan kur. X\'ler istersen gruba girebilir.':'Grupları 1\'lerden kur. X\'ler istersen gruba girebilir.');
  const q=K.q;
  const controls=`<div class="controls">
    <div class="ctl"><span class="lab">Değişken</span><div class="seg" role="group">${[3,4].map(v=>`<button type="button" data-ctl="n" data-v="${v}" aria-pressed="${K.n===v}">${v}</button>`).join('')}</div></div>
    <div class="ctl"><span class="lab">Don't care</span><div class="seg" role="group">${[[0,'Yok'],[1,'Var']].map(o=>`<button type="button" data-ctl="dc" data-v="${o[0]}" aria-pressed="${(K.dc?1:0)===o[0]}">${o[1]}</button>`).join('')}</div></div>
    <div class="ctl"><label for="kMode">Soru türü</label><select id="kMode">${Object.keys(MODE_LABEL).map(k=>`<option value="${k}"${k===K.mode?' selected':''}>${MODE_LABEL[k]}</option>`).join('')}</select></div>
    <div class="ctl"><label for="kModel">Maliyet</label><select id="kModel">${Object.keys(Core.MODEL_LABEL).map(k=>`<option value="${k}"${k===K.model?' selected':''}>${Core.MODEL_LABEL[k]}</option>`).join('')}</select></div>
  </div>`;
  return`${controls}<article class="card">
    <div class="qhead"><span class="qno">Soru ${K.qno} · ${MODE_LABEL[K.mode]} · ${K.n} değişken</span>${T.html()}</div>
    <p class="task">${taskText()}</p>
    <div class="fn">${esc(stmt(q))}</div>
    <p class="note">${stmtNote(q)}</p>
    ${stepsHTML()}
    <div class="work">
      <div class="mapcol">${gridHTML()}
        <p class="legend">Sol–sağ ve üst–alt kenarlar birbirine bitişiktir. ${mapNote}</p>
        <label class="check"><input type="checkbox" id="kIdx"${K.showIdx?' checked':''}> Hücre numaralarını göster</label>
      </div>
      <div class="side">${side}<div aria-live="polite">${fbHTML(K.fb)}</div>
        <div class="row"><button type="button" class="btn${K.done?' primary':' ghost'}" data-act="next">${K.done?'Sonraki soru':'Yeni soru (atla)'}</button></div>
      </div>
    </div>
  </article>`;
}
function draw(){render(root,html());}

/* ---------- actions ---------- */
function clearMarks(){K.wrong=new Set();K.warnG=new Set();K.hintCells=[];}
function onCell(m){
  if(K.done||K.step===3)return;
  if(K.step===1){const nx={'0':'1','1':'X','X':'0'};K.fill[m]=nx[K.fill[m]];K.wrong.delete(m);}
  else{clearMarks();if(K.sel.has(m))K.sel.delete(m);else K.sel.add(m);}
  draw();
}
function check1(){
  const bad=new Set();
  K.q.vals.forEach((v,m)=>{if(K.fill[m]!==v)bad.add(m);});
  if(!bad.size){K.step=2;K.wrong=new Set();K.fb=fb('ok','Harita doğru','Şimdi tüm prime implicantları grupla.');}
  else{K.wrong=bad;K.fb=fb('bad',`${bad.size} hücre hatalı`,'Kırmızı çerçeveli hücreleri soruyla karşılaştır. Gray code sırasına dikkat: 00, 01, 11, 10.');}
  draw();
}
function addGroup(){
  const cells=[...K.sel].sort((a,b)=>a-b);
  const cube=cubeFromCells(cells,K.n);
  if(!cube){K.fb=fb('bad','Bu geçerli bir grup değil','Grup 1, 2, 4, 8 veya 16 hücrelik bir dikdörtgen olmalı. Kenarlar birbirine bitişik sayılır.');draw();return;}
  const allowed=new Set(K.an.allowed);
  if(cells.some(m=>!allowed.has(m))){
    K.fb=fb('bad','Grup yanlış değerler içeriyor',`Bu grupta ${K.mode==='pos'?'1':'0'} olan hücre var. ${K.mode==='pos'?'POS':'SOP'} için yalnızca ${K.mode==='pos'?'0':'1'} ve X hücreleri gruplanır.`);
    draw();return;
  }
  if(K.groups.some(g=>cubeKey(g.cube)===cubeKey(cube))){K.fb=fb('warn','Bu grup zaten ekli','');draw();return;}
  K.groups.push({cube});K.sel=new Set();K.fb=null;clearMarks();draw();
}
function removeGroup(i){K.groups.splice(i,1);K.fb=null;clearMarks();draw();}
function checkPI(){
  const r=evaluatePIs(K.groups.map(g=>g.cube),K.an);
  clearMarks();
  if(r.status==='nonprime'){
    K.warnG=new Set(r.nonPrime);
    K.fb=fb('warn',`${r.nonPrime.length} grup prime implicant değil`,'Sarı işaretli gruplar daha da büyütülebilir ya da yalnızca X içeriyor. Büyütüp yeniden ekle.');
  }else if(r.status==='incomplete'){
    K.fb=fb('warn','Eksik prime implicant var','Eklediklerin doğru. Bir hücrenin birden fazla grupta olabileceğini unutma. İpucu kaç tane olduğunu söyler.');
  }else{
    K.step=3;K.hint=0;
    K.fb=fb('ok','Tüm prime implicantlar bulundu','Şimdi tablodan maliyeti en düşük kapağı seç.');
  }
  draw();
}
function missingPIs(){
  const have=new Set(K.groups.map(g=>cubeKey(g.cube)));
  return K.an.prims.map((p,i)=>i)
    .sort((a,b)=>cubeCells(K.an.prims[b],K.n).length-cubeCells(K.an.prims[a],K.n).length)
    .filter(i=>!have.has(cubeKey(K.an.prims[i])));
}
function hint2(){
  K.hint++;
  if(K.hint===1){
    const have=new Set(K.groups.map(g=>cubeKey(g.cube)));
    const found=K.an.prims.filter(p=>have.has(cubeKey(p))).length;
    K.fb=fb('info','İpucu',`Toplam ${K.an.prims.length} prime implicant var. Şu an doğru bulduğun: ${found}.`);
  }else{
    const miss=missingPIs();
    if(!miss.length)K.fb=fb('info','İpucu','Eklemen gereken grupların hepsi ekli. PI\'ları kontrol et\'e bas.');
    else{K.hintCells=cubeCells(K.an.prims[miss[(K.hint-2)%miss.length]],K.n);K.fb=fb('info','İpucu','Kesik çerçeveli hücreler aradığın gruplardan birini oluşturuyor.');}
  }
  draw();
}
function reveal2(){
  K.groups=K.an.prims.map(p=>({cube:p}));K.sel=new Set();clearMarks();
  K.step=3;K.hint=0;
  if(!K.revealed){K.revealed=true;Core.breakStreak();}
  K.fb=fb('info','PI\'lar gösterildi','Bu soru seriye sayılmayacak. Tablodan kapağı seçmeye devam edebilirsin.');
  draw();
}
function cCheck(){
  const cubes=[...K.csel].sort((a,b)=>a-b).map(i=>K.an.prims[i]);
  const r=evaluateCover(cubes,K.an);
  K.uncovered=new Set();
  if(r.status==='incomplete'){
    K.uncovered=new Set(r.uncovered);
    K.fb=fb('bad',`${r.uncovered.length} hücre kapsanmadı`,'Kırmızı başlıklı sütunlar seçtiğin PI\'larla kapanmıyor.');
  }else if(r.status==='notmin'){
    K.fb=fb('warn','Geçerli ama minimal değil',`Maliyetin ${costLabel(cubes,K.mode,K.model)}. Daha ucuz bir kapak var. Tek × içeren sütunlardan başla, kalanları en ucuz şekilde kapat.`);
  }else{
    K.done=true;T.stop();if(!K.revealed)Core.credit(T.elapsed());
    K.fb=fb('ok','Doğru, minimal',`<code>f(${vars()}) = ${esc(exprString(cubes,K.n,K.mode))}</code><br>Maliyet ${costLabel(cubes,K.mode,K.model)}. Süre ${Core.fmtTime(T.elapsed())}.`);
  }
  draw();
}
function cHint(){
  K.hint++;
  if(K.hint%2===1)K.fb=fb('info','İpucu','Tek × içeren sütunlara bak. O × hangi satırdaysa o PI essential\'dır ve seçilmek zorundadır.');
  else K.fb=fb('info','İpucu',`Minimal kapakta ${K.an.sols[0].length} PI var.`);
  draw();
}
function cReveal(){
  K.csel=new Set(K.an.sols[0]);K.uncovered=new Set();K.done=true;
  if(!K.revealed){K.revealed=true;Core.breakStreak();}
  T.stop();
  const cubes=K.an.sols[0].map(i=>K.an.prims[i]);
  const alt=K.an.sols.length>1?` Eşit maliyetli ${K.an.sols.length-1} çözüm daha var.`:'';
  K.fb=fb('info','Çözüm',`<code>f(${vars()}) = ${esc(exprString(cubes,K.n,K.mode))}</code><br>Maliyet ${costLabel(cubes,K.mode,K.model)}.${alt}`);
  draw();
}

Pages.kmap={
  mount(el){
    root=el;
    el.addEventListener('click',e=>{
      const t=e.target;
      const ctl=t.closest('[data-ctl]');
      if(ctl){const v=ctl.dataset.v;if(ctl.dataset.ctl==='n')K.n=+v;else K.dc=v==='1';newQ();draw();return;}
      const cell=t.closest('[data-m]');if(cell){onCell(+cell.dataset.m);return;}
      const rm=t.closest('[data-rm]');if(rm){removeGroup(+rm.dataset.rm);return;}
      const row=t.closest('[data-pi]');
      if(row&&K.step===3&&!K.done){
        const i=+row.dataset.pi;
        if(K.csel.has(i))K.csel.delete(i);else K.csel.add(i);
        K.uncovered=new Set();K.fb=null;draw();return;
      }
      const a=t.closest('[data-act]');if(!a)return;
      switch(a.dataset.act){
        case'check1':check1();break;
        case'autofill':K.fill=K.q.vals.slice();K.step=2;K.wrong=new Set();K.fb=fb('info','Harita dolduruldu','Şimdi tüm prime implicantları grupla.');draw();break;
        case'group':addGroup();break;
        case'clearsel':K.sel=new Set();clearMarks();draw();break;
        case'checkpi':checkPI();break;
        case'hint':hint2();break;
        case'reveal':reveal2();break;
        case'cCheck':cCheck();break;
        case'cHint':cHint();break;
        case'cReveal':cReveal();break;
        case'next':newQ();draw();break;
      }
    });
    el.addEventListener('change',e=>{
      const t=e.target;
      if(t.id==='kMode'){K.mode=t.value;newQ();draw();}
      else if(t.id==='kModel'){K.model=t.value;newQ();draw();}
      else if(t.id==='kIdx'){K.showIdx=t.checked;draw();}
    });
    newQ();draw();
  }
};
})();

</script>
<script>
(function(){
'use strict';
const {$,esc,bin,fb,fbHTML,render}=Core;
const T=Core.timer();
const Q={model:'itu',qno:0,q:null,an:null,hist:[],pick:null,step:1,hint:0,hintPair:null,lastNew:null,
  done:false,revealed:false,fb:null,csel:new Set(),uncovered:new Set()};
let root=null;

function newQ(){
  const q=genQuestion({n:4,dc:true,mode:'sop',qm:true});q.givenAs='sum';
  const t=qTarget(q);
  Q.q=q;Q.an=analyze(t.target,t.allowed,4,'sop',Q.model);
  Q.an.raw=primeImplicants(t.allowed,4);
  Q.hist=[];Q.pick=null;Q.step=1;Q.hint=0;Q.hintPair=null;Q.lastNew=null;
  Q.done=false;Q.revealed=false;Q.fb=null;Q.csel=new Set();Q.uncovered=new Set();Q.qno++;
  T.start();
}
function stmt(q){
  const ones=[],dcs=[];
  q.vals.forEach((v,m)=>{if(v==='1')ones.push(m);else if(v==='X')dcs.push(m);});
  return`f(A,B,C,D) = Σm(${ones.join(', ')})`+(dcs.length?` + Σφ(${dcs.join(', ')})`:'');
}
function combinable(A,B){
  if(A.mask!==B.mask)return false;
  const d=A.val^B.val;
  return d!==0&&(d&(d-1))===0;
}
function combineCubes(A,B){const d=A.val^B.val;return{mask:A.mask&~d,val:A.val&~d};}
function sortEntries(list){return list.slice().sort((a,b)=>popcount(a.cube.val)-popcount(b.cube.val)||a.cube.val-b.cube.val);}
function hasKey(list,c){return !!list&&list.some(e=>cubeKey(e.cube)===cubeKey(c));}

/* every column is derived from the history of combinations the student made */
function cols(){
  const cs=[Q.an.allowed.map(m=>({cube:{mask:15,val:m},used:false}))];
  for(const h of Q.hist){
    const col=cs[h.col];
    const a=col.find(e=>cubeKey(e.cube)===h.a),b=col.find(e=>cubeKey(e.cube)===h.b);
    a.used=true;b.used=true;
    const c=combineCubes(a.cube,b.cube);
    if(!cs[h.col+1])cs[h.col+1]=[];
    if(!hasKey(cs[h.col+1],c))cs[h.col+1].push({cube:c,used:false});
  }
  return cs;
}
function pending(cs){
  for(let k=0;k<cs.length;k++){
    const col=sortEntries(cs[k]||[]);
    for(let i=0;i<col.length;i++)for(let j=i+1;j<col.length;j++){
      const A=col[i],B=col[j];
      if(!combinable(A.cube,B.cube))continue;
      if(!hasKey(cs[k+1],combineCubes(A.cube,B.cube))||!A.used||!B.used)return{col:k,a:cubeKey(A.cube),b:cubeKey(B.cube)};
    }
  }
  return null;
}
/* 'none' = untouched or prime, 'partial' = combined at least once but groupings remain, 'done' = every grouping this term takes part in is finished */
function entryState(cs,ci,e){
  let partner=false,all=true;
  for(const o of cs[ci]){
    if(o===e||!combinable(e.cube,o.cube))continue;
    partner=true;
    if(!hasKey(cs[ci+1],combineCubes(e.cube,o.cube))||!e.used||!o.used)all=false;
  }
  if(!partner)return'none';
  if(all)return'done';
  return e.used?'partial':'none';
}

function pickEntry(col,key){
  if(Q.done||Q.step!==1)return;
  Q.hintPair=null;Q.lastNew=null;
  if(!Q.pick||Q.pick.col!==col){Q.pick={col,key};Q.fb=null;draw();return;}
  if(Q.pick.key===key){Q.pick=null;draw();return;}
  const cs=cols();
  const A=cs[col].find(e=>cubeKey(e.cube)===Q.pick.key).cube;
  const B=cs[col].find(e=>cubeKey(e.cube)===key).cube;
  Q.pick=null;
  const sA=cubeString(A,4),sB=cubeString(B,4);
  if(A.mask!==B.mask){
    Q.fb=fb('bad','Birleşmezler',`<code>${sA}</code> ve <code>${sB}</code>: tire (-) konumları aynı olmalı. Önce tireleri aynı yerde olan terimleri eşle.`);
  }else if(popcount(A.val^B.val)!==1){
    Q.fb=fb('bad','Birleşmezler',`<code>${sA}</code> ve <code>${sB}</code> ${popcount(A.val^B.val)} bit farklı. Tam 1 bit farklı olmalı.`);
  }else{
    const kA=cubeKey(A),kB=cubeKey(B);
    if(Q.hist.some(h=>h.col===col&&((h.a===kA&&h.b===kB)||(h.a===kB&&h.b===kA)))){
      Q.fb=fb('warn','Bu birleştirmeyi zaten yaptın','');
    }else{
      const c=combineCubes(A,B);
      const existed=hasKey(cs[col+1],c);
      Q.hist.push({col,a:kA,b:kB});
      Q.lastNew=existed?null:cubeKey(c)+'@'+(col+1);
      Q.fb=existed
        ?fb('info','Terim zaten sütunda',`<code>${sA}</code> + <code>${sB}</code> = <code>${cubeString(c,4)}</code>.`)
        :fb('ok','Birleşti',`<code>${sA}</code> + <code>${sB}</code> → <code>${cubeString(c,4)}</code>, sonraki sütuna taşındı.`);
    }
  }
  draw();
}
function done1(){
  if(pending(cols())){
    Q.fb=fb('warn','Birleştirme bitmedi','Hâlâ birleşebilecek terimler var. Her sütunda, tireleri aynı yerde ve 1 bit farklı olan her çifti birleştir. Bir terim, katıldığı tüm gruplamalar bitince yeşil olur.');
  }else{
    Q.step=2;Q.pick=null;Q.hintPair=null;Q.lastNew=null;Q.hint=0;
    const extra=Q.an.raw.length>Q.an.prims.length?` Yalnızca don't care içeren ${Q.an.raw.length-Q.an.prims.length} terim tabloya alınmaz.`:'';
    Q.fb=fb('ok','Tüm prime implicantlar bulundu',`Yeşil olmayan terimler PI. Şimdi tablodan minimum maliyetli kapağı seç.${extra}`);
  }
  draw();
}
function undo(){
  if(!Q.hist.length||Q.done||Q.step!==1)return;
  Q.hist.pop();Q.pick=null;Q.hintPair=null;Q.lastNew=null;Q.fb=null;draw();
}
function fill(){
  let p,g=0;
  while((p=pending(cols()))&&g++<500)Q.hist.push({col:p.col,a:p.a,b:p.b});
  Q.pick=null;Q.hintPair=null;Q.lastNew=null;
  if(!Q.revealed){Q.revealed=true;Core.breakStreak();}
  Q.fb=fb('info','Tablo tamamlandı','Bu soru seriye sayılmayacak. "Birleştirme bitti" ile tabloya geç.');
  draw();
}
function hint(){
  Q.hint++;
  if(Q.step===1){
    if(Q.hint===1)Q.fb=fb('info','İpucu',`Toplam ${Q.an.prims.length} prime implicant var (yalnızca don't care içerenler sayılmaz).`);
    else{
      const p=pending(cols());
      if(!p)Q.fb=fb('info','İpucu','Birleştirilecek çift kalmadı. "Birleştirme bitti" ile devam et.');
      else{Q.hintPair=p;Q.pick=null;Q.fb=fb('info','İpucu','Kesik çerçeveli iki terim birleşebilir.');}
    }
  }else{
    if(Q.hint%2===1)Q.fb=fb('info','İpucu','Tek × içeren sütunlara bak. O × hangi satırdaysa o PI essential\'dır ve seçilmek zorundadır.');
    else Q.fb=fb('info','İpucu',`Minimal kapakta ${Q.an.sols[0].length} PI var.`);
  }
  draw();
}
function cCheck(){
  const cubes=[...Q.csel].sort((a,b)=>a-b).map(i=>Q.an.prims[i]);
  const r=evaluateCover(cubes,Q.an);
  Q.uncovered=new Set();
  if(r.status==='incomplete'){
    Q.uncovered=new Set(r.uncovered);
    Q.fb=fb('bad',`${r.uncovered.length} minterim kapsanmadı`,'Kırmızı başlıklı sütunlar seçtiğin PI\'larla kapanmıyor.');
  }else if(r.status==='notmin'){
    Q.fb=fb('warn','Geçerli ama minimal değil',`Maliyetin ${costLabel(cubes,'sop',Q.model)}. Daha ucuz bir kapak var. Essential PI'lardan başla, kalan sütunları en ucuz şekilde kapat.`);
  }else{
    Q.done=true;T.stop();if(!Q.revealed)Core.credit(T.elapsed());
    Q.fb=fb('ok','Doğru, minimal',`<code>f(A,B,C,D) = ${esc(exprString(cubes,4,'sop'))}</code><br>Maliyet ${costLabel(cubes,'sop',Q.model)}. Süre ${Core.fmtTime(T.elapsed())}.`);
  }
  draw();
}
function cReveal(){
  Q.csel=new Set(Q.an.sols[0]);Q.uncovered=new Set();Q.step=2;Q.done=true;
  if(!Q.revealed){Q.revealed=true;Core.breakStreak();}
  T.stop();
  const cubes=Q.an.sols[0].map(i=>Q.an.prims[i]);
  const alt=Q.an.sols.length>1?` Eşit maliyetli ${Q.an.sols.length-1} çözüm daha var.`:'';
  Q.fb=fb('info','Çözüm',`<code>f(A,B,C,D) = ${esc(exprString(cubes,4,'sop'))}</code><br>Maliyet ${costLabel(cubes,'sop',Q.model)}.${alt}`);
  draw();
}

function entryHTML(ci,e,st,label,extra){
  const key=cubeKey(e.cube);
  const picked=Q.pick&&Q.pick.col===ci&&Q.pick.key===key;
  const hp=Q.hintPair&&Q.hintPair.col===ci&&(Q.hintPair.a===key||Q.hintPair.b===key);
  const isNew=Q.lastNew===key+'@'+ci;
  const pi=Q.step>=2&&st!=='done';
  const cls='qe'+(st==='done'?' done':'')+(st==='partial'?' partial':'')+(picked?' pick':'')+(hp?' hint':'')+(isNew?' new':'')+(pi?' pi':'');
  const dis=(Q.done||Q.step!==1)?' disabled':'';
  const tk=st==='done'?'✓':(st==='partial'?'…':(pi?'PI':''));
  return`<button type="button" class="${cls}" data-qe="${ci}|${key}" data-fk="e${ci}-${key}" aria-pressed="${!!picked}"${dis}><span class="m">${label}</span><code>${cubeString(e.cube,4)}</code>${extra||''}<span class="tk">${tk}</span></button>`;
}
function colsHTML(cs){
  const out=[];
  cs.forEach((entries,ci)=>{
    if(!entries||!entries.length)return;
    let inner='';
    if(ci===0){
      for(let k=0;k<=4;k++){
        inner+=`<div class="qgh">${k} tane 1</div>`;
        for(let m=0;m<16;m++){
          if(popcount(m)!==k)continue;
          const v=Q.q.vals[m];
          const e=entries.find(x=>x.cube.val===m);
          if(!e)inner+=`<div class="qe zero"><span class="m">m${m}</span><code>${bin(m,4)}</code><span class="fv">0</span><span class="tk"></span></div>`;
          else inner+=entryHTML(0,e,entryState(cs,0,e),'m'+m,`<span class="fv">${v}</span>`);
        }
      }
    }else{
      const groups={};
      sortEntries(entries).forEach(e=>{const k=popcount(e.cube.val);(groups[k]=groups[k]||[]).push(e);});
      Object.keys(groups).sort((a,b)=>a-b).forEach(k=>{
        inner+=`<div class="qgh">${k} tane 1</div>`;
        for(const e of groups[k])inner+=entryHTML(ci,e,entryState(cs,ci,e),cubeCells(e.cube,4).join(','),'');
      });
    }
    out.push(`<div class="qcol"><div class="qct">${ci+1}. sütun</div>${inner}</div>`);
  });
  return out.join('');
}
function html(){
  const st=Q.step===1?['now','','']:(Q.done?['done','done','done']:['done','now','']);
  const labels=['Birleştir','PI tablosu','Sonuç'];
  const steps=`<ol class="steps">${labels.map((l,i)=>`<li data-s="${st[i]}">${i+1}. ${l}</li>`).join('')}</ol>`;
  const colsH=`<div class="qm-cols" data-keepscroll="qmcols">${colsHTML(cols())}</div>`;
  let body;
  if(Q.step===1){
    body=`<p class="note">Aynı sütunda, tireleri aynı yerde ve <b>tam 1 bit farklı</b> iki terime sırayla dokun. Sonuç yandaki sütuna taşınır. Bir terim, katıldığı <b>tüm</b> gruplamalar yapılınca yeşil olur, o zamana kadar sarı ya da sade kalır. Hiçbir şey birleşmeyene kadar devam et. Yeşil olmayan terimler prime implicant olur.</p>
    ${colsH}
    <div class="row"><button type="button" class="btn primary" data-act="qdone">Birleştirme bitti</button><button type="button" class="btn" data-act="qundo"${Q.hist.length?'':' disabled'}>Son birleştirmeyi geri al</button><button type="button" class="btn" data-act="qhint">İpucu</button><button type="button" class="btn ghost" data-act="qfill">Tabloyu tamamla</button></div>`;
  }else{
    body=`${colsH}${Chart.html({an:Q.an,n:4,mode:'sop',model:Q.model,sel:Q.csel,uncovered:Q.uncovered,done:Q.done,showCube:true})}`;
  }
  const controls=`<div class="controls"><div class="ctl"><label for="qModel">Maliyet</label><select id="qModel">${Object.keys(Core.MODEL_LABEL).map(k=>`<option value="${k}"${k===Q.model?' selected':''}>${Core.MODEL_LABEL[k]}</option>`).join('')}</select></div></div>`;
  return`${controls}<article class="card">
    <div class="qhead"><span class="qno">Soru ${Q.qno} · Quine-McCluskey · 4 değişken</span>${T.html()}</div>
    <p class="task">Tabloda terimleri birleştirerek tüm prime implicantları bul, sonra PI tablosunu sadeleştirip minimum maliyetli SOP ifadesini bul.</p>
    <div class="fn">${esc(stmt(Q.q))}</div>
    <p class="note">φ: don't care. Tabloda m değeri, ABCD bitleri ve fonksiyon değeri (1 ya da X) yazar. Değeri 0 olan satırlar soluk, birleştirmeye girmez.</p>
    ${steps}
    <div class="side">${body}<div aria-live="polite">${fbHTML(Q.fb)}</div>
    <div class="row"><button type="button" class="btn${Q.done?' primary':' ghost'}" data-act="next">${Q.done?'Sonraki soru':'Yeni soru (atla)'}</button></div></div>
  </article>`;
}
function draw(){
  render(root,html());
  const fresh=root.querySelector('.qe.new');
  if(fresh&&fresh.scrollIntoView)fresh.scrollIntoView({block:'nearest',inline:'nearest'});
}

Pages.qm={
  mount(el){
    root=el;
    el.addEventListener('click',e=>{
      const t=e.target;
      const qe=t.closest('[data-qe]');
      if(qe){const p=qe.dataset.qe.split('|');pickEntry(+p[0],p[1]);return;}
      const row=t.closest('[data-pi]');
      if(row&&Q.step===2&&!Q.done){
        const i=+row.dataset.pi;
        if(Q.csel.has(i))Q.csel.delete(i);else Q.csel.add(i);
        Q.uncovered=new Set();Q.fb=null;draw();return;
      }
      const a=t.closest('[data-act]');if(!a)return;
      switch(a.dataset.act){
        case'qdone':done1();break;
        case'qundo':undo();break;
        case'qfill':fill();break;
        case'qhint':hint();break;
        case'cCheck':cCheck();break;
        case'cHint':hint();break;
        case'cReveal':cReveal();break;
        case'next':newQ();draw();break;
      }
    });
    el.addEventListener('change',e=>{
      if(e.target.id==='qModel'){Q.model=e.target.value;newQ();draw();}
    });
    newQ();draw();
  }
};
})();

</script>
<script>
/* ---- Kanonik formlar: Σm / ΠM, tümleyen, De Morgan, sayma ----
   Pure generators and checkers first (exported for node); UI below runs only inside the page. */
(function(){
'use strict';

/* ================= pure part ================= */
const rnd=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const VN=['A','B','C','D'];
const allIdx=n=>Array.from({length:1<<n},(_,i)=>i);
const comp=(L,n)=>allIdx(n).filter(i=>!L.includes(i));
const sortU=a=>[...new Set(a)].sort((x,y)=>x-y);
const lst=L=>L.join(', ');
const vars=n=>VN.slice(0,n).join(',');
const bitOf=(i,j,n)=>(i>>(n-1-j))&1;
const minTerm=(i,n)=>VN.slice(0,n).map((v,j)=>bitOf(i,j,n)?v:v+"'").join(' ');
const maxTerm=(i,n)=>'('+VN.slice(0,n).map((v,j)=>bitOf(i,j,n)?v+"'":v).join(' + ')+')';
const binom=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r);};

const TYPE_NAME={s2p:'Σm → ΠM',p2s:'ΠM → Σm',compS:'Tümleyen (Σm)',compP:'Tümleyen (ΠM)',e2s:'İfade → Σm',e2p:'İfade → ΠM',
  i2min:'Mintermi yaz',i2max:'Maxtermi yaz',t2min:'Terimden minterm no',t2max:'Terimden maxterm no',dm:'De Morgan bağlantısı',dc:'Don\'t care\'li fonksiyon',count:'Sayma'};
const TYPES=Object.keys(TYPE_NAME);
const WEIGHTS={s2p:1,p2s:1,compS:.8,compP:.8,e2s:1.2,e2p:1.2,i2min:.8,i2max:.8,t2min:.7,t2max:.7,dm:1,dc:1,count:1.2};
function pickType(last){
  const ts=TYPES.filter(t=>t!==last);let tot=0;ts.forEach(t=>tot+=WEIGHTS[t]);
  let r=Math.random()*tot;for(const t of ts){r-=WEIGHTS[t];if(r<=0)return t;}return ts[0];
}
/* random index list with 2..N-2 entries */
function randList(n){
  const N=1<<n,k=rnd(2,Math.min(N-2,n===3?5:9));
  return sortU(shuf(allIdx(n)).slice(0,k));
}

/* ---- random expression that is neither Σm nor ΠM already ---- */
function lit(v,neg){return neg?v+"'":v;}
function randProd(n,k){
  const vs=shuf(VN.slice(0,n)).slice(0,k).sort();
  return vs.map(v=>lit(v,Math.random()<.4)).join('');
}
function randSum(n,k){
  const vs=shuf(VN.slice(0,n)).slice(0,k).sort();
  return '('+vs.map(v=>lit(v,Math.random()<.4)).join('+')+')';
}
function randExpr(n){
  const E=require_expr();
  for(let t=0;t<200;t++){
    const form=pick(['sop','sop','pos','mix','mix2']);
    let s;
    if(form==='sop'){const m=rnd(2,3),ps=[];for(let i=0;i<m;i++)ps.push(randProd(n,rnd(1,Math.min(3,n))));s=ps.join(' + ');}
    else if(form==='pos'){const m=rnd(2,3),ps=[];for(let i=0;i<m;i++)ps.push(randSum(n,rnd(2,Math.min(3,n))));s=ps.join('');}
    else if(form==='mix'){const v=pick(VN.slice(0,n));s=lit(v,Math.random()<.4)+randSum(n,2)+' + '+randProd(n,2);}
    else{s=randSum(n,2)+'('+randProd(n,2)+' + '+lit(pick(VN.slice(0,n)),Math.random()<.5)+')';}
    let ast;try{ast=E.parseExpr(s);}catch(e){continue;}
    const vs=VN.slice(0,n);
    if(E.exprVars(ast).length<n)continue;
    const tv=E.truthVec(ast,vs),ones=tv.reduce((a,b)=>a+b,0);
    if(ones<2||ones>(1<<n)-2)continue;
    return{s,ones:tv.map((v,i)=>v?i:-1).filter(i=>i>=0)};
  }
  return{s:"AB + C'",ones:null};
}
function require_expr(){
  if(typeof module!=='undefined'&&typeof require==='function')return require('../expr.js');
  return{parseExpr,evalNode,exprVars,truthVec,literalCount,sameFunction,parseIntList};
}

/* ---- question generators ---- */
function genQuestion(n,last){
  const type=pickType(last);
  const N=1<<n,q={type,n,N};
  const fname=n===3?'f(A,B,C)':'f(A,B,C,D)';
  switch(type){
    case's2p':{const L=randList(n);q.stmt=fname+' = Σm('+lst(L)+')';q.task='f\'yi ΠM (maxterm çarpımı) olarak yaz. Maxterm numaralarını gir.';q.ans={kind:'list',v:comp(L,n)};q.ctx=L;break;}
    case'p2s':{const L=randList(n);q.stmt=fname+' = ΠM('+lst(L)+')';q.task='f\'yi Σm (minterm toplamı) olarak yaz. Minterm numaralarını gir.';q.ans={kind:'list',v:comp(L,n)};q.ctx=L;break;}
    case'compS':{const L=randList(n);q.stmt=fname+' = Σm('+lst(L)+')';q.task='f\' (f\'nin tümleyeni) için Σm listesini yaz.';q.ans={kind:'list',v:comp(L,n)};q.ctx=L;break;}
    case'compP':{const L=randList(n);q.stmt=fname+' = ΠM('+lst(L)+')';q.task='f\' (f\'nin tümleyeni) için ΠM listesini yaz.';q.ans={kind:'list',v:comp(L,n)};q.ctx=L;break;}
    case'e2s':case'e2p':{
      const e=randExpr(n);q.stmt=fname+' = '+e.s;
      q.task=type==='e2s'?'İfadeyi kanonik Σm biçimine çevir. Minterm numaralarını gir.':'İfadeyi kanonik ΠM biçimine çevir. Maxterm numaralarını gir.';
      q.expr=e.s;const ones=e.ones||[];q.ans={kind:'list',v:type==='e2s'?ones:comp(ones,n)};q.ctx=ones;break;}
    case'i2min':{const i=rnd(0,N-1);q.idx=i;q.stmt='m'+i+'  ('+vars(n)+')';q.task=n+' değişkenli (A en anlamlı bit) fonksiyonda m'+i+' mintermini çarpım terimi olarak yaz.';q.ans={kind:'term',form:'min',i};break;}
    case'i2max':{const i=rnd(0,N-1);q.idx=i;q.stmt='M'+i+'  ('+vars(n)+')';q.task=n+' değişkenli (A en anlamlı bit) fonksiyonda M'+i+' maxtermini toplam terimi olarak yaz.';q.ans={kind:'term',form:'max',i};break;}
    case't2min':{const i=rnd(0,N-1);q.idx=i;q.stmt=minTerm(i,n);q.task='Bu çarpım terimi ('+vars(n)+', A en anlamlı bit) kaçıncı mintermdir? Numarayı gir.';q.ans={kind:'num',v:i};break;}
    case't2max':{const i=rnd(0,N-1);q.idx=i;q.stmt=maxTerm(i,n);q.task='Bu toplam terimi ('+vars(n)+', A en anlamlı bit) kaçıncı maxtermdir? Numarayı gir.';q.ans={kind:'num',v:i};break;}
    case'dm':{
      const L=randList(n);
      if(Math.random()<.5){q.stmt='f\' = Σm('+lst(L)+')   ('+fname+')';q.task='f\'yi ΠM olarak yaz. De Morgan: f\' = Σm(L) ise f = ΠM(?).';q.ans={kind:'list',v:L};q.ctx=L;q.v=1;}
      else{q.stmt=fname+' = Σm('+lst(L)+')';q.task='f\' fonksiyonunu ΠM biçiminde yaz (f\' = ΠM(?)).';q.ans={kind:'list',v:L};q.ctx=L;q.v=2;}
      break;}
    case'dc':{
      const L=randList(n);const rest=comp(L,n);if(rest.length<3){return genQuestion(n,type);}
      const D=sortU(shuf(rest).slice(0,rnd(1,Math.min(3,rest.length-1))));
      q.ctx=L;q.dc=D;q.stmt=fname+' = Σm('+lst(L)+') + Σφ('+lst(D)+')';
      q.task='Aynı fonksiyonu ΠM biçiminde yaz: ΠM(…) · Πφ('+lst(D)+'). Sadece ΠM listesini (don\'t care olmayan sıfırlar) gir.';
      q.ans={kind:'list',v:comp(sortU(L.concat(D)),n)};break;}
    case'count':{
      const v=pick(['funcs','kmin','dcfill','dual']);q.v=v;
      if(v==='funcs'){q.stmt=n+' değişkenli Boole fonksiyonları';q.task='Kaç farklı '+n+' değişkenli Boole fonksiyonu vardır? Sayıyı ya da 2^k biçimini yaz.';q.ans={kind:'num',v:Math.pow(2,N)};}
      else if(v==='kmin'){const k=rnd(1,n===3?3:4);q.k=k;q.stmt=n+' değişken, tam '+k+' minterm';q.task=n+' değişkenli kaç farklı fonksiyonun Σm gösteriminde tam '+k+' minterm vardır?';q.ans={kind:'num',v:binom(N,k)};}
      else if(v==='dcfill'){const d=rnd(2,n===3?4:5);q.d=d;q.stmt='Σm (sabit) + '+d+' adet don\'t care';q.task='Bir fonksiyonun mintermleri belli, '+d+' girişi don\'t care. Don\'t care\'leri 0 ya da 1 seçerek kaç farklı tam tanımlı fonksiyon elde edilir?';q.ans={kind:'num',v:Math.pow(2,d)};}
      else{const k=rnd(2,N-2);q.k=k;q.stmt=n+' değişken, Σm içinde '+k+' terim';q.task='Bir fonksiyonun Σm gösteriminde '+k+' minterm var ('+n+' değişken). Aynı fonksiyonun ΠM gösteriminde kaç maxterm vardır?';q.ans={kind:'num',v:N-k};}
      break;}
  }
  return q;
}

/* ---- parsing user answers ---- */
function parseNum(s){
  s=String(s).trim().replace(/\s+/g,'');
  let m=s.match(/^(\d+)\^(\d+)$/);if(m)return Math.pow(+m[1],+m[2]);
  m=s.match(/^(\d+)$/);if(m)return +m[1];
  m=s.match(/^(\d{1,3}([.,]\d{3})+)$/);if(m)return +s.replace(/[.,]/g,'');
  return null;
}
function termCheck(q,str){
  const E=require_expr();let ast;
  try{ast=E.parseExpr(str);}catch(e){return{ok:false,msg:'İfade okunamadı: '+e.message};}
  const n=q.n,vs=VN.slice(0,n);
  const used=E.exprVars(ast);
  if(used.length!==n||E.literalCount(ast)!==n)return{ok:false,msg:'Kanonik terimde her değişken tam bir kez geçer ('+n+' literal).'};
  const tv=E.truthVec(ast,vs),i=q.ans.i;
  if(q.ans.form==='min'){
    if(tv.filter(v=>v).length!==1)return{ok:false,msg:'Bir minterm tek bir satırda 1 olur. Yazdığın terim çarpım biçiminde değil.'};
    return tv[i]===1?{ok:true}:{ok:false,msg:'Terim geçerli bir minterm ama bu numaraya ait değil.'};
  }
  if(tv.filter(v=>!v).length!==1)return{ok:false,msg:'Bir maxterm tek bir satırda 0 olur. Yazdığın terim toplam biçiminde değil.'};
  return tv[i]===0?{ok:true}:{ok:false,msg:'Terim geçerli bir maxterm ama bu numaraya ait değil.'};
}
function check(q,input){
  const a=q.ans,s=String(input||'').trim();
  if(!s)return{ok:false,empty:true,msg:'Önce bir cevap gir.'};
  if(a.kind==='list'){
    const got=sortU(require_expr().parseIntList(s)),want=a.v;
    const bad=got.filter(x=>x<0||x>=q.N);
    if(bad.length)return{ok:false,msg:'Listede aralık dışı numara var (0 ile '+(q.N-1)+' arası olmalı).'};
    const miss=want.filter(x=>!got.includes(x)),extra=got.filter(x=>!want.includes(x));
    if(!miss.length&&!extra.length)return{ok:true,msg:'Liste tam ve doğru ('+want.length+' terim).'};
    const p=[];
    if(miss.length)p.push(miss.length+' numara eksik');
    if(extra.length)p.push(extra.length+' numara fazla');
    return{ok:false,msg:p.join(', ')+'. Listede '+got.length+' numara var, doğrusunda '+want.length+' olmalı.'};
  }
  if(a.kind==='num'){
    const v=parseNum(s);
    if(v===null)return{ok:false,msg:'Sayı olarak okunamadı. Örn. 70 ya da 2^16.'};
    if(v===a.v)return{ok:true,msg:'Doğru: '+a.v+'.'};
    return{ok:false,msg:v>a.v?'Sonuç bundan küçük.':'Sonuç bundan büyük.'};
  }
  const r=termCheck(q,s);
  return r.ok?{ok:true,msg:'Doğru terim.'}:{ok:false,msg:r.msg};
}

/* ---- hints & solutions ---- */
function hints(q){
  const n=q.n,N=q.N;
  switch(q.type){
    case's2p':return['Σm ve ΠM aynı fonksiyonu anlatır: bir satır ya mintermdir (f=1) ya maxterm (f=0).','Toplam '+N+' satır var (0 ile '+(N-1)+'). Σm listesinde olmayan her numara ΠM listesindedir.'];
    case'p2s':return['ΠM listesi f=0 olan satırlardır. Geri kalanlar f=1\'dir.','0 ile '+(N-1)+' arasındaki numaralardan ΠM\'de olmayanları yaz.'];
    case'compS':return['f\' hangi satırlarda 1\'dir? f\'nin 0 olduğu satırlarda.','Listede olmayan numaralar.'];
    case'compP':return['f\' hangi satırlarda 0\'dır? f\'nin 1 olduğu satırlarda.','ΠM(L) ise f, L dışındaki satırlarda 1\'dir. f\' bu satırlarda 0 olur.'];
    case'e2s':case'e2p':return['İfadeyi '+N+' satır için sırayla değerlendir (A en anlamlı bit: 000, 001, …).','Çarpım terimi, içindeki tüm literaller 1 ise 1 verir. Toplam terimi, tüm literaller 0 ise 0 verir.',(q.type==='e2s'?'Σm: ifadenin 1 olduğu satır numaraları.':'ΠM: ifadenin 0 olduğu satır numaraları.')];
    case'i2min':return['Numarayı '+n+' bitlik ikilik yaz (A en soldaki bit).','Minterm\'de bit 1 ise değişken olduğu gibi, bit 0 ise tümleyeniyle yazılır.'];
    case'i2max':return['Numarayı '+n+' bitlik ikilik yaz (A en soldaki bit).','Maxterm\'de bit 0 ise değişken olduğu gibi, bit 1 ise tümleyeniyle yazılır (minterm\'in tersi).'];
    case't2min':return['Her literal için asıl değişken ise 1, tümleyeniyle ise 0 yaz.','Elde ettiğin '+n+' bitlik ikilik sayıyı ondalığa çevir.'];
    case't2max':return['Maxterm\'de asıl değişken ise 0, tümleyeniyle ise 1 yaz.','Elde ettiğin '+n+' bitlik ikilik sayıyı ondalığa çevir.'];
    case'dm':return['M_i = (m_i)\'. Yani f\'nin mintermleri f\'nin ΠM\'sinde değil, f\'nin kendi ΠM\'sinde maxterm numarası olur.','Σm(L) ile ifade edilen fonksiyonun tümleyeni ΠM(L) olur; f\' = Σm(L) ise f = ΠM(L).'];
    case'dc':return['ΠM listesine yalnızca f=0 olan satırlar girer.','Don\'t care satırları ne mintermdir ne maxterm. Bu yüzden iki listede de bulunmazlar.','Numaralar: tüm satırlar eksi Σm eksi Σφ.'];
    case'count':
      if(q.v==='funcs')return['Doğruluk tablosunda '+N+' satır var ve her satır 0 ya da 1 olabilir.','Sonuç 2^'+N+'.'];
      if(q.v==='kmin')return[N+' satırdan hangi k tanesinin 1 olacağını seçiyorsun.','C('+N+', '+q.k+') kombinasyonu.'];
      if(q.v==='dcfill')return['Her don\'t care bağımsız olarak 0 ya da 1 olabilir.','Her biri 2 seçenek: 2^d.'];
      return['Her satır minterm ya da maxterm olur, ikisi birden olmaz.','Maxterm sayısı = toplam satır − minterm sayısı.'];
  }
  return[];
}
function solution(q){
  const n=q.n,N=q.N,a=q.ans;
  const L=x=>'`'+lst(x)+'`';
  switch(q.type){
    case's2p':return['Tüm numaralar: 0 ile '+(N-1)+'.','Σm listesinde olmayanlar f=0 satırlarıdır: '+L(a.v)+'.','f = ΠM('+lst(a.v)+')'];
    case'p2s':return['Tüm numaralar: 0 ile '+(N-1)+'.','ΠM listesinde olmayanlar f=1 satırlarıdır: '+L(a.v)+'.','f = Σm('+lst(a.v)+')'];
    case'compS':return['f\' tam olarak f\'nin 0 olduğu satırlarda 1\'dir.','f\' = Σm('+lst(a.v)+')'];
    case'compP':return['f\' tam olarak f\'nin 1 olduğu satırlarda 0\'dır; ΠM(L) ise bunlar L dışındaki satırlardır.','f\' = ΠM('+lst(a.v)+')'];
    case'e2s':case'e2p':{
      const ones=q.ctx,zeros=comp(ones,n);
      return['İfadeyi '+N+' satır için değerlendir.','f=1 olan satırlar: '+L(ones)+'. f=0 olan satırlar: '+L(zeros)+'.',q.type==='e2s'?'Σm('+lst(ones)+')':'ΠM('+lst(zeros)+')'];}
    case'i2min':{const b=q.idx.toString(2).padStart(n,'0');return[q.idx+' = '+b+' (ikilik).','Bit 1 → değişken, bit 0 → tümleyen.','m'+q.idx+' = `'+minTerm(q.idx,n)+'`'];}
    case'i2max':{const b=q.idx.toString(2).padStart(n,'0');return[q.idx+' = '+b+' (ikilik).','Bit 0 → değişken, bit 1 → tümleyen.','M'+q.idx+' = `'+maxTerm(q.idx,n)+'`'];}
    case't2min':{const b=q.idx.toString(2).padStart(n,'0');return['Asıl değişken → 1, tümleyen → 0: '+b+'.','İkilik '+b+' = '+q.idx+'.','Bu terim m'+q.idx+'.'];}
    case't2max':{const b=q.idx.toString(2).padStart(n,'0');return['Asıl değişken → 0, tümleyen → 1: '+b+'.','İkilik '+b+' = '+q.idx+'.','Bu terim M'+q.idx+'.'];}
    case'dm':return['M_i = (m_i)\' olduğundan Σm(L) fonksiyonunun tümleyeni ΠM(L) olur.',q.v===1?'f\' = Σm('+lst(a.v)+') ise f = ΠM('+lst(a.v)+').':'f = Σm('+lst(a.v)+') ise f\' = ΠM('+lst(a.v)+').'];
    case'dc':return['ΠM listesi: yalnızca f=0 olan satırlar.','Σm ve Σφ dışında kalanlar: '+L(a.v)+'.','f = ΠM('+lst(a.v)+') · Πφ('+lst(q.dc)+')'];
    case'count':
      if(q.v==='funcs')return[N+' satır, her biri 0 ya da 1.','2^'+N+' = '+a.v];
      if(q.v==='kmin')return[N+' satırdan '+q.k+' tanesini 1 seç.','C('+N+', '+q.k+') = '+a.v];
      if(q.v==='dcfill')return['Her don\'t care için 2 seçenek.','2^'+q.d+' = '+a.v];
      return['Her satır minterm ya da maxterm: toplam '+N+'.',N+' − '+q.k+' = '+a.v];
  }
  return[];
}
function answerText(q){
  const a=q.ans;
  if(a.kind==='list')return lst(a.v);
  if(a.kind==='num')return String(a.v);
  return a.form==='min'?minTerm(a.i,q.n):maxTerm(a.i,q.n);
}

if(typeof module!=='undefined'){module.exports={genQuestion,check,hints,solution,answerText,parseNum,minTerm,maxTerm,comp,TYPES,TYPE_NAME,pickType,binom};return;}

/* ================= UI part ================= */
const {esc,fb,fbHTML,render}=Core;
const T=Core.timer();
let root=null;
const S={n:3,q:null,qno:0,last:null,input:'',fb:null,phase:'ask',hint:0,hintShown:[],attempts:0};

function newQuestion(){
  S.q=genQuestion(S.n,S.last);S.last=S.q.type;S.qno++;S.input='';S.fb=null;S.phase='ask';S.hint=0;S.hintShown=[];S.attempts=0;
  T.start();
}
const REF=`<details class="cn-ref"><summary>Hatırlatma</summary><div class="cn-refbody">
<p><b>Minterm m<sub>i</sub></b>: i\'nin ikilik karşılığında bit 1 ise değişken, bit 0 ise tümleyen yazılır; terimler çarpılır. Yalnızca o satırda 1 olur. A en anlamlı bit.</p>
<p><b>Maxterm M<sub>i</sub></b>: bit 0 ise değişken, bit 1 ise tümleyen yazılır; terimler toplanır. Yalnızca o satırda 0 olur. M<sub>i</sub> = (m<sub>i</sub>)\'.</p>
<p><b>Σm(L)</b> f=1 olan satırları, <b>ΠM(K)</b> f=0 olan satırları listeler. Aynı fonksiyon için K, L\'nin tümleyenidir (0 ile 2<sup>n</sup>−1 arası).</p>
<p><b>Tümleyen</b>: f\' için 1 ve 0 satırları yer değiştirir. Σm(L) fonksiyonunun f\'si Σm(L\'nin tümleyeni) = ΠM(L).</p>
<p><b>Don\'t care Σφ</b>: ne minterm ne maxterm sayılır, iki listede de yer almaz.</p>
<p><b>Sayma</b>: n değişkenli fonksiyon sayısı 2<sup>2<sup>n</sup></sup>. Tam k minterm içeren: C(2<sup>n</sup>, k). d don\'t care: 2<sup>d</sup> tamamlama.</p>
</div></details>`;

function placeholder(q){
  const a=q.ans;
  if(a.kind==='list')return'örn. 0, 3, 5, 6';
  if(a.kind==='num')return q.type==='count'?'örn. 70 ya da 2^16':'örn. 5';
  return a.form==='min'?"örn. A B' C":"örn. (A + B' + C)";
}
function draw(){
  const q=S.q,done=S.phase!=='ask',hs=hints(q);
  const ctl=`<div class="controls"><div class="ctl"><span class="lab">Değişken sayısı</span><div class="seg" role="group" aria-label="Değişken sayısı">${[3,4].map(w=>`<button type="button" data-act="n" data-v="${w}" data-fk="n-${w}" aria-pressed="${S.n===w}">${w} değişken</button>`).join('')}</div></div></div>`;
  const hintBox=S.hintShown.length?`<div class="fb info"><strong>İpucu</strong>${S.hintShown.map((t,i)=>`<p>${i+1}. ${esc(t)}</p>`).join('')}</div>`:'';
  const sol=S.phase==='rev'?`<div class="cn-sol"><strong>Çözüm</strong><ol>${solution(q).map(l=>`<li>${esc(l).replace(/`([^`]+)`/g,'<code>$1</code>')}</li>`).join('')}</ol></div>`:'';
  const ph=placeholder(q);
  render(root,ctl+`<div class="card cn-card">
    <div class="qhead"><span class="qno">Soru ${S.qno} · ${esc(TYPE_NAME[q.type])}</span>${T.html()}</div>
    <p class="task">${esc(q.task)}</p>
    <div class="fn cn-fn">${esc(q.stmt)}</div>
    <div class="cn-ans"><label for="cn-in">Cevap</label><input id="cn-in" class="cn-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(ph)}" value="${esc(S.input)}" data-fk="cn-in"${done?' disabled':''}></div>
    ${hintBox}<div aria-live="polite">${fbHTML(S.fb)}</div>${sol}
    <div class="row">
      <button type="button" class="btn primary" data-act="check"${done?' disabled':''}>Kontrol et</button>
      <button type="button" class="btn" data-act="hint"${done||S.hint>=hs.length?' disabled':''}>İpucu${hs.length&&!done?` (${S.hint}/${hs.length})`:''}</button>
      <button type="button" class="btn ghost" data-act="reveal"${done?' disabled':''}>Çözümü göster</button>
      <button type="button" class="btn${done?' primary':' ghost'}" data-act="next" data-fk="next">${done?'Sonraki soru':'Yeni soru (atla)'}</button>
    </div>
  </div>`+REF);
}
function doCheck(){
  if(S.phase!=='ask')return;
  const r=check(S.q,S.input);
  if(r.empty){S.fb=fb('warn','Eksik cevap',esc(r.msg));draw();return;}
  if(r.ok){S.phase='done';T.stop();Core.credit(T.elapsed());S.fb=fb('ok','Doğru',esc(r.msg)+'<br>Süre '+Core.fmtTime(T.elapsed())+'.');}
  else{S.attempts++;S.fb=fb('bad','Henüz değil',esc(r.msg));}
  draw();
}
function doHint(){
  if(S.phase!=='ask')return;
  const hs=hints(S.q);if(S.hint>=hs.length)return;
  S.hintShown.push(hs[S.hint]);S.hint++;draw();
}
function doReveal(){
  if(S.phase!=='ask')return;
  S.phase='rev';S.input=answerText(S.q);T.stop();Core.breakStreak();
  S.fb=fb('info','Çözüm gösterildi','Bu soru için puan yok. Cevap: '+esc(answerText(S.q))+'.');draw();
}
Pages.canon={
  mount(el){
    root=el;
    root.addEventListener('click',e=>{
      const t=e.target.closest('[data-act]');if(!t||!root.contains(t))return;
      const act=t.dataset.act;
      if(act==='check')doCheck();else if(act==='hint')doHint();else if(act==='reveal')doReveal();
      else if(act==='next'){newQuestion();draw();}
      else if(act==='n'){const w=+t.dataset.v;if(w!==S.n){S.n=w;S.last=null;newQuestion();}draw();}
    });
    root.addEventListener('input',e=>{if(e.target.id==='cn-in')S.input=e.target.value;});
    root.addEventListener('keydown',e=>{if(e.target.id==='cn-in'&&e.key==='Enter'){e.preventDefault();S.input=e.target.value;doCheck();}});
    newQuestion();draw();
  }
};
})();
