  function draw(){Core.render(root,html());refresh();}

  /* ---------- question flow ---------- */
  function newQ(){
    const q=NN?GL.genNandNor({type:S.qf,fam:S.fam}):GL.genGates({type:S.qf,nv:S.nv});
    S.q=q;S.qno++;S.sel=null;S.tool=null;S.pending=null;S.drag=null;S.hoverPin=null;S.vals={};q.vars.forEach(v=>{S.vals[v]=0;});
    S.undo=[];S.fb=null;S.done=false;S.revealed=false;S.hint=0;S.text='';S.choice=null;S.flag=new Set();
    if(q.kind==='board'){S.H=420;S.B={gates:[],wires:{},next:1};}
    else{S.H=q.vars.length>=4?340:300;S.B=boardFromNet(q.net,GL.layoutNet(q.net,{H:S.H}));}
    T.start();
  }
  function finish(ok){
    S.done=true;S.tool=null;S.pending=null;S.sel=null;T.stop();
    if(ok)Core.credit(T.elapsed());
  }
  function refInfo(cone){
    const ref=refFor(),rc=ref.gates.length;
    let s=`Kapı sayısı: ${cone}. Başvuru çözüm: ${rc} kapı (${esc(S.q.refLabel)}).`;
    if(cone<rc)s+=' Başvurudan daha az kapı kullandın.';
    else if(cone>rc)s+=' Aynı işlev daha az kapıyla da kurulabilir.';
    return s;
  }
  function checkBoard(){
    const q=S.q,net=toNet(),an=GL.analyzeNet(net);
    if(an.outMissing){setFb(fbMk('warn','Çıkış bağlı değil',"F çıkışına henüz bir tel gelmiyor. Bir kapının çıkış noktasından F'nin giriş noktasına tel çek."));return;}
    if(an.cyc){setFb(fbMk('warn','Devrede döngü var','Bir kapının çıkışı doğrudan ya da başka kapılar üzerinden kendi girişine geri dönüyor. Kombinasyonel devrede geri besleme olmaz, bu teli sil ya da yönünü değiştir.'));return;}
    if(an.floating.length){
      S.flag=new Set(an.floating.map(f=>f.gid+'.'+f.i));refresh();
      setFb(fbMk('warn','Boş giriş var',`${an.floating.length} kapı girişi bağlı değil (turuncu halkalar). Boş giriş 0 sayılır, ama devre tamamlanmadan kontrol edilmez.`));return;
    }
    const tv=GL.netTruth(net);let first=-1,bad=0;
    tv.forEach((v,m)=>{if(v!==q.target[m]){bad++;if(first<0)first=m;}});
    if(bad){
      S.wrong=true;
      setFb(fbMk('bad','Yanlış',`<code>${rowText(first)}</code> satırında çıkış ${q.target[first]} olmalı, devren ${tv[first]} veriyor.`+(bad>1?` Toplam ${bad} satır tutmuyor (tabloda kırmızı).`:'')+' Kırmızı satıra tıklarsan giriş değerleri o satıra ayarlanır.'));
      return;
    }
    const dead=S.B.gates.length-an.cone.size;
    finish(true);
    S.fb=fbMk('ok','Doğru',`Devre ${tv.length} satırın hepsinde hedefle aynı. ${refInfo(an.cone.size)}`+(dead?` Çıkışa bağlı olmayan ${dead} kapı sayıya katılmadı.`:''));
    draw();
  }
  function checkText(){
    const q=S.q,raw=S.text.trim();
    if(!raw){setFb(fbMk('warn','İfade boş','Önce F için bir ifade yaz.'));return;}
    const src=raw.replace(/^\s*[A-Za-z]\s*(\([^)]*\))?\s*=/,'');
    let ast;
    try{ast=parseExpr(src);}catch(e){setFb(fbMk('warn','İfade okunamadı',esc(e.message)));return;}
    const extra=exprVars(ast).filter(v=>!q.vars.includes(v));
    if(extra.length){setFb(fbMk('warn','Soruda olmayan değişken','Devrede yalnızca '+q.vars.join(', ')+' girişleri var. Fazla: '+extra.join(', ')+'.'));return;}
    const tv=truthVec(ast,q.vars);let first=-1,bad=0;
    tv.forEach((v,m)=>{if(v!==q.target[m]){bad++;if(first<0)first=m;}});
    if(bad){
      S.wrong=true;
      setFb(fbMk('bad','Yanlış',`<code>${rowText(first)}</code> satırında devre ${q.target[first]} veriyor, ifaden ${tv[first]} veriyor.`+(bad>1?` ${bad} satırda fark var.`:'')+' Giriş düğmelerine tıklayarak devreyi bu satıra getirip çıkışı gözle.'));
      return;
    }
    finish(true);
    S.fb=fbMk('ok','Doğru','İfaden devreyle aynı işlevi veriyor. Devrenin kendi ifadesi: <code>'+esc(q.answerText)+'</code>');
    draw();
  }
  function checkChoice(){
    const q=S.q;
    if(!S.choice){setFb(fbMk('warn','Seçim yok','Bir kapı seç.'));return;}
    if(S.choice===q.answer){
      finish(true);S.fb=fbMk('ok','Doğru','Devre bir '+q.answer+' kapısı gibi davranıyor: <code>'+esc(q.answerText)+'</code>');draw();
    }else{
      S.wrong=true;
      setFb(fbMk('bad','Yanlış','Seçtiğin '+esc(S.choice)+' değil. Giriş düğmelerine tıklayarak her giriş kombinasyonunda çıkışa bak ve tabloyu bildiğin kapılarla karşılaştır.'));
    }
  }
  function check(){
    if(S.done)return;
    if(S.q.kind==='board')checkBoard();else if(S.q.ask==='mc')checkChoice();else checkText();
  }
  function hint(){
    if(S.done)return;
    const q=S.q;S.hint=Math.min(S.hint+1,q.kind==='board'?2:q.hints.length);
    let body=q.hints[0];
    if(q.kind==='board'){
      if(S.hint>=2){const r=refFor();body+=` Başvuru çözümde ${r.gates.length} kapı var (${GL.countTypes(r)}). Kapı sayısı ölçüt değil, önemli olan tablonun tutması.`;}
    }else if(S.hint>=2)body=q.hints[1];
    setFb(fbMk('info','İpucu '+S.hint,esc(body)));
  }
  function reveal(){
    if(S.done)return;
    const q=S.q;
    finish(false);Core.breakStreak();S.revealed=true;
    if(q.kind==='board'){
      const r=refFor();
      S.B=boardFromNet(r,GL.layoutNet(r,{H:S.H}));S.undo=[];S.flag=new Set();
      S.fb=fbMk('info','Çözüm tahtada',`Başvuru çözüm: ${r.gates.length} kapı (${esc(q.refLabel)}). Devrenin ifadesi: <code>${esc(GL.netExpr(r,true))}</code>`);
    }else S.fb=fbMk('info','Çözüm','<code>'+esc(q.answerText)+'</code>');
    draw();
  }

  /* ---------- pointer interaction ---------- */
  function svgPt(e){
    const svg=root.querySelector('.gt-svg'),r=svg.getBoundingClientRect();
    return{x:(e.clientX-r.left)*(CW/r.width),y:(e.clientY-r.top)*(S.H/r.height)};
  }
  function onDown(e){
    if(e.button!==0||!root)return;
    const pal=e.target.closest&&e.target.closest('.gt-pal');
    if(pal&&editable()){S.pdrag={type:pal.dataset.type,x0:e.clientX,y0:e.clientY,moved:false};return;}
    const svg=e.target.closest&&e.target.closest('.gt-svg');
    if(!svg)return;
    e.preventDefault();
    const p=svgPt(e);
    const pill=e.target.closest('.gt-inpill');
    if(pill){const v=pill.dataset.name;S.vals[v]=S.vals[v]?0:1;refresh();return;}
    if(!editable())return;
    const out=e.target.closest('.gt-pout');
    if(out){
      const src=out.dataset.src;
      if(S.pending&&S.pending.src===src){S.pending=null;refresh();return;}
      S.pending={src};S.mouse=p;S.drag={kind:'wire',x0:p.x,y0:p.y,moved:false};S.sel=null;refresh();return;
    }
    const pin=e.target.closest('.gt-pin');
    if(pin){
      const dst=pin.dataset.dst;
      if(S.pending){const s=S.pending.src;S.pending=null;S.drag=null;connect(s,dst);refresh();return;}
      if(S.B.wires[dst]){S.sel={kind:'wire',dst};refresh();}
      return;
    }
    const gate=e.target.closest('.gt-gate');
    if(gate){
      const g=gmap()[gate.dataset.gid];if(!g)return;
      S.pending=null;S.sel={kind:'gate',id:g.id};
      S.drag={kind:'gate',id:g.id,dx:p.x-g.x,dy:p.y-g.y,pre:snap(),moved:false,x0:p.x,y0:p.y};refresh();return;
    }
    const wh=e.target.closest('.gt-whit');
    if(wh){S.pending=null;S.sel={kind:'wire',dst:wh.dataset.dst};refresh();return;}
    if(S.pending){S.pending=null;refresh();return;}
    if(S.tool){placeGate(S.tool,p.x,p.y);refresh();return;}
    S.sel=null;refresh();
  }
  function onMove(e){
    if(!root||root.hidden)return;
    if(S.pdrag){
      const d=S.pdrag;
      if(!d.moved&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)>6){
        d.moved=true;
        const gh=document.createElement('div');gh.className='gt-ghost';gh.innerHTML=iconSVG(d.type);document.body.appendChild(gh);S.ghost=gh;
      }
      if(d.moved&&S.ghost){S.ghost.style.left=e.clientX+'px';S.ghost.style.top=e.clientY+'px';}
      return;
    }
    if(!S.drag&&!S.pending)return;
    if(!root.querySelector('.gt-svg'))return;
    const p=svgPt(e);
    const hp=e.target.closest&&e.target.closest('.gt-pin');
    S.hoverPin=hp?hp.dataset.dst:null;
    const d=S.drag;
    if(d){
      if(Math.hypot(p.x-d.x0,p.y-d.y0)>4)d.moved=true;
      if(d.kind==='gate'&&d.moved){
        const g=gmap()[d.id];
        if(g){
          const dm=GL.gdim(g.type,g.n);
          g.x=Math.min(Math.max(Math.round((p.x-d.dx)/5)*5,84),OUT_X-dm.w-22);
          g.y=Math.min(Math.max(Math.round((p.y-d.dy)/5)*5,2),S.H-dm.h-2);
        }
      }
    }
    S.mouse=p;refresh();
  }
  function onUp(e){
    if(S.pdrag){
      const d=S.pdrag;S.pdrag=null;
      if(S.ghost){S.ghost.remove();S.ghost=null;}
      if(d.moved&&root){
        const el=document.elementFromPoint(e.clientX,e.clientY);
        if(el&&root.contains(el)&&el.closest('.gt-svg')){const p=svgPt(e);placeGate(d.type,p.x,p.y);refresh();}
      }
      return;
    }
    const d=S.drag;if(!d)return;
    S.drag=null;
    if(d.kind==='wire'){
      if(d.moved&&S.pending){
        const el=document.elementFromPoint(e.clientX,e.clientY);
        const pin=el&&el.closest&&el.closest('.gt-pin');
        const s=S.pending.src;S.pending=null;
        if(pin&&root.contains(pin))connect(s,pin.dataset.dst);
      }
      S.hoverPin=null;refresh();
    }else if(d.kind==='gate'){
      if(d.moved){pushUndo(d.pre);clearFb();}
      refresh();
    }
  }
  function onKey(e){
    if(!root||root.hidden)return;
    const t=e.target;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'))return;
    if(e.key==='Delete'||e.key==='Backspace'){if(S.sel&&editable()){e.preventDefault();removeSel();refresh();}}
    else if(e.key==='Escape'){S.pending=null;S.tool=null;S.drag=null;refresh();}
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&S.q&&S.q.kind==='board'){e.preventDefault();undo();refresh();}
  }

  /* ---------- delegated clicks ---------- */
  function onClick(e){
    const row=e.target.closest('[data-row]');
    if(row&&S.q&&S.q.kind==='board'){
      const m=+row.dataset.row,n=S.q.vars.length;
      S.q.vars.forEach((v,i)=>{S.vals[v]=(m>>(n-1-i))&1;});refresh();return;
    }
    const b=e.target.closest('[data-act]');
    if(!b)return;
    const a=b.dataset.act,v=b.dataset.v;
    switch(a){
      case'tool':S.tool=S.tool===b.dataset.type?null:b.dataset.type;S.pending=null;refresh();break;
      case'del':removeSel();refresh();break;
      case'undo':undo();refresh();break;
      case'clear':clearAll();refresh();break;
      case'nin':S.nIn=+v;draw();break;
      case'qf':S.qf=v;newQ();draw();break;
      case'fam':S.fam=v;newQ();draw();break;
      case'nv':S.nv=v;newQ();draw();break;
      case'check':check();break;
      case'hint':hint();break;
      case'reveal':reveal();break;
      case'next':newQ();draw();break;
      case'choice':S.choice=b.dataset.c;S.fb=null;draw();break;
      case'sym':{
        const inp=root.querySelector('.qm-in input');if(!inp)break;
        const c=b.dataset.c,s0=inp.selectionStart==null?inp.value.length:inp.selectionStart,s1=inp.selectionEnd==null?s0:inp.selectionEnd;
        inp.value=inp.value.slice(0,s0)+c+inp.value.slice(s1);S.text=inp.value;
        inp.focus();inp.setSelectionRange(s0+c.length,s0+c.length);break;
      }
    }
  }
  function onDbl(e){
    const wh=e.target.closest&&e.target.closest('.gt-whit');
    if(wh&&editable()){S.sel={kind:'wire',dst:wh.dataset.dst};removeSel();refresh();}
  }

  return{
    mount(el){
      root=el;
      newQ();draw();
      el.addEventListener('pointerdown',onDown);
      el.addEventListener('click',onClick);
      el.addEventListener('dblclick',onDbl);
      el.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('.qm-in input')){S.text=e.target.value;if(S.fb&&S.fb.type!=='ok'){S.fb=null;setFbDom();}}});
      el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('.qm-in input')){e.preventDefault();check();}});
      document.addEventListener('pointermove',onMove);
      document.addEventListener('pointerup',onUp);
      document.addEventListener('keydown',onKey);
    },
    enter(){if(root)Core.tick();}
  };
}
Pages.gates=makePage('gates');
Pages.nandnor=makePage('nandnor');
})();

</script>
<script>
/* ---- Sayılar: işaretli / işaretsiz toplama, çıkarma, overflow, dönüşümler ----
   Pure generators and checkers come first (exported for node); the UI part below only runs inside the page. */
(function(){
'use strict';

/* ================= pure part ================= */
const rnd=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const maskOf=n=>(1<<n)-1;
const loOf=n=>-(1<<(n-1));
const hiOf=n=>(1<<(n-1))-1;
const sv=(v,n)=>{v&=maskOf(n);return v>=(1<<(n-1))?v-(1<<n):v;};
const toS=(v,n)=>(v&maskOf(n)).toString(2).padStart(n,'0');
const grp=s=>s.replace(/(.{4})(?=.)/g,'$1 ');
const gb=(v,n)=>grp(toS(v,n));
const MINUS='−';
const sg=v=>v<0?MINUS+(-v):'+'+v;
const ng=v=>v<0?MINUS+(-v):String(v);
const bitArr=(v,len)=>Array.from({length:len},(_,j)=>(v>>j)&1);
const patOf=(arr,len)=>{let v=0;for(let j=0;j<len;j++)v|=(arr[j]?1:0)<<j;return v;};

const TYPE_NAME={uadd:'İşaretsiz toplama',usub:'İşaretsiz çıkarma',sadd:'İşaretli toplama',ssub:'İşaretli çıkarma',
  reason:'Overflow muhakemesi',cmp:'Carry ve karşılaştırma',d2b:'Ondalık → 2\'ye tümleyen',b2d:'İkilik → ondalık',b2h:'İkilik → hex',h2b:'Hex → ikilik'};
const WEIGHTS={uadd:1,usub:1.2,sadd:1.2,ssub:1.2,reason:1,cmp:.8,d2b:.6,b2d:.5,b2h:.4,h2b:.3};
const TYPES=Object.keys(WEIGHTS);
function pickType(last){
  const ts=TYPES.filter(t=>t!==last);
  let tot=0;ts.forEach(t=>tot+=WEIGHTS[t]);
  let r=Math.random()*tot;
  for(const t of ts){r-=WEIGHTS[t];if(r<=0)return t;}
  return ts[0];
}

/* column addition: c[j] is the carry INTO column j (c[0] = carry in, c[n] = carry out) */
function addBits(a,b,cin,n){
  const c=[cin];let r=0;
  for(let i=0;i<n;i++){
    const s=((a>>i)&1)+((b>>i)&1)+c[i];
    r|=(s&1)<<i;c[i+1]=s>>1;
  }
  return{r,c,cout:c[n]};
}
/* everything the course slides ask for, for one arithmetic question {type,n,a,b} (a,b are bit patterns) */
function arith(q){
  const n=q.n,M=maskOf(n);
  const sub=q.type==='usub'||q.type==='ssub',signed=q.type==='sadd'||q.type==='ssub';
  const nb=sub?((~q.b)&M):q.b;
  const s=addBits(q.a,nb,sub?1:0,n);
  const R=s.r,msb=(R>>(n-1))&1,sa=(q.a>>(n-1))&1,sb=(q.b>>(n-1))&1;
  const o={sub,signed,nb,R,c:s.c,cout:s.cout,msb,sa,sb};
  if(sub){o.borrow=1-s.cout;o.rel=s.cout?'ge':'lt';o.rel3=R===0?'eq':(s.cout?'gt':'lt');}
  if(signed){
    /* slide rule: add: pos+pos->neg, neg+neg->pos; sub: pos-neg->neg, neg-pos->pos */
    o.ovf=sub?((sa!==sb&&msb!==sa)?1:0):((sa===sb&&msb!==sa)?1:0);
    o.sign=msb?'neg':'pos';
    o.val=o.ovf?null:sv(R,n);
  }
  return o;
}

/* ---------- generators ---------- */
function sampleBy(n,pred){
  const M=maskOf(n);
  for(let t=0;t<6000;t++){const a=rnd(0,M),b=rnd(0,M);if(pred(a,b))return[a,b];}
  return null;
}
function genArith(n,type){
  const M=maskOf(n),lo=loOf(n),hi=hiOf(n),r=Math.random();
  const P=(x,y)=>[x&M,y&M];
  let ab=null;
  const arithOf=(a,b)=>arith({type,n,a,b});
  if(type==='uadd'){
    if(r<.14){const a=rnd(1,M);ab=pick([P(0,0),P(M,1),P(1,M),P(M,M),P(M,0),P(0,M),P(1<<(n-1),1<<(n-1)),P(a,(1<<n)-a),P((1<<n)-a,a)]);}
    else if(r<.55)ab=sampleBy(n,(a,b)=>a+b>M);
    else ab=sampleBy(n,(a,b)=>a+b<=M&&(a|b)!==0);
  }else if(type==='usub'){
    const x=rnd(1,M-1);
    if(r<.14)ab=pick([P(0,1),P(0,M),P(M,M),P(M,0),P(x,x),P(1,0),P(0,0),P(x,x+1)]);
    else if(r<.52)ab=sampleBy(n,(a,b)=>a<b);
    else if(r<.6){const y=rnd(0,M);ab=[y,y];}
    else ab=sampleBy(n,(a,b)=>a>b);
  }else if(type==='sadd'){
    const x=rnd(1,hi);
    if(r<.16)ab=pick([P(hi,1),P(1,hi),P(lo,-1),P(-1,lo),P(lo,lo),P(hi,hi),P(lo,hi),P(0,0),P(lo,0),P(x,-x),P(-1,1),P(hi,lo),P(-x,x)]);
    else if(r<.56)ab=sampleBy(n,(a,b)=>arithOf(a,b).ovf===1);
    else ab=sampleBy(n,(a,b)=>arithOf(a,b).ovf===0);
  }else{ /* ssub */
    const x=rnd(1,hi);
    if(r<.16)ab=pick([P(0,lo),P(lo,1),P(lo,lo),P(hi,-1),P(-1,hi),P(0,0),P(lo,hi),P(hi,lo),P(x,x),P(0,hi),P(-1,-1),P(lo,-1)]);
    else if(r<.56)ab=sampleBy(n,(a,b)=>arithOf(a,b).ovf===1);
    else ab=sampleBy(n,(a,b)=>arithOf(a,b).ovf===0);
  }
  if(!ab)ab=[1,1];
  return{type,n,a:ab[0],b:ab[1]};
}

/* all A (bit patterns) for which "A op B overflows and the n-bit result has MSB = msb" */
function reasonSet(n,op,b,msb){
  const out=[];
  for(let a=0;a<=maskOf(n);a++){
    const r=arith({type:op==='sub'?'ssub':'sadd',n,a,b});
    if(r.ovf&&r.msb===msb)out.push(a);
  }
  return out;
}
function genReason(n){
  const lo=loOf(n),hi=hiOf(n);
  for(let t=0;t<500;t++){
    const op=Math.random()<.5?'sub':'add';
    const bs=Math.random()<.18?pick([lo,hi,-1,1,lo+1]):rnd(lo,hi);
    const b=bs&maskOf(n);
    for(const msb of Math.random()<.5?[0,1]:[1,0]){
      const S=reasonSet(n,op,b,msb);
      if(!S.length)continue;
      const signs=new Set(S.map(a=>sv(a,n)<0?'neg':'pos'));
      if(signs.size!==1)continue;
      let minA=S[0];S.forEach(a=>{if(sv(a,n)<sv(minA,n))minA=a;});
      return{type:'reason',n,op,b,msb,signAns:[...signs][0],minA,cnt:S.length};
    }
  }
  const b=loOf(n)&maskOf(n),SS=reasonSet(n,'sub',b,1);
  return{type:'reason',n,op:'sub',b,msb:1,signAns:'pos',minA:SS.reduce((m,a)=>sv(a,n)<sv(m,n)?a:m,SS[0]),cnt:SS.length};
}

/* exam Q1b: unsigned A-B through 2's complement gave an (n+1)-bit result */
function cmpRel(n,r){ /* brute force: which relations A?B can produce the (n+1)-bit value r */
  const M=maskOf(n),rels=new Set();
  for(let a=0;a<=M;a++)for(let b=0;b<=M;b++){
    if(a+((~b)&M)+1===r)rels.add(a>b?'gt':a<b?'lt':'eq');
  }
  return[...rels];
}
function genCmp(n){
  const M=maskOf(n),r=Math.random();
  let a,b;
  if(r<.45){a=rnd(1,M);b=rnd(0,a-1);}
  else if(r<.9){b=rnd(1,M);a=rnd(0,b-1);}
  else{a=rnd(0,M);b=a;}
  const v=a+((~b)&M)+1; /* 0 .. 2^(n+1)-1 */
  const rel=a>b?'gt':a<b?'lt':'eq';
  return{type:'cmp',n,r:v,rel,why:(v>>n)&1?'c1':'c0'};
}
function genConv(n,type){
  const M=maskOf(n),lo=loOf(n),hi=hiOf(n),r=Math.random();
  if(type==='d2b'){
    let v;
    if(r<.2)v=pick([lo,hi,-1,0,1,lo+1,hi-1]);
    else if(r<.68)v=rnd(lo,hi);
    else{
      const k=Math.random();
      if(k<.45)v=rnd(hi+1,M);              /* fits unsigned only */
      else if(k<.75)v=rnd(lo-Math.max(3,M>>2),lo-1);
      else v=rnd(M+1,M+Math.max(3,M>>2));
    }
    return{type,n,v};
  }
  const pat=Math.random()<.2?pick([1<<(n-1),M,0,hi,1,(1<<(n-1))+1]):rnd(0,M);
  if(type==='b2d')return{type,n,bits:pat,signed:Math.random()<.65};
  return{type,n,bits:pat};
}
function genQuestion(n,type,last){
  type=type||pickType(last);
  if(type==='uadd'||type==='usub'||type==='sadd'||type==='ssub')return genArith(n,type);
  if(type==='reason')return genReason(n);
  if(type==='cmp')return genCmp(n);
  return genConv(n,type);
}

/* ---------- parsing ---------- */
function parseDec(s){
  s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-');
  if(!/^[+-]?\d+$/.test(s))return null;
  return parseInt(s,10);
}
function parseHex(s){
  s=String(s).trim().replace(/\s+/g,'').replace(/^0x/i,'').replace(/h$/i,'');
  if(!/^[0-9a-f]+$/i.test(s))return null;
  return parseInt(s,16);
}
const hexOf=(v,n)=>v.toString(16).toUpperCase().padStart(Math.ceil(n/4),'0');

/* ---------- the correct answer in the same shape as the student's answer ---------- */
function blankAnswer(n){
  return{res:Array(n+1).fill(0),cin:Array(n+1).fill(0),nb:Array(n).fill(0),ovf:null,borrow:null,rel:null,sign:null,fit:null,dec:'',hex:'',why:null};
}
function answerOf(q){
  const n=q.n,M=maskOf(n),A=blankAnswer(n);
  switch(q.type){
    case'uadd':{const r=arith(q);A.res=bitArr(r.R,n).concat([r.cout]);A.cin=r.c.slice();break;}
    case'usub':{const r=arith(q);A.res=bitArr(r.R,n).concat([r.cout]);A.cin=r.c.slice();A.nb=bitArr(r.nb,n);A.borrow=r.borrow;A.rel=r.rel;break;}
    case'sadd':case'ssub':{
      const r=arith(q);A.res=bitArr(r.R,n).concat([0]);A.cin=r.c.slice();
      if(r.sub)A.nb=bitArr(r.nb,n);
      A.ovf=r.ovf;A.sign=r.sign;A.dec=r.ovf?'':String(r.val);break;}
    case'reason':A.res=bitArr(q.minA,n).concat([0]);A.sign=q.signAns;break;
    case'cmp':A.rel=q.rel;A.why=q.why;break;
    case'd2b':{const fits=q.v>=loOf(n)&&q.v<=hiOf(n);A.fit=fits?1:0;if(fits)A.res=bitArr(q.v&M,n).concat([0]);break;}
    case'b2d':A.dec=String(q.signed?sv(q.bits,n):q.bits);break;
    case'b2h':A.hex=hexOf(q.bits,n);break;
    case'h2b':A.res=bitArr(q.bits,n).concat([0]);break;
  }
  return A;
}
function reasonOK(q,A){
  const r=arith({type:q.op==='sub'?'ssub':'sadd',n:q.n,a:A,b:q.b});
  return{ok:!!(r.ovf&&r.msb===q.msb),r};
}

/* ---------- checker: returns {ok, incomplete, msgs:[{ok,t}], bad:[columns]} ---------- */
function check(q,a){
  const n=q.n,E=answerOf(q);
  const msgs=[],bad=[];let ok=true,incomplete=false;
  const add=(good,t)=>{msgs.push({ok:good,t});if(!good)ok=false;};
  const need=(v,name)=>{if(v===null||v===undefined||v===''){incomplete=true;add(false,name+' için bir seçim yap.');return false;}return true;};
  const bitsPart=(label)=>{
    const b=[];for(let j=0;j<n;j++)if((a.res[j]?1:0)!==E.res[j])b.push(j);
    b.forEach(j=>bad.push(j));
    if(b.length)add(false,label+': '+b.length+' bit yanlış.');else add(true,label+' doğru.');
  };
  switch(q.type){
    case'uadd':
      bitsPart('Sonuç bitleri');
      add((a.res[n]?1:0)===E.res[n],(a.res[n]?1:0)===E.res[n]?'Carry out doğru.':'Carry out yanlış. Son sütundan çıkan eldeye bak.');
      break;
    case'usub':{
      bitsPart('Sonuç bitleri');
      const cok=(a.res[n]?1:0)===E.res[n];
      add(cok,cok?'Carry out doğru.':'Carry out yanlış. A + (−B) toplamının son sütunundan çıkan eldeye bak.');
      if(need(a.borrow,'Borrow')){
        const bok=a.borrow===E.borrow;
        add(bok,bok?'Borrow doğru.':'Borrow yanlış. Slayt: Carry = 1 ise borrow yok, Carry = 0 ise borrow var.');
      }
      if(need(a.rel,'Karşılaştırma')){
        const rok=a.rel===E.rel;
        add(rok,rok?'Karşılaştırma doğru.':'Karşılaştırma yanlış. Borrow varsa A, B\'den küçüktür.');
      }
      break;}
    case'sadd':case'ssub':{
      bitsPart('Sonuç bitleri');
      if(need(a.ovf,'Overflow')){
        const o=a.ovf===E.ovf;
        add(o,o?'Overflow kararı doğru.':(q.type==='sadd'
          ?'Overflow kararı yanlış. Operandların işaretine ve sonucun işaretine bak.'
          :'Overflow kararı yanlış. A\'nın ve B\'nin işaretine, sonra sonucun işaretine bak.'));
      }
      if(q.type==='sadd'){
        if(need(a.sign,'Sonucun işareti')){
          const s=a.sign===E.sign;
          add(s,s?'Sonucun işareti doğru.':'Sonucun işareti yanlış. n bitlik sonucun en soldaki bitine bak.');
        }
        if(E.ovf===0){
          const d=parseDec(a.dec);
          if(a.dec===''||d===null){incomplete=true;add(false,'Overflow yoksa sonucun ondalık değerini yaz.');}
          else add(d===parseInt(E.dec,10),d===parseInt(E.dec,10)?'Ondalık değer doğru.':'Ondalık değer yanlış. Sonucun MSB\'si 1 ise değer negatiftir.');
        }
      }
      break;}
    case'reason':{
      if(need(a.sign,'A\'nın işareti')){
        const s=a.sign===q.signAns;
        add(s,s?'A\'nın işareti doğru.':'A\'nın işareti yanlış. Overflow\'un hangi iki durumda olduğunu ve B\'nin işaretini düşün.');
      }
      const A=patOf(a.res,n);
      if(A===q.minA)add(true,'En küçük A doğru.');
      else{
        const t=reasonOK(q,A);
        if(t.ok)add(false,'Bu A koşulu sağlıyor ama en küçüğü değil.');
        else if(!t.r.ovf)add(false,'Bu A ile overflow olmuyor.');
        else add(false,'Bu A ile overflow oluyor ama sonucun MSB\'si '+t.r.msb+' çıkıyor.');
      }
      break;}
    case'cmp':{
      if(need(a.rel,'A ile B\'nin ilişkisi')){
        const r=a.rel===q.rel;
        add(r,r?'İlişki doğru.':'İlişki yanlış. Dokuzuncu (en soldaki) bit carry out\'tur; borrow = NOT carry.');
      }
      if(need(a.why,'Neden')){
        const w=a.why===q.why;
        add(w,w?'Neden doğru.':'Neden yanlış. Slayt: Carry = 1 → borrow yok, Carry = 0 → borrow var. İşaretsiz sayılarda sonucun MSB\'si işaret değildir.');
      }
      break;}
    case'd2b':{
      if(need(a.fit,'Sığma durumu')){
        const f=a.fit===E.fit;
        add(f,f?(E.fit?'Sığma kararı doğru.':'Doğru: bu sayı '+n+' bit 2\'ye tümleyen aralığına sığmaz.'):'Sığma kararı yanlış. Aralık: −2^(n−1) ile 2^(n−1)−1.');
        if(f&&E.fit)bitsPart('Bitler');
      }
      break;}
    case'b2d':{
      const d=parseDec(a.dec);
      if(a.dec===''||d===null){incomplete=true;add(false,'Ondalık değeri yaz.');break;}
      const want=parseInt(E.dec,10);
      if(d===want)add(true,'Doğru.');
      else{
        const other=q.signed?q.bits:sv(q.bits,n);
        add(false,d===other?'Bu değer diğer okumaya ait ('+(q.signed?'işaretsiz':'işaretli')+'). Soru '+(q.signed?'işaretli':'işaretsiz')+' okumayı istiyor.':'Ondalık değer yanlış.');
      }
      break;}
    case'b2h':{
      const h=parseHex(a.hex);
      if(a.hex===''||h===null){incomplete=true;add(false,'Hex değeri yaz (0-9, A-F).');break;}
      add(h===q.bits,h===q.bits?'Doğru.':'Hex değer yanlış. Bitleri sağdan başlayarak dörderli gruplara ayır.');
      break;}
    case'h2b':
      bitsPart('Bitler');
      break;
  }
  return{ok:ok&&!incomplete,incomplete,msgs,bad};
}

/* ---------- hints: each next one gives the next calculation step ---------- */
function hints(q){
  const n=q.n,lo=loOf(n),hi=hiOf(n),H=[];
  switch(q.type){
    case'uadd':{const r=arith(q);
      H.push({t:'Sağdan sola, sütun sütun topla. Her sütunda üç bit toplanır: A biti, B biti ve gelen elde. Toplam 2 veya 3 ise o sütunun sonucu toplam mod 2, elde ise 1 olur.'});
      H.push({t:'Elde satırı dolduruldu. Her sütunun sonucu, o sütundaki üç bitin toplamının son bitidir.',fill:'cin'});
      H.push({t:'Soldaki ek bit (C), en soldaki sütundan çıkan eldedir. C = 1 ise sonuç '+n+' bite sığmamıştır.'});
      break;}
    case'usub':
      H.push({t:'A − B işlemini A + (−B) olarak yap. B\'nin 2\'ye tümleyeni = tersi + 1. Önce B\'nin tüm bitlerini tersle (~B satırı).',fill:'nb'});
      H.push({t:'~B satırı dolduruldu. "+1" en sağ sütuna giren elde olarak yazılır: elde satırının en sağ hücresi 1. Şimdi A + ~B + 1 toplamını sütun sütun yap.',fill:'cin'});
      H.push({t:'Slayt: Carry = 1 → borrow yok. Carry = 0 → borrow var. Sonuç sıfırsa A = B, sıfır değilken borrow yoksa A > B, borrow varsa A < B.'});
      break;
    case'sadd':
      H.push({t:'Sağdan sola topla; işaretli ve işaretsiz toplama aynı devredir. Sadece sonucu farklı yorumlarsın.'});
      H.push({t:'Elde satırı dolduruldu.',fill:'cin'});
      H.push({t:'Overflow, ancak iki operandın işareti aynıyken olur: pozitif + pozitif → negatif ya da negatif + negatif → pozitif. Sonucun işareti n bitlik sonucun MSB\'sidir.'});
      H.push({t:'Overflow yoksa sonucu oku: MSB 0 ise doğrudan ikiliden ondalığa çevir. MSB 1 ise 2\'ye tümleyenini al, ondalığa çevir ve eksi işareti koy.'});
      break;
    case'ssub':
      H.push({t:'A − B işlemini A + (−B) olarak yap. B\'nin 2\'ye tümleyeni = tersi + 1. Önce B\'nin tüm bitlerini tersle (~B satırı).',fill:'nb'});
      H.push({t:'~B satırı dolduruldu; "+1" en sağ sütuna giren elde olarak yazılır. Şimdi A + ~B + 1 toplamını yap; elde satırı dolduruldu.',fill:'cin'});
      H.push({t:'Çıkarmada overflow durumları: pozitif − negatif → negatif ya da negatif − pozitif → pozitif. A\'nın ve B\'nin işaretine, sonra sonucun MSB\'sine bak.'});
      break;
    case'reason':{
      const bs=sv(q.b,n);
      H.push({t:'Overflow\'un iki durumu: '+(q.op==='sub'?'pozitif − negatif → negatif ve negatif − pozitif → pozitif.':'pozitif + pozitif → negatif ve negatif + negatif → pozitif.')+' B\'nin işareti ne?'});
      H.push({t:'B '+(bs<0?'negatif':'pozitif')+' ve sonucun MSB\'si '+q.msb+'. Bu ikisi birlikte yalnızca tek bir durumla uyuşur. A\'nın işareti buradan çıkar.'});
      const k=q.op==='sub'?bs:-bs;
      H.push({t:'Gerçek sonuç '+(q.msb?'üst':'alt')+' sınırı aşmalı. Aralık '+ng(lo)+' ... +'+hi+'. Eşitsizliği yaz: A '+(q.op==='sub'?MINUS:'+')+' ('+ng(bs)+') '+(q.msb?'> +'+hi:'< '+ng(lo))+'. Buradan A için sınırı bul.'});
      break;}
    case'cmp':
      H.push({t:'Dokuz bitlik sonucun en soldaki biti carry out\'tur. Slayt: Carry = 1 → borrow yok. Carry = 0 → borrow var.'});
      H.push({t:'İşaretsiz sayılarda sonucun MSB\'si işaret değildir; sadece değer bitidir. Karar carry out\'a göre verilir. Borrow varsa A < B.'});
      break;
    case'd2b':
      H.push({t:n+' bitlik 2\'ye tümleyen aralığı −'+(1<<(n-1))+' ile +'+hi+' arasındadır. Önce sayının bu aralığa sığıp sığmadığına bak.'});
      H.push({t:'Pozitif sayıyı doğrudan ikiliye çevir. Negatif sayı için mutlak değerin ikilisini yaz, tüm bitleri tersle, sonra 1 ekle.'});
      if(q.v>=lo&&q.v<=hi)H.push({t:'Mutlak değer '+Math.abs(q.v)+' = '+gb(Math.abs(q.v),n)+(q.v<0?'. Şimdi tersle ve 1 ekle.':'.')});
      break;
    case'b2d':
      H.push({t:q.signed?'İşaretli okuma: MSB\'nin ağırlığı −'+(1<<(n-1))+'\'dir, diğer bitler normal ağırlıklıdır. MSB 0 ise sayı pozitiftir.':'İşaretsiz okuma: tüm bitler pozitif ağırlıklıdır (2^0 ... 2^'+(n-1)+').'});
      if(q.signed&&((q.bits>>(n-1))&1))H.push({t:'MSB 1, sayı negatif. 2\'ye tümleyenini al: '+gb(q.bits,n)+' → tersle → '+gb(~q.bits,n)+' → +1 → '+gb((~q.bits)+1,n)+'. Bu mutlak değerdir, başına eksi koy.'});
      break;
    case'b2h':
      H.push({t:'Bitleri sağdan başlayarak dörderli gruplara ayır.'});
      H.push({t:'Her grup bir hex basamağıdır (8-4-2-1 ağırlıkları). 10 = A, 11 = B, 12 = C, 13 = D, 14 = E, 15 = F.'});
      break;
    case'h2b':
      H.push({t:'Her hex basamağı tam 4 bittir.'});
      H.push({t:'İlk basamak '+hexOf(q.bits,n)[0]+' = '+parseInt(hexOf(q.bits,n)[0],16)+' → '+gb(parseInt(hexOf(q.bits,n)[0],16),4)+'. Kalan basamakları aynı yolla çevir.'});
      break;
  }
  return H;
}

/* ---------- worked solutions: plain lines, `code` marks monospace ---------- */
function solution(q){
  const n=q.n,M=maskOf(n),lo=loOf(n),hi=hiOf(n),L=[];
  const B=(v,w)=>'`'+gb(v,w||n)+'`';
  const colsRow=(arr)=>arr.slice().reverse().join('');
  switch(q.type){
    case'uadd':{const r=arith(q);
      L.push('A = '+B(q.a)+' ('+q.a+'), B = '+B(q.b)+' ('+q.b+').');
      L.push('Sağdan sola topla. Elde satırı (sütuna giren elde): `'+colsRow(r.c)+'` (en soldaki, son sütundan çıkan eldedir).');
      L.push('Sonuç: carry out = `'+r.cout+'`, bitler = '+B(r.R)+' ('+r.R+').');
      L.push(r.cout?'Carry out = 1: gerçek toplam '+q.a+' + '+q.b+' = '+(q.a+q.b)+' ve '+n+' bite sığmaz ('+(M)+' üstü). 9 bitlik değer: `1 '+gb(r.R,n)+'` = '+(q.a+q.b)+'.':'Carry out = 0: toplam '+(q.a+q.b)+' ≤ '+M+', '+n+' bite sığar.');
      break;}
    case'usub':{const r=arith(q);
      L.push('A = '+B(q.a)+' ('+q.a+'), B = '+B(q.b)+' ('+q.b+').');
      L.push('B\'nin 2\'ye tümleyeni = tersi + 1. Tersi: ~B = '+B(r.nb)+'. Toplamada "+1" en sağ sütuna giren elde olur: A + ~B + 1.');
      L.push('Elde satırı `'+colsRow(r.c)+'`. Sonuç: carry out = `'+r.cout+'`, bitler = '+B(r.R)+' ('+r.R+').');
      L.push('Borrow = NOT carry out = `'+r.borrow+'`'+(r.borrow?' (Carry = 0 → borrow var).':' (Carry = 1 → borrow yok).'));
      L.push(r.rel3==='eq'?'Sonuç 0 ve carry = 1: A = B, yani A ≥ B.':r.rel3==='gt'?'Borrow yok ve sonuç ≠ 0: A > B, yani A ≥ B ('+q.a+' − '+q.b+' = '+r.R+').':'Borrow var: A < B ('+q.a+' < '+q.b+'). Sonuç bitleri '+r.R+' = '+q.a+' − '+q.b+' + '+(1<<n)+'.');
      break;}
    case'sadd':case'ssub':{const r=arith(q),as=sv(q.a,n),bs=sv(q.b,n),sub=r.sub;
      L.push('A = '+B(q.a)+' ('+sg(as)+'), B = '+B(q.b)+' ('+sg(bs)+').');
      if(sub)L.push('B\'nin 2\'ye tümleyeni = tersi + 1. Tersi: ~B = '+B(r.nb)+'; +1 ile −B = '+B(r.nb+1)+(bs===lo?' ('+n+' bitte −B yine '+ng(lo)+', çünkü +'+(hi+1)+' sığmaz)':' ('+sg(-bs)+')')+'. Toplamada "+1" en sağ sütuna giren elde olur.');
      L.push((sub?'A + ~B + 1':'A + B')+': elde satırı `'+colsRow(r.c)+'`. Sonuç = '+B(r.R)+'. Soldaki ek bit (carry) işaretli sayılarda yok sayılır.');
      L.push('Sonucun MSB\'si = '+r.msb+' → sonuç '+(r.msb?'negatif':'pozitif')+'.');
      const sA=as<0?'negatif':'pozitif',sB=bs<0?'negatif':'pozitif';
      L.push('İşaretler: A '+sA+', B '+sB+', sonuç '+(r.msb?'negatif':'pozitif')+'. '+(sub?sA+' − '+sB+' = '+(r.msb?'negatif':'pozitif'):sA+' + '+sB+' = '+(r.msb?'negatif':'pozitif'))+' → '+(r.ovf?'overflow VAR.':'overflow yok.'));
      L.push('Çapraz kontrol: MSB\'ye giren elde = '+r.c[n-1]+', MSB\'den çıkan elde = '+r.c[n]+(r.c[n-1]!==r.c[n]?', farklı → overflow.':', aynı → overflow yok.'));
      const tv=sub?as-bs:as+bs;
      L.push('Gerçek değer: '+sg(as)+(sub?' − ('+ng(bs)+')':' + ('+ng(bs)+')')+' = '+ng(tv)+(r.ovf?', aralık '+ng(lo)+' ... +'+hi+' dışında.':', aralık içinde.'));
      if(!r.ovf)L.push('Ondalık değer: '+B(r.R)+' = '+sg(r.val)+'.');
      break;}
    case'reason':{
      const bs=sv(q.b,n),k=q.op==='sub'?hi+bs:hi-bs,k2=q.op==='sub'?lo+bs:lo-bs;
      L.push('B = '+B(q.b)+' → MSB '+((q.b>>(n-1))&1)+', B '+(bs<0?'negatif':'pozitif')+' ('+ng(bs)+').');
      L.push('Overflow\'un iki durumu: '+(q.op==='sub'?'pozitif − negatif → negatif, negatif − pozitif → pozitif.':'pozitif + pozitif → negatif, negatif + negatif → pozitif.'));
      L.push('Sonucun MSB\'si '+q.msb+' (sonuç '+(q.msb?'negatif':'pozitif')+') ve B '+(bs<0?'negatif':'pozitif')+' olduğundan geçerli durum tek: A '+(q.signAns==='pos'?'pozitif (0 dahil)':'negatif')+'. Cevap (i): '+(q.signAns==='pos'?'pozitif':'negatif')+'.');
      if(q.msb){L.push('Üst sınır aşılıyor: A '+(q.op==='sub'?MINUS+' ('+ng(bs)+')':'+ ('+ng(bs)+')')+' > +'+hi+' → A > '+ng(k)+'.');}
      else{L.push('Alt sınır aşılıyor: A '+(q.op==='sub'?MINUS+' ('+ng(bs)+')':'+ ('+ng(bs)+')')+' < '+ng(lo)+' → A < '+ng(k2)+', ve A en az '+ng(lo)+' olabilir.');}
      const r=arith({type:q.op==='sub'?'ssub':'sadd',n,a:q.minA,b:q.b});
      L.push('En küçük A = '+ng(sv(q.minA,n))+' = '+B(q.minA)+'. Kontrol: '+q.op.replace('sub','çıkarma').replace('add','toplama')+' sonucu '+B(r.R)+', MSB = '+r.msb+', overflow '+(r.ovf?'var':'yok')+'.');
      L.push('Koşulu sağlayan toplam '+q.cnt+' A değeri vardır; en küçüğü yukarıdaki.');
      break;}
    case'cmp':{
      const c=(q.r>>n)&1,R=q.r&M;
      L.push('Dokuz bitlik sonuç: `'+c+' '+gb(R,n)+'`. En soldaki bit carry out = '+c+'.');
      L.push('Slayt: Carry = 1 → borrow yok; Carry = 0 → borrow var. Burada borrow '+(c?'yok':'var')+'.');
      L.push(q.rel==='eq'?'Sonuç bitleri 0 ve carry = 1: A = B.':q.rel==='gt'?'Borrow yok ve sonuç ≠ 0: A > B. Sonuç '+R+' = A − B.':'Borrow var: A < B. Sonuç bitleri '+R+' = A − B + '+(1<<n)+' (negatif farkın '+n+' bitlik karşılığı), A − B = '+(R-(1<<n))+'.');
      L.push('Dikkat: işaretsiz sayılarda sonucun MSB\'si işaret göstermez. Karar carry out ile verilir.');
      break;}
    case'd2b':{
      const fits=q.v>=lo&&q.v<=hi;
      L.push(n+' bitlik 2\'ye tümleyen aralığı: '+ng(lo)+' ... +'+hi+'.');
      if(!fits){L.push(ng(q.v)+' bu aralığın '+(q.v>hi?'üstünde':'altında')+', bu bit genişliğine sığmaz.'+(q.v>hi&&q.v<=M?' (İşaretsiz olsaydı sığardı: 0 ... '+M+'.)':''));break;}
      if(q.v>=0)L.push(q.v+' pozitif: doğrudan ikili = '+B(q.v)+'.');
      else{
        const a=-q.v;
        L.push('Mutlak değer '+a+' = '+B(a)+'.');
        L.push('Tersle: '+B(~a)+', +1 → '+B(q.v&M)+'.');
        L.push('Kontrol: MSB 1 ve −'+(1<<(n-1))+' + kalan bitler = '+q.v+'.');
      }
      break;}
    case'b2d':{
      const u=q.bits,s=sv(q.bits,n);
      if(!q.signed)L.push('İşaretsiz okuma: '+B(u)+' = '+u+'.');
      else if(s>=0)L.push('MSB 0: pozitif, değer = '+s+'.');
      else{
        L.push('MSB 1: negatif. Mutlak değer için 2\'ye tümleyen: tersle '+B(~u)+', +1 → '+B((~u)+1)+' = '+(-s)+'.');
        L.push('Sonuç = '+ng(s)+'. Ağırlık yöntemiyle: −'+(1<<(n-1))+' + '+(u&hi)+' = '+ng(s)+'.');
      }
      L.push('Diğer okuma: '+(q.signed?'işaretsiz '+u:'işaretli '+sg(s))+'.');
      break;}
    case'b2h':{
      const gs=gb(q.bits,n).split(' ');
      L.push('Dörderli gruplar: '+gs.map(g=>'`'+g+'`').join(' ')+'.');
      L.push('Her grup bir hex basamağı: '+gs.map(g=>g+' = '+parseInt(g,2).toString(16).toUpperCase()).join(', ')+'.');
      L.push('Sonuç: `'+hexOf(q.bits,n)+'`.');
      break;}
    case'h2b':{
      const h=hexOf(q.bits,n).split('');
      L.push('Her hex basamağı 4 bit: '+h.map(d=>d+' = '+gb(parseInt(d,16),4)).join(', ')+'.');
      L.push('Sonuç: '+B(q.bits)+'.');
      break;}
  }
  return L;
}

if(typeof module!=='undefined')module.exports={maskOf,sv,toS,gb,bitArr,patOf,addBits,arith,genQuestion,genArith,genReason,genCmp,genConv,reasonSet,reasonOK,cmpRel,answerOf,blankAnswer,check,hints,solution,parseDec,parseHex,hexOf,pickType,TYPES,TYPE_NAME,loOf,hiOf};
if(typeof Core==='undefined'||typeof Pages==='undefined'||typeof document==='undefined')return;

/* ================= UI part ================= */
const {esc,render,fbHTML,fb}=Core;
const T=Core.timer();
let root=null;
const S={n:8,q:null,a:null,phase:'ask',fb:null,hint:0,attempts:0,low:null,qno:0,last:null,hintShown:[]};

function newQuestion(){
  S.q=genQuestion(S.n,null,S.last);
  S.last=S.q.type;
  S.a=blankAnswer(S.n);
  if(S.q.type==='sadd'||S.q.type==='ssub'||S.q.type==='uadd'||S.q.type==='usub'){
    /* carry-in cell of a subtraction starts empty: the student writes the +1 */
  }
  S.phase='ask';S.fb=null;S.hint=0;S.attempts=0;S.low=null;S.qno++;S.hintShown=[];
  T.start();
}

/* ---------- layout of the column-addition table ---------- */
function layoutOf(q){
  const n=q.n,t=q.type;
  switch(t){
    case'uadd':return{withC:true,cHead:'C',rows:[{id:'cin',k:'sc',lab:'elde'},{id:'a',k:'st',lab:'A'},{id:'b',k:'st',lab:'+ B'},'rule',{id:'res',k:'an',lab:'=',co:true}]};
    case'usub':return{withC:true,cHead:'C',rows:[{id:'cin',k:'sc',lab:'elde'},{id:'a',k:'st',lab:'A'},{id:'b',k:'st',lab:'B'},{id:'nb',k:'sc',lab:'~B'},'rule',{id:'res',k:'an',lab:'=',co:true}]};
    case'sadd':return{withC:true,cHead:'C',cDim:true,sgn:true,rows:[{id:'cin',k:'sc',lab:'elde'},{id:'a',k:'st',lab:'A'},{id:'b',k:'st',lab:'+ B'},'rule',{id:'res',k:'an',lab:'=',na:true}]};
    case'ssub':return{withC:true,cHead:'C',cDim:true,sgn:true,rows:[{id:'cin',k:'sc',lab:'elde'},{id:'a',k:'st',lab:'A'},{id:'b',k:'st',lab:'B'},{id:'nb',k:'sc',lab:'~B'},'rule',{id:'res',k:'an',lab:'=',na:true}]};
    case'reason':return{withC:false,sgn:true,rows:[{id:'b',k:'st',lab:'B'},'rule',{id:'res',k:'an',lab:'A'}]};
    case'cmp':return{withC:true,cHead:'C',rows:[{id:'r',k:'st',lab:'',withC:true}]};
    case'd2b':return{withC:false,sgn:true,rows:[{id:'res',k:'an',lab:''}]};
    case'b2d':return{withC:false,sgn:!!q.signed,rows:[{id:'bits',k:'st',lab:''}]};
    case'b2h':return{withC:false,rows:[{id:'bits',k:'st',lab:''}]};
    case'h2b':return{withC:false,rows:[{id:'res',k:'an',lab:''}]};
  }
}
function staticBit(q,id,j){
  if(id==='a')return(q.a>>j)&1;
  if(id==='b')return(q.b>>j)&1;
  if(id==='r')return(q.r>>j)&1;
  if(id==='bits')return(q.bits>>j)&1;
  return 0;
}
const ROWNAME={res:'Sonuç',cin:'Elde (karalama)',nb:'~B (karalama)'};
function cellHTML(q,L,row,j,isC){
  const n=q.n,done=S.phase!=='ask';
  const sgn=L.sgn&&!isC&&j===n-1?' sgn':'';
  if(row.k==='st'){
    if(isC&&!row.withC)return'<div class="num-b gap" aria-hidden="true"></div>';
    return`<div class="num-b st${sgn}${isC?' co':''}">${staticBit(q,row.id,j)}</div>`;
  }
  if(isC&&row.id==='nb')return'<div class="num-b gap" aria-hidden="true"></div>';
  if(isC&&row.na)return'<div class="num-b na" title="İşaretli sayılarda carry yok sayılır" aria-hidden="true"></div>';
  const v=S.a[row.id][j]?1:0;
  const isCo=isC&&row.k==='an';
  const name=isCo?'Carry out':(row.id==='cin'?(isC?'Elde (karalama), sütun C':'Elde (karalama)'):(q.type==='reason'?'A':(ROWNAME[row.id]||(q.type==='d2b'||q.type==='h2b'?'Cevap':'Bit'))));
  const cls='num-b '+(row.k==='sc'?'sc':'an')+sgn+(isCo?' co':'')+(S.low===j&&!isC&&row.id==='res'?' hintbit':'');
  if(done)return`<div class="${cls} fin" data-v="${v}">${v}</div>`;
  const lab=isCo?name+', değer '+v:name+', bit '+j+', değer '+v;
  return`<button type="button" class="${cls}" role="switch" aria-checked="${v?'true':'false'}" aria-label="${esc(lab)}" data-act="bit" data-row="${row.id}" data-i="${j}" data-fk="${row.id}-${j}">${v}</button>`;
}
function gridHTML(q){
  const n=q.n,L=layoutOf(q),withC=L.withC;
  const tracks=['var(--lw)'];
  if(withC){tracks.push('minmax(0,1fr)','var(--sep)');}
  for(let k=0;k<n/4;k++){
    for(let i=0;i<4;i++)tracks.push('minmax(0,1fr)');
    if(k<n/4-1)tracks.push('var(--sep)');
  }
  let h=`<div class="num-grid" role="group" aria-label="İkilik işlem tablosu" style="--cols:${tracks.join(' ')}">`;
  /* header */
  h+='<div></div>';
  if(withC)h+=`<div class="num-h${L.cDim?' dim':''} co">${L.cHead}</div><div></div>`;
  for(let j=n-1;j>=0;j--){
    h+=`<div class="num-h${L.sgn&&j===n-1?' sgn':''}">${j}</div>`;
    if(j%4===0&&j>0)h+='<div></div>';
  }
  for(const row of L.rows){
    if(row==='rule'){h+='<div class="num-rule"></div>';continue;}
    h+=`<div class="num-lab">${esc(row.lab)}</div>`;
    if(withC){h+=cellHTML(q,L,row,n,true);h+='<div></div>';}
    for(let j=n-1;j>=0;j--){
      h+=cellHTML(q,L,row,j,false);
      if(j%4===0&&j>0)h+='<div></div>';
    }
  }
  return h+'</div>';
}

/* ---------- readout and info table ---------- */
function readoutHTML(q){
  if(!['uadd','usub','sadd','ssub','reason'].includes(q.type))return'';
  const n=q.n,v=patOf(S.a.res,n);
  const c=(q.type==='uadd'||q.type==='usub')?`<span>C = </span><b>${S.a.res[n]?1:0}</b> &nbsp;`:'';
  const lab=q.type==='reason'?'A':'Sonuç';
  const dec=q.type==='reason'?`${sg(sv(v,n))}`:(q.type==='uadd'||q.type==='usub'?`${v}`:`${v} işaretsiz, ${sg(sv(v,n))} işaretli`);
  return`<div class="live num-live">${c}<span>${lab}:</span> <b>${gb(v,n)}</b> <span>=</span> ${dec}</div>`;
}
function infoHTML(q){
  if(!['uadd','usub','sadd','ssub','reason'].includes(q.type))return'';
  const n=q.n,signed=q.type!=='uadd'&&q.type!=='usub';
  const rows=q.type==='reason'?[['B',q.b]]:[['A',q.a],['B',q.b]];
  return`<div class="tblwrap"><table class="pic num-info"><thead><tr><th class="l"></th><th>İkilik</th><th class="${signed?'':'hl'}">İşaretsiz</th><th class="${signed?'hl':''}">İşaretli</th></tr></thead><tbody>${rows.map(r=>`<tr style="cursor:default"><th class="l">${r[0]}</th><td><code>${gb(r[1],n)}</code></td><td class="${signed?'':'hl'}">${r[1]}</td><td class="${signed?'hl':''}">${sg(sv(r[1],n))}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- flags ---------- */
function segF(key,label,opts,cur){
  return`<div class="ctl num-flag"><span class="lab">${label}</span><div class="seg" role="group" aria-label="${esc(label)}">${opts.map(o=>`<button type="button" data-act="flag" data-k="${key}" data-v="${o[0]}" data-fk="f-${key}-${o[0]}" aria-pressed="${String(cur)===String(o[0])}"${S.phase!=='ask'?' disabled':''}>${o[1]}</button>`).join('')}</div></div>`;
}
function optsF(key,label,opts,cur){
  return`<div class="ctl num-flag"><span class="lab" id="lab-${key}">${label}</span><div class="num-opts" role="radiogroup" aria-labelledby="lab-${key}">${opts.map(o=>`<button type="button" class="num-opt" role="radio" aria-checked="${String(cur)===String(o[0])}" data-act="flag" data-k="${key}" data-v="${o[0]}" data-fk="f-${key}-${o[0]}"${S.phase!=='ask'?' disabled':''}>${o[1]}</button>`).join('')}</div></div>`;
}
function inputF(key,label,ph,val,mono){
  return`<div class="ctl num-flag"><label for="in-${key}">${label}</label><input id="in-${key}" class="num-in" type="text" inputmode="${key==='hex'?'text':'numeric'}" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="${ph}" value="${esc(val)}" data-in="${key}" data-fk="in-${key}"${S.phase!=='ask'?' disabled':''}></div>`;
}
function flagsHTML(q){
  const a=S.a,yn=[[1,'Var'],[0,'Yok']];
  switch(q.type){
    case'usub':return segF('borrow','Borrow',yn,a.borrow)+segF('rel','Karşılaştırma',[['ge','A ≥ B'],['lt','A < B']],a.rel);
    case'sadd':return segF('ovf','Overflow',yn,a.ovf)+segF('sign','Sonucun işareti',[['pos','Pozitif'],['neg','Negatif']],a.sign)+inputF('dec','Ondalık değer (overflow yoksa)','örn. −42',a.dec);
    case'ssub':return segF('ovf','Overflow',yn,a.ovf);
    case'reason':return segF('sign','(i) A\'nın işareti',[['pos','Pozitif'],['neg','Negatif']],a.sign);
    case'cmp':return optsF('rel','A ile B',[['gt','A > B'],['eq','A = B'],['lt','A < B']],a.rel)+optsF('why','Neden?',[['c1','Carry = 1, yani borrow yok'],['c0','Carry = 0, yani borrow var'],['msb','Sonucun MSB\'si 1 olduğu için sonuç negatiftir']],a.why);
    case'd2b':return segF('fit','Bu bit genişliğine',[[1,'Sığar'],[0,'Sığmaz']],a.fit);
    case'b2d':return inputF('dec','Ondalık değer','örn. −99',a.dec);
    case'b2h':return inputF('hex','Hex değer','örn. 9D',a.hex);
  }
  return'';
}

/* ---------- texts ---------- */
function taskText(q){
  const n=q.n;
  switch(q.type){
    case'uadd':return n+' bitlik işaretsiz (unsigned) sayılar. A + B işlemini yap: sonuç bitlerini ve carry out\'u gir.';
    case'usub':return n+' bitlik işaretsiz sayılar. A − B işlemini 2\'ye tümleyen toplamıyla yap: sonuç bitlerini, carry out\'u, borrow\'u ve karşılaştırmayı gir.';
    case'sadd':return n+' bitlik işaretli (2\'ye tümleyen) sayılar. A + B işlemini yap: sonuç bitlerini, overflow durumunu ve sonucun işaretini gir. Overflow yoksa ondalık değeri de yaz.';
    case'ssub':return n+' bitlik işaretli (2\'ye tümleyen) sayılar. A − B işlemini 2\'ye tümleyen yöntemiyle yap: sonuç bitlerini ve overflow durumunu gir.';
    case'reason':return 'A ve B, '+n+' bitlik işaretli ikilik tamsayılardır. (i) A\'nın işareti nedir? (ii) Bu durumu veren en küçük A tamsayısını ikilik olarak yaz.';
    case'cmp':return 'A ve B, '+n+' bitlik işaretsiz ikilik tamsayılardır. A − B, 2\'ye tümleyen sistemiyle yapıldı ve ('+(n+1)+') bitlik sonuç aşağıdaki gibi çıktı. A > B mi, A < B mi? Nedenini seç.';
    case'd2b':return 'Aşağıdaki ondalık sayıyı '+n+' bitlik 2\'ye tümleyen olarak yaz. Sayı bu bit genişliğine sığmıyorsa "Sığmaz" seç.';
    case'b2d':return 'Aşağıdaki '+n+' bitlik sayıyı '+(q.signed?'işaretli (2\'ye tümleyen)':'işaretsiz')+' olarak oku ve ondalık değerini yaz.';
    case'b2h':return 'Aşağıdaki '+n+' bitlik sayıyı onaltılık (hex) olarak yaz.';
    case'h2b':return 'Aşağıdaki hex sayıyı '+n+' bitlik ikilik sayıya çevir.';
  }
}
function stmtText(q){
  const n=q.n;
  switch(q.type){
    case'uadd':return q.a+' + '+q.b;
    case'usub':return q.a+' − '+q.b;
    case'sadd':return ng(sv(q.a,n))+' + ('+ng(sv(q.b,n))+')';
    case'ssub':return ng(sv(q.a,n))+' − ('+ng(sv(q.b,n))+')';
    case'reason':return 'B = '+gb(q.b,n)+'\nA '+(q.op==='sub'?MINUS:'+')+' B: overflow VAR, '+n+' bitlik sonucun MSB\'si = '+q.msb;
    case'cmp':return (q.r>>n&1)+' '+gb(q.r&maskOf(n),n);
    case'd2b':return ng(q.v);
    case'b2d':return gb(q.bits,n);
    case'b2h':return gb(q.bits,n);
    case'h2b':return '0x'+hexOf(q.bits,n);
  }
}

/* ---------- main draw ---------- */
function applyFill(kind){
  const E=answerOf(S.q);
  if(kind==='cin')S.a.cin=E.cin.slice();
  if(kind==='nb')S.a.nb=E.nb.slice();
}
function draw(){
  const q=S.q,done=S.phase!=='ask';
  const wid=`<div class="controls num-controls"><div class="ctl"><span class="lab">Bit genişliği</span><div class="seg" role="group" aria-label="Bit genişliği">${[4,8].map(w=>`<button type="button" data-act="width" data-v="${w}" data-fk="w-${w}" aria-pressed="${S.n===w}">${w} bit</button>`).join('')}</div></div></div>`;
  const hs=hints(q);
  const hintBox=S.hintShown.length?`<div class="fb info"><strong>İpucu</strong>${S.hintShown.map((t,i)=>`<p>${i+1}. ${esc(t)}</p>`).join('')}</div>`:'';
  const hasScratch=layoutOf(q).rows.some(r=>r!=='rule'&&r.k==='sc');
  const sol=S.phase==='rev'?`<div class="num-sol"><strong>Çözüm</strong><ol>${solution(q).map(l=>`<li>${fmtLine(l)}</li>`).join('')}</ol></div>`:'';
  const body=`
    <div class="card num-card">
      <div class="qhead"><span class="qno">Soru ${S.qno} · ${TYPE_NAME[q.type]}</span>${T.html()}</div>
      <p class="task">${esc(taskText(q))}</p>
      <div class="fn num-fn">${esc(stmtText(q))}</div>
      <div class="work">
        <div class="mapcol">${gridHTML(q)}${readoutHTML(q)}${hasScratch?'<p class="legend">Kesikli çizgili satırlar karalamadır, kontrol edilmez.'+(q.type==='usub'||q.type==='ssub'?' ~B, B\'nin bitlerinin tersidir. Çıkarmada en sağ sütuna giren elde 1\'dir (2\'ye tümleyen = ters + 1).':'')+' Odaktayken 0 veya 1 yazarak ilerleyebilir, ok tuşlarıyla gezebilirsin.</p>':'<p class="legend">Bir hücreye tıklayınca 0 / 1 değişir. Odaktayken 0 veya 1 yazarak ilerleyebilir, ok tuşlarıyla gezebilirsin.</p>'}</div>
        <div class="side">${infoHTML(q)}${flagsHTML(q)}${hintBox}<div aria-live="polite">${fbHTML(S.fb)}</div>${sol}</div>
      </div>
      <div class="row">
        <button type="button" class="btn primary" data-act="check"${done?' disabled':''}>Kontrol et</button>
        <button type="button" class="btn" data-act="hint"${done||S.hint>=hs.length?' disabled':''}>İpucu${hs.length&&!done?` (${S.hint}/${hs.length})`:''}</button>
        <button type="button" class="btn ghost" data-act="reveal"${done?' disabled':''}>Çözümü göster</button>
        <button type="button" class="btn${done?' primary':' ghost'}" data-act="next" data-fk="next">${done?'Sonraki soru':'Yeni soru (atla)'}</button>
      </div>
    </div>`;
  render(root,wid+body);
}
function fmtLine(l){
  return esc(l).replace(/`([^`]+)`/g,'<code>$1</code>');
}

/* ---------- actions ---------- */
function doCheck(){
  if(S.phase!=='ask')return;
  const q=S.q,r=check(q,S.a);
  if(r.incomplete&&!r.msgs.some(m=>m.ok===false&&/yanlış/.test(m.t))){
    S.fb=fb('warn','Eksik cevap',r.msgs.filter(m=>!m.ok).map(m=>esc(m.t)).join('<br>'));
    draw();return;
  }
  if(r.ok){
    S.phase='done';S.low=null;T.stop();Core.credit(T.elapsed());
    S.fb=fb('ok','Doğru',r.msgs.map(m=>esc(m.t)).join('<br>')+'<br>Süre '+Core.fmtTime(T.elapsed())+'.');
  }else{
    S.attempts++;
    S.low=null;
    let extra='';
    if(S.attempts>=2&&r.bad.length){S.low=Math.min(...r.bad);extra='<br>En sağdaki hatalı bit: bit '+S.low+' (sağdan '+(S.low+1)+'. bit, işaretli hücre). Elde ondan sola yayılır.';}
    S.fb=fb('bad','Henüz değil',r.msgs.map(m=>(m.ok?'Doğru: ':'')+esc(m.t)).join('<br>')+extra);
  }
  draw();
}
function doHint(){
  if(S.phase!=='ask')return;
  const hs=hints(S.q);
  if(S.hint>=hs.length)return;
  const h=hs[S.hint];S.hint++;
  S.hintShown.push(h.t);
  if(h.fill)applyFill(h.fill);
  draw();
}
function doReveal(){
  if(S.phase!=='ask')return;
  const E=answerOf(S.q);
  S.a=E;S.phase='rev';S.low=null;
  T.stop();Core.breakStreak();
  S.fb=fb('info','Çözüm gösterildi','Bu soru için puan yok. Aşağıdaki adımları tabloyla karşılaştır.');
  draw();
}
function setBit(row,i,v){
  const arr=S.a[row];
  arr[i]=v===undefined?(arr[i]?0:1):v;
  S.low=null;
}
function setFlag(k,v){
  if(S.phase!=='ask')return;
  if(/^-?\d+$/.test(v))v=Number(v);
  S.a[k]=v;
  draw();
}
function mountEvents(){
  root.addEventListener('click',e=>{
    const t=e.target.closest('[data-act]');
    if(!t||!root.contains(t))return;
    const act=t.dataset.act;
    if(act==='bit'){if(S.phase==='ask'){setBit(t.dataset.row,+t.dataset.i);draw();}}
    else if(act==='flag')setFlag(t.dataset.k,t.dataset.v);
    else if(act==='check')doCheck();
    else if(act==='hint')doHint();
    else if(act==='reveal')doReveal();
    else if(act==='next'){newQuestion();draw();}
    else if(act==='width'){const w=+t.dataset.v;if(w!==S.n){S.n=w;S.last=null;newQuestion();}draw();}
  });
  root.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset&&t.dataset.in){S.a[t.dataset.in]=t.value;}
  });
  root.addEventListener('keydown',e=>{
    const t=e.target;
    if(t.dataset&&t.dataset.in){
      if(e.key==='Enter'){e.preventDefault();S.a[t.dataset.in]=t.value;doCheck();}
      return;
    }
    if(!t.matches||!t.matches('button.num-b[data-act="bit"]'))return;
    if(S.phase!=='ask')return;
    const row=t.dataset.row,i=+t.dataset.i,n=S.n;
    const maxI=(row==='res'||row==='cin')&&layoutOf(S.q).withC?n:n-1;
    const find=k=>root.querySelector(`button.num-b[data-row="${row}"][data-i="${k}"]`);
    const go=k=>{const el=find(k);if(el){el.focus();return true;}return false;};
    if(e.key==='0'||e.key==='1'){
      e.preventDefault();
      setBit(row,i,+e.key);
      go(i-1)||go(i);
      draw();
    }else if(e.key==='ArrowLeft'){e.preventDefault();go(i+1);}
    else if(e.key==='ArrowRight'){e.preventDefault();go(i-1);}
    else if(e.key==='Home'){e.preventDefault();go(maxI);}
    else if(e.key==='End'){e.preventDefault();go(0);}
  });
}

Pages.num={
  mount(el){root=el;mountEvents();newQuestion();draw();}
};
})();

</script>
<script>
/* ---- Chapter 5: toplayıcılar, çıkarıcı, çoğullayıcı (MUX) ---- */
(function(){
'use strict';
const rnd=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const bs=(v,n)=>(v&((1<<n)-1)).toString(2).padStart(n,'0');
const sp=s=>s.split('').join(' ');
const listNorm=s=>{const m=String(s).match(/\d+/g);return m?[...new Set(m.map(Number))].sort((a,b)=>a-b).join(','):'';};
const tokNorm=s=>(String(s).toLowerCase().replace(/[’‘`´]/g,"'").match(/c'|d'|c|d|0|1/g)||[]).join('|');
const YN=[['1','1'],['0','0']];
const NAME={fa:'Tam toplayıcı',padd:'4 bit paralel toplayıcı',sub:'Çıkarma devresi',addsub:'Toplayıcı / çıkarıcı',muxadd:'MUX ile ortak toplayıcı',

/* ---- adder core ---- */
function addN(a,b,cin,n){const c=[cin];let s=0;for(let i=0;i<n;i++){const t=((a>>i)&1)+((b>>i)&1)+c[i];s|=(t&1)<<i;c[i+1]=t>>1;}return{s,c,cout:c[n]};}
/* ---- mux core ---- */
const muxOut=(I,sel)=>I[sel];
/* F with truth vector tv over vars [A,B,C(,D)]: data inputs of a 2^(n-1):1 mux (selects = first n-1 vars) in {0,1,L,L'} */
function mux2Inputs(tv,n){
  const out=[];
  for(let i=0;i<tv.length/2;i++){
    const f0=tv[2*i],f1=tv[2*i+1];
    out.push(f0===f1?String(f0):(f0===0&&f1===1?'L':"L'"));
  }
  return out;
}
const LASTV=n=>n===3?'C':'D';
const mkTV=(n,ones)=>Array.from({length:1<<n},(_,i)=>ones.includes(i)?1:0);
function genFA(){

  return{type:'fa',task:half?'Yarı toplayıcı (half adder): girişler a ve b. Toplam s ve elde c çıkışlarını bul.':'Tam toplayıcı (full adder): girişler a, b ve cin. Toplam s ve elde cout çıkışlarını bul.',
    stmt:half?`a = ${a}, b = ${b}`:`a = ${a}, b = ${b}, cin = ${c}`,
    fields:[{k:'s',label:'s (toplam)',kind:'choice',opts:YN},{k:'c',label:half?'c (elde)':'cout',kind:'choice',opts:YN}],
    answer:{s:String(t&1),c:String(t>>1)},
    hints:['Aritmetik toplama yap: a + b'+(half?'':' + cin')+' sonucunu ikilik yaz.','Sonucun en sağ biti s, soldaki biti elde (carry) olur.',half?'s = a ⊕ b, c = a·b':'s = a ⊕ b ⊕ cin, cout = ab + a·cin + b·cin'],
    solution:[`${a} + ${b}${half?'':' + '+c} = ${t} = ${bs(t,2)}₂.`,`s = ${t&1}, ${half?'c':'cout'} = ${t>>1}.`]};
}
function genPadd(){
  const n=4,a=rnd(0,15),b=rnd(0,15),cin=Math.random()<.3?1:0,r=addN(a,b,cin,n);
  const cs=[1,2,3,4].map(i=>r.c[i]).join('');
  return{type:'padd',task:'4 bitlik paralel toplayıcıda (4 adet tam toplayıcı) elde zincirini ve sonucu bul. c1, c2, c3 sırasıyla FA0, FA1, FA2\'nin elde çıkışıdır, c4 = cout.',
    stmt:`A = ${bs(a,4)} (A3A2A1A0)\nB = ${bs(b,4)} (B3B2B1B0)\ncin (c0) = ${cin}`,
    fields:[{k:'c',label:'c1 c2 c3 c4',ph:'4 bit, örn. 0110'},{k:'s',label:'S3 S2 S1 S0',ph:'4 bit'}],
    answer:{c:cs,s:bs(r.s,4)},
    hints:['Sağdan başla: FA0, a0 + b0 + cin toplar. Elde bir soldaki FA\'nın cin\'i olur.','Her sütunda üç biti topla (a, b, gelen elde). Sonuç 0-1 ise elde 0, 2-3 ise elde 1.','c4 son FA\'nın elde çıkışıdır (cout).'],
    solution:[`Sütun sütun: c0 = ${cin}; c1..c4 = ${sp(cs)}.`,`Toplam bitleri S3..S0 = ${bs(r.s,4)}, cout = c4 = ${r.cout}.`,`Kontrol: ${a} + ${b} + ${cin} = ${a+b+cin}.`]};

function genSub(){

    stmt:`A = ${bs(a,4)}\nB = ${bs(b,4)}\ncin = 1`,
    fields:[{k:'nb',label:'B\' (terslenmiş B)',ph:'4 bit'},{k:'s',label:'S3..S0',ph:'4 bit'},{k:'c',label:'cout',kind:'choice',opts:YN},{k:'bw',label:'Borrow (ödünç)',kind:'choice',opts:[['1','Var'],['0','Yok']]}],
    answer:{nb:bs(nb,4),s:bs(r.s,4),c:String(r.cout),bw:String(1-r.cout)},
    hints:['B\' = B\'nin her bitinin tersi. 2\'ye tümleyen için +1 devrenin cin girişinden gelir.','S = A + B\' + 1 işlemini toplayıcıyla yap.','Slayt kuralı: cout = 0 ise borrow var (A < B), cout = 1 ise borrow yok (A ≥ B).'],
    solution:[`B\' = ${bs(nb,4)}.`,`A + B\' + 1 = ${bs(a,4)} + ${bs(nb,4)} + 1 = ${bs(r.s,4)}, cout = ${r.cout}.`,r.cout?'cout = 1 olduğundan borrow yok, A ≥ B.':'cout = 0 olduğundan borrow var, A < B.']};
}
function genAddSub(){

    stmt:`X = ${x}\nA = ${bs(a,4)}\nB = ${bs(b,4)}`,
    fields:[{k:'bx',label:'Toplayıcının B girişi (B ⊕ X)',ph:'4 bit'},{k:'s',label:'S3..S0',ph:'4 bit'},{k:'c',label:'cout',kind:'choice',opts:YN}],
    answer:{bx:bs(bx,4),s:bs(r.s,4),c:String(r.cout)},
    hints:['XOR kapısı: 0 ⊕ b = b (tamponlar), 1 ⊕ b = b\' (ters çevirir).','Toplayıcı: S = A + (B ⊕ X) + X.'],
    solution:[`B ⊕ X = ${bs(bx,4)}${x?' (X=1, her bit terslendi)':' (X=0, B aynen)'}.`,`S = ${bs(a,4)} + ${bs(bx,4)} + ${x} = ${bs(r.s,4)}, cout = ${r.cout}.`]};
}
function genMuxAdd(){

    answer:{p:nm,s:bs(r.s,4),c:String(r.cout)},

function genMux1(ctl){
  const n=ctl.n===4?3:3,N=1<<n,ones=[...new Set(Array.from({length:rnd(2,5)},()=>rnd(0,N-1)))].sort((a,b)=>a-b);

    stmt:`F(A,B,C) = Σm(${ones.join(', ')})`,fields:[{k:'i',label:'I0 I1 I2 I3 I4 I5 I6 I7',ph:'8 bit'}],answer:{i:tv.join('')},

}
function genMuxBig(){

const GEN={fa:genFA,padd:genPadd,sub:genSub,addsub:genAddSub,muxadd:genMuxAdd,muxread:genMuxRead,mux1:genMux1,mux2:genMux2,muxbig:genMuxBig,muxcount:genMuxCount};

function randSop(){ /* random SOP over (Q1,Q0,X) as list of terms [{lits:[[var,neg],...]}] */

function genDetect(){

function genLevel(){

function genNoise(){
